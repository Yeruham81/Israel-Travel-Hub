<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Haifa museums map</title>
  <link rel="stylesheet" data-consent-href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" integrity="sha384-mnM9NG1099tBMNxdDQNDKIxYcn/fmqQXFJvbT5l1MsrWvzfxBEffceBsw75/cW2R" crossorigin="anonymous" />
  <style>
    html,body,#map{width:100%;height:100%;margin:0}
    body{font:13px/1.4 system-ui,sans-serif;background:#ecf3f8;color:#123346}
    #map{position:absolute;inset:0}
    #status{position:absolute;inset:0;display:grid;place-content:center;padding:22px;text-align:center;background:#ecf3f8f2;z-index:10}
    #status[hidden]{display:none}
    #status p{margin:0 0 12px}
    a{color:#195c9e}
    .maplibregl-popup-content{font:13px/1.5 system-ui,sans-serif;padding:10px 12px;max-width:225px}
    .maplibregl-ctrl-attrib{font:10px/1.3 system-ui,sans-serif}
    .maplibregl-ctrl-attrib a{color:#123346}
  </style>
<script defer src="/consent-embed.js" data-category="external"></script>
</head>
<body>
  <div id="map" role="region" aria-label="Map displaying ten selected museums in Haifa, including a museum closed for renovation"></div>
  <div id="status" role="status" aria-live="polite">
    <p id="message">Loading Haifa museum map…</p>
    <a id="fallback" href="https://www.google.com/maps/search/?api=1&amp;query=museums%20Haifa" target="_blank" rel="noopener noreferrer">See museums on Google Maps</a>
    <noscript>Enable JavaScript to view the interactive map.</noscript>
  </div>
  <script type="application/x-consent" data-consent-src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js" integrity="sha384-7+0QVD3+GoeOjaW35yTmpj0FR1K45ugw4ZUY0qEFomHSmAude6e9nB6/Xy5aPnzQ" crossorigin="anonymous"></script>
  <script type="application/x-consent">
    (() => {
      "use strict";
      const status = document.getElementById("status");
      const message = document.getElementById("message");
      const fallback = document.getElementById("fallback");
      const params = new URLSearchParams(location.search);
      let museums;
      try {
        const raw = params.get("points");
        if (!raw || raw.length > 3700) throw new Error("Invalid map data");
        museums = JSON.parse(raw);
        if (!Array.isArray(museums) || museums.length !== 10 || museums.some(point =>
            typeof point.id !== "string" || !/^[a-z0-9-]{2,32}$/.test(point.id) ||
            typeof point.name !== "string" || point.name.length > 85 ||
            !Number.isFinite(point.lat) || point.lat < 32.75 || point.lat > 32.85 ||
            !Number.isFinite(point.lon) || point.lon < 34.95 || point.lon > 35.04 ||
            typeof point.closed !== "boolean" ||
            typeof point.area !== "string" || !["downtown","hadar","carmel","coast"].includes(point.area)) ||
            new Set(museums.map(point => point.id)).size !== 10) throw new Error("Invalid map data");
      } catch {
        message.textContent = "Museum locations are unavailable. Please use the directions links in the guide.";
        return;
      }

      let map, popup, selectedId = null, ready = false, requestedId = null;
      const bounds = [[34.967,32.759],[35.023,32.835]];
      const unavailable = () => {
        message.textContent = "The interactive map is temporarily unavailable.";
        status.hidden = false;
      };
      const highlightSelected = () => {
        if (!map || !map.getLayer("museum-points")) return;
        map.setPaintProperty("museum-points", "circle-color", [
          "case",
          ["get", "closed"], "#866234",
          ["==", ["get", "id"], selectedId || ""], "#075b96",
          "#2779bc"
        ]);
        map.setPaintProperty("museum-points", "circle-stroke-width", [
          "case", ["==", ["get", "id"], selectedId || ""], 4, 2
        ]);
      };
      const showAll = () => {
        if (!ready) { requestedId = "all"; return; }
        selectedId = null;
        highlightSelected();
        if (popup) popup.remove();
        map.fitBounds(bounds, {padding:{top:34,bottom:34,left:34,right:34},duration:500,maxZoom:13.4});
      };
      const focus = id => {
        if (id === "all") { showAll(); return; }
        const point = museums.find(place => place.id === id);
        if (!point) return;
        if (!ready) { requestedId = id; return; }
        selectedId = id;
        highlightSelected();
        // Beyond clusterMaxZoom every museum is a separate selectable point.
        map.flyTo({center:[point.lon,point.lat],zoom:16.7,essential:true});
        if (popup) popup.remove();
        const content = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = point.name;
        content.appendChild(name);
        if (point.closed) {
          const note = document.createElement("div");
          note.textContent = "Closed for renovation — interior visits unavailable";
          note.style.marginTop = "4px";
          content.appendChild(note);
        }
        popup = new maplibregl.Popup({offset:19,closeButton:true,maxWidth:"245px"})
          .setLngLat([point.lon,point.lat]).setDOMContent(content).addTo(map);
      };
      window.addEventListener("message", event => {
        if (event.origin !== location.origin || event.source !== window.parent) return;
        const command = event.data;
        if (!command || command.type !== "haifa-museum-map-focus" || typeof command.id !== "string") return;
        focus(command.id);
      });
      if (typeof maplibregl === "undefined") { unavailable(); return; }
      const timeout = window.setTimeout(() => {if (!ready) unavailable();},16000);
      try {
        maplibregl.setWorkerCount(1);
        map = new maplibregl.Map({
          container:"map",
          style:new URL("./english-style.json",location.href).href,
          bounds,
          fitBoundsOptions:{padding:{top:34,bottom:34,left:34,right:34},maxZoom:13.4},
          attributionControl:false,
          cooperativeGestures:true,dragRotate:false,touchPitch:false,
          pitchWithRotate:false,renderWorldCopies:false,maxPitch:0,
          locale:{"NavigationControl.ZoomIn":"Zoom in","NavigationControl.ZoomOut":"Zoom out","AttributionControl.ToggleAttribution":"Toggle map credits"}
        });
        map.touchZoomRotate.disableRotation();
        map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
        map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'<a href="https://maputnik.github.io/osm-liberty/" target="_blank" rel="noopener noreferrer">OSM Liberty</a> (English labels)'}));
        map.once("load", () => {
          const features = museums.map((point,index) => ({
            type:"Feature",
            properties:{id:point.id,name:point.name,number:index+1,closed:point.closed},
            geometry:{type:"Point",coordinates:[point.lon,point.lat]}
          }));
          map.addSource("museums",{
            type:"geojson",data:{type:"FeatureCollection",features},
            cluster:true,clusterRadius:52,clusterMaxZoom:15
          });
          map.addLayer({
            id:"museum-clusters",type:"circle",source:"museums",
            filter:["has","point_count"],
            paint:{"circle-color":"#206b9d","circle-radius":["step",["get","point_count"],20,4,24,8,28],
              "circle-stroke-width":2,"circle-stroke-color":"#ffffff"}
          });
          map.addLayer({
            id:"museum-cluster-count",type:"symbol",source:"museums",
            filter:["has","point_count"],
            layout:{"text-field":["get","point_count_abbreviated"],"text-size":13,
              "text-font":["Noto Sans Bold","Open Sans Bold","Arial Unicode MS Bold"]},
            paint:{"text-color":"#ffffff"}
          });
          map.addLayer({
            id:"museum-points",type:"circle",source:"museums",
            filter:["!",["has","point_count"]],
            paint:{"circle-color":["case",["get","closed"],"#866234","#2779bc"],
              "circle-radius":15,"circle-stroke-width":2,"circle-stroke-color":"#ffffff"}
          });
          map.addLayer({
            id:"museum-numbers",type:"symbol",source:"museums",
            filter:["!",["has","point_count"]],
            layout:{"text-field":["to-string",["get","number"]],"text-size":11,
              "text-font":["Noto Sans Bold","Open Sans Bold","Arial Unicode MS Bold"]},
            paint:{"text-color":"#ffffff"}
          });
          map.on("click","museum-clusters",async event => {
            const feature = event.features && event.features[0];
            if (!feature) return;
            try {
              const source = map.getSource("museums");
              const zoom = await source.getClusterExpansionZoom(Number(feature.properties.cluster_id));
              map.easeTo({center:feature.geometry.coordinates,zoom:Math.min(zoom+0.4,17.5),duration:450});
            } catch { map.zoomIn(); }
          });
          const selectPoint = event => {
            const feature = event.features && event.features[0];
            if (!feature) return;
            const id = feature.properties.id;
            focus(id);
            window.parent.postMessage({type:"haifa-museum-map-selected",id},location.origin);
          };
          map.on("click","museum-points",selectPoint);
          map.on("click","museum-numbers",selectPoint);
          for (const layer of ["museum-clusters","museum-points","museum-numbers"]) {
            map.on("mouseenter",layer,()=>{map.getCanvas().style.cursor="pointer";});
            map.on("mouseleave",layer,()=>{map.getCanvas().style.cursor="";});
          }
          ready = true;
          window.clearTimeout(timeout);
          status.hidden = true;
          if (requestedId && requestedId !== "all") focus(requestedId);
          else showAll();
        });
        map.on("error", () => {if (!ready) unavailable();});
        window.addEventListener("pagehide", event => {
          if (!event.persisted) {window.clearTimeout(timeout);map.remove();}
        });
      } catch {
        window.clearTimeout(timeout);
        if (map) map.remove();
        unavailable();
      }
    })();
  </script>
</body>
</html>
