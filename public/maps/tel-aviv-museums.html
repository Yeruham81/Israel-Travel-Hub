<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Tel Aviv and Jaffa museums map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" integrity="sha384-mnM9NG1099tBMNxdDQNDKIxYcn/fmqQXFJvbT5l1MsrWvzfxBEffceBsw75/cW2R" crossorigin="anonymous" />
  <style>
    html,body,#map{width:100%;height:100%;margin:0}
    body{font:13px/1.4 system-ui,sans-serif;background:#ecf3f8;color:#123346}
    #map{position:absolute;inset:0}
    #status{position:absolute;inset:0;display:grid;place-content:center;padding:22px;text-align:center;background:#ecf3f8f2;z-index:10}
    #status[hidden]{display:none}
    #status p{margin:0 0 12px}
    a{color:#195c9e}
    .museum-pin{display:grid;place-items:center;width:28px;height:28px;border:2px solid #fff;border-radius:50%;background:#2779bc;color:#fff;box-shadow:0 2px 7px #12334666;cursor:pointer;font-weight:800;font-size:11px}
    .museum-pin:hover,.museum-pin:focus-visible,.museum-pin.selected{background:#0966a6;outline:3px solid #a3d9f5;outline-offset:1px;z-index:2}
    .museum-pin.closed{background:#866234}
    .museum-pin.closed.selected{background:#6f451e}
    .maplibregl-popup-content{font:13px/1.5 system-ui,sans-serif;padding:10px 12px;max-width:225px}
    .maplibregl-ctrl-attrib{font:10px/1.3 system-ui,sans-serif}
    .maplibregl-ctrl-attrib a{color:#123346}
  </style>
</head>
<body>
  <div id="map" role="region" aria-label="Map displaying all fifteen museums in Tel Aviv and Jaffa"></div>
  <div id="status" role="status" aria-live="polite">
    <p id="message">Loading museum map…</p>
    <a id="fallback" href="https://www.google.com/maps/search/?api=1&amp;query=museums%20Tel%20Aviv%20Jaffa" target="_blank" rel="noopener noreferrer">See museums on Google Maps</a>
    <noscript>Enable JavaScript to view the interactive map.</noscript>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js" integrity="sha384-7+0QVD3+GoeOjaW35yTmpj0FR1K45ugw4ZUY0qEFomHSmAude6e9nB6/Xy5aPnzQ" crossorigin="anonymous"></script>
  <script>
    (() => {
      "use strict";
      const status = document.getElementById("status");
      const message = document.getElementById("message");
      const fallback = document.getElementById("fallback");
      const params = new URLSearchParams(location.search);
      let museums;
      try {
        const raw = params.get("points");
        if (!raw || raw.length > 3700) throw new Error("Invalid map data");
        museums = JSON.parse(raw);
        if (!Array.isArray(museums) || museums.length !== 15 || museums.some(point =>
            typeof point.id !== "string" || !/^[a-z0-9-]{2,32}$/.test(point.id) ||
            typeof point.name !== "string" || point.name.length > 85 ||
            !Number.isFinite(point.lat) || point.lat < 32 || point.lat > 32.2 ||
            !Number.isFinite(point.lon) || point.lon < 34.6 || point.lon > 34.95 ||
            typeof point.closed !== "boolean" ||
            typeof point.area !== "string" || !["central","north","south","jaffa"].includes(point.area)) ||
            new Set(museums.map(point => point.id)).size !== 15) throw new Error("Invalid map data");
      } catch {
        message.textContent = "Museum locations are unavailable. Please use the directions links in the guide.";
        return;
      }

      let map, popup, markers = new Map(), selectedId = null, ready = false, requestedId = null;
      const unavailable = () => {
        message.textContent = "The interactive map is temporarily unavailable.";
        status.hidden = false;
      };
      const bounds = [[34.743,32.046],[34.814,32.121]];
      const showAll = () => {
        if (!ready) { requestedId = "all"; return; }
        selectedId = null;
        for (const [id, el] of markers) el.classList.toggle("selected", false);
        if (popup) popup.remove();
        map.fitBounds(bounds, {padding: {top:34,bottom:34,left:34,right:34}, duration:500, maxZoom:13.4});
      };
      const focus = id => {
        if (id === "all") { showAll(); return; }
        const point = museums.find(place => place.id === id);
        if (!point) return;
        if (!ready) { requestedId = id; return; }
        selectedId = id;
        for (const [markerId, el] of markers) el.classList.toggle("selected", markerId === id);
        map.flyTo({center:[point.lon,point.lat],zoom:15.2,essential:true});
        if (popup) popup.remove();
        const content = document.createElement("div");
        const name = document.createElement("strong");name.textContent = point.name;
        content.appendChild(name);
        if (point.closed) {
          const note = document.createElement("div");
          note.textContent = "Closed until further notice for restoration";
          note.style.marginTop = "4px";
          content.appendChild(note);
        }
        popup = new maplibregl.Popup({offset:20,closeButton:true,maxWidth:"245px"}).setLngLat([point.lon,point.lat]).setDOMContent(content).addTo(map);
      };
      window.addEventListener("message", event => {
        if (event.origin !== location.origin || event.source !== window.parent) return;
        const command = event.data;
        if (!command || command.type !== "tel-aviv-museum-map-focus" || typeof command.id !== "string") return;
        focus(command.id);
      });
      if (typeof maplibregl === "undefined") { unavailable(); return; }
      const timeout = window.setTimeout(() => {if(!ready)unavailable()},16000);
      try {
        maplibregl.setWorkerCount(1);
        map = new maplibregl.Map({
          container:"map",
          style:new URL("./english-style.json",location.href).href,
          bounds,
          fitBoundsOptions:{padding:{top:34,bottom:34,left:34,right:34},maxZoom:13.4},
          attributionControl:false,
          cooperativeGestures:true, dragRotate:false,touchPitch:false,
          pitchWithRotate:false,renderWorldCopies:false,maxPitch:0,
          locale:{"NavigationControl.ZoomIn":"Zoom in","NavigationControl.ZoomOut":"Zoom out","AttributionControl.ToggleAttribution":"Toggle map credits"}
        });
        map.touchZoomRotate.disableRotation();
        map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
        map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'<a href="https://maputnik.github.io/osm-liberty/" target="_blank" rel="noopener noreferrer">OSM Liberty</a> (English labels)'}));
        museums.forEach((point,index) => {
          const el = document.createElement("button");
          el.type="button";
          el.className = "museum-pin" + (point.closed ? " closed" : "");
          el.textContent = String(index+1);
          el.title=point.name+(point.closed?" (temporarily closed)":"");
          el.setAttribute("aria-label","Focus on "+point.name);
          el.addEventListener("click",()=> {
            focus(point.id);
            window.parent.postMessage({type:"tel-aviv-museum-map-selected",id:point.id},location.origin);
          });
          new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([point.lon,point.lat]).addTo(map);
          markers.set(point.id,el);
        });
        map.once("load",()=>{
          ready=true;
          window.clearTimeout(timeout);
          status.hidden=true;
          if (requestedId && requestedId!=="all") focus(requestedId);
          else showAll();
        });
        map.on("error",()=>{if(!ready)unavailable()});
        window.addEventListener("pagehide",e=>{if(!e.persisted){window.clearTimeout(timeout);map.remove()}});
      }catch{
        window.clearTimeout(timeout);
        if(map)map.remove();
        unavailable();
      }
    })();
  </script>
</body>
</html>
