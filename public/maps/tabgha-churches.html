<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabgha churches — map of two sites</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f0f3ee; }
    .church-pin {
      display: grid; place-items: center; box-sizing: border-box;
      width: 30px !important; height: 30px !important;
      border-radius: 50%; border: 3px solid #fff;
      background: #155e88; color: #fff; font-size: 14px; font-weight: 700;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .35);
    }
    .leaflet-container { background: #e6eee7; }
    .leaflet-popup-content { font: 600 13px/1.4 system-ui, sans-serif; margin: 9px 12px; }
    .leaflet-control-attribution { font-size: 10px !important; }
    .fallback { position: absolute; z-index: 1; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: #334155; }
  </style>
</head>
<body>
  <div id="map" role="img" aria-label="Interactive map with two separate markers: 1, Church of the Multiplication; 2, Church of the Primacy of Peter. No route is drawn.">
    <p class="fallback">Map unavailable. Use the separate church directions linked below the map.</p>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      if (!window.L) return;
      const multiplication = [32.87326, 35.54955];
      const primacy = [32.871858, 35.5503];
      const map = L.map("map", { scrollWheelZoom: false, zoomControl: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
      }).addTo(map);
      const mark = (position, number, name) => L.marker(position, {
        icon: L.divIcon({ className: "church-pin", html: number, iconSize: [30, 30], iconAnchor: [15, 15] }),
        title: name,
        keyboard: true
      }).addTo(map).bindPopup(name);
      mark(multiplication, "1", "Church of the Multiplication");
      mark(primacy, "2", "Church of the Primacy of Peter");
      map.fitBounds([multiplication, primacy], { padding: [35, 42], maxZoom: 16 });
      const fallback = document.querySelector(".fallback");
      if (fallback) fallback.remove();
    }());
  </script>
</body>
</html>
