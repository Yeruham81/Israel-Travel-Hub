<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Mount of Olives visitor map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" integrity="sha384-mnM9NG1099tBMNxdDQNDKIxYcn/fmqQXFJvbT5l1MsrWvzfxBEffceBsw75/cW2R" crossorigin="anonymous" />
  <style>
    html,body,#map{margin:0;width:100%;height:100%}
    body{font:13px/1.4 system-ui,sans-serif;background:#ecf3f8;color:#123346}
    #map{position:absolute;inset:0}
    #status{position:absolute;inset:0;z-index:2;display:grid;place-content:center;padding:22px;text-align:center;background:#ecf3f8f2}
    #status[hidden]{display:none}
    #status p{margin:0 0 12px}
    a{color:#195c9e}
    .maplibregl-popup-content{font:13px/1.5 system-ui,sans-serif;max-width:225px;padding:10px 12px}
    .maplibregl-ctrl-attrib{font:10px/1.3 system-ui,sans-serif}
  </style>
</head>
<body>
  <div id="map" role="region" aria-label="Interactive map of eight Mount of Olives visitor stops and the Old City connection"></div>
  <div id="status" role="status" aria-live="polite">
    <p id="message">Loading Mount of Olives visitor map…</p>
    <a href="https://www.google.com/maps/search/?api=1&amp;query=Mount%20of%20Olives%20Jerusalem" target="_blank" rel="noopener noreferrer">See the Mount of Olives on Google Maps</a>
    <noscript>Enable JavaScript for the interactive map.</noscript>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js" integrity="sha384-7+0QVD3+GoeOjaW35yTmpj0FR1K45ugw4ZUY0qEFomHSmAude6e9nB6/Xy5aPnzQ" crossorigin="anonymous"></script>
  <script>
    (() => {
      "use strict";
      const status=document.getElementById("status");
      const message=document.getElementById("message");
      const bounds=[[35.2353,31.7745],[35.2465,31.7818]];
      let points;
      try {
        const raw=new URLSearchParams(location.search).get("points");
        if (!raw||raw.length>2500)throw Error("Invalid points");
        points=JSON.parse(raw);
        const validIds=["pater-noster","ascension","viewpoint","dominus-flevit","mary-magdalene","gethsemane","mary-tomb","lions-gate"];
        if (!Array.isArray(points)||points.length!==8||points.some((p,i)=>p.id!==validIds[i]||
          typeof p.name!=="string"||p.name.length>75||
          !Number.isFinite(p.lat)||p.lat<31.77||p.lat>31.79||
          !Number.isFinite(p.lon)||p.lon<35.23||p.lon>35.26))throw Error("Invalid map points");
      } catch {
        message.textContent="Map markers are unavailable. Use the walking links in the guide.";
        return;
      }
      if(typeof maplibregl==="undefined"){message.textContent="The map is unavailable. Use the walking links in the guide.";return}
      let map, popup, selected=null, ready=false, requested=null;
      const showAll=()=>{
        if(!ready){requested="all";return}
        selected=null;
        if(popup)popup.remove();
        recolor();
        map.fitBounds(bounds,{padding:{top:32,bottom:32,left:32,right:32},maxZoom:16.4,duration:350});
      };
      const recolor=()=>{
        if(!map||!map.getLayer("stop-points"))return;
        map.setPaintProperty("stop-points","circle-color",["case",["==",["get","id"],selected||""],"#0c548b",["get","color"]]);
        map.setPaintProperty("stop-points","circle-stroke-width",["case",["==",["get","id"],selected||""],4,2]);
      };
      const focus=id=>{
        if(id==="all"){showAll();return}
        const p=points.find(point=>point.id===id);
        if(!p)return;
        if(!ready){requested=id;return}
        selected=id;
        recolor();
        map.flyTo({center:[p.lon,p.lat],zoom:17,essential:true});
        if(popup)popup.remove();
        const node=document.createElement("div");
        const title=document.createElement("strong");title.textContent=p.name;node.appendChild(title);
        const link=document.createElement("a");
        link.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+", Jerusalem");
        link.target="_blank";link.rel="noopener noreferrer";link.textContent="Open in Google Maps";
        link.style.display="block";link.style.marginTop="7px";node.appendChild(link);
        popup=new maplibregl.Popup({offset:20,closeButton:true,maxWidth:"240px"}).setLngLat([p.lon,p.lat]).setDOMContent(node).addTo(map);
      };
      window.addEventListener("message",event=>{
        if(event.origin!==location.origin||event.source!==window.parent)return;
        const command=event.data;
        if(!command||command.type!=="mount-olives-map-focus"||typeof command.id!=="string")return;
        focus(command.id);
      });
      const timeout=setTimeout(()=>{if(!ready)message.textContent="The interactive map is temporarily unavailable. Use the Google Maps link.";},16000);
      try {
        maplibregl.setWorkerCount(1);
        map=new maplibregl.Map({
          container:"map",style:new URL("./english-style.json",location.href).href,
          bounds,fitBoundsOptions:{padding:{top:32,bottom:32,left:32,right:32},maxZoom:16.4},
          cooperativeGestures:true,dragRotate:false,touchPitch:false,pitchWithRotate:false,
          attributionControl:false,renderWorldCopies:false,maxPitch:0
        });
        map.touchZoomRotate.disableRotation();
        map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
        map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'<a href="https://maputnik.github.io/osm-liberty/" target="_blank" rel="noopener noreferrer">OSM Liberty</a>'}));
        map.once("load",()=>{
          const features=points.map((point,i)=>({
            type:"Feature",properties:{id:point.id,name:point.name,number:i+1,color:i<3?"#1d5d96":i===7?"#9a6419":"#15803d"},
            geometry:{type:"Point",coordinates:[point.lon,point.lat]}
          }));
          map.addSource("stops",{type:"geojson",data:{type:"FeatureCollection",features}});
          map.addLayer({id:"stop-points",type:"circle",source:"stops",
            paint:{"circle-color":["get","color"],"circle-radius":15,"circle-stroke-width":2,"circle-stroke-color":"#fff"}});
          map.addLayer({id:"stop-labels",type:"symbol",source:"stops",
            layout:{"text-field":["to-string",["get","number"]],"text-size":12,"text-font":["Noto Sans Bold","Open Sans Bold","Arial Unicode MS Bold"]},
            paint:{"text-color":"#fff"}});
          const pick=e=>{
            const feat=e.features&&e.features[0];if(!feat)return;
            focus(feat.properties.id);
            window.parent.postMessage({type:"mount-olives-map-selected",id:feat.properties.id},location.origin);
          };
          for(const layer of ["stop-points","stop-labels"]){
            map.on("click",layer,pick);
            map.on("mouseenter",layer,()=>map.getCanvas().style.cursor="pointer");
            map.on("mouseleave",layer,()=>map.getCanvas().style.cursor="");
          }
          ready=true;clearTimeout(timeout);status.hidden=true;
          if(requested&&requested!=="all")focus(requested);else showAll();
        });
        map.on("error",()=>{if(!ready)message.textContent="The interactive map is temporarily unavailable. Use the Google Maps link.";});
        window.addEventListener("pagehide",event=>{if(!event.persisted){clearTimeout(timeout);map.remove();}});
      }catch{
        clearTimeout(timeout);if(map)map.remove();
        message.textContent="The interactive map is temporarily unavailable. Use the Google Maps link.";
      }
    })();
  </script>
</body>
</html>
