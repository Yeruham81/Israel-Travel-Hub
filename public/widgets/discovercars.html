  <style>html,body{margin:0;padding:0;background:transparent}body{width:100%;overflow-x:hidden}iframe{max-width:100%;border:0}</style>
<script defer src="/consent-embed.js" data-category="marketing"></script>
</head>
<body>
  <script type="application/x-consent">
    // The approved provider widget runs in its own document so route changes
    // dispose its listeners and nested iframe together.
    (() => {
      const send = () => {
        const height = Math.ceil(document.body.getBoundingClientRect().height);
        if (height > 0) parent.postMessage({ type: "itt-discovercars-height", height }, location.origin);
      };
      new ResizeObserver(send).observe(document.body);
      window.addEventListener("load", send);
      window.addEventListener("error", event => {
        if (event.target instanceof HTMLScriptElement) {
          parent.postMessage({ type: "itt-discovercars-error" }, location.origin);
        }
      }, true);
    })();
  </script>
