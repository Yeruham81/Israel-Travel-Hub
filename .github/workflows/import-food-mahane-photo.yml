name: Import attributed Mahane Yehuda food stalls photo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-food-mahane-photo.yml"
permissions:
  contents: write
concurrency:
  group: israel-food-guide-commons-import
  cancel-in-progress: false
jobs:
  import:
    if: contains(github.event.head_commit.message, '[food-photo-import]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and optimize photographer credited photo from Wikimedia Commons
        run: |
          python -m pip install --disable-pip-version-check -q Pillow
          python scripts/import-food-mahane-photo.py
      - name: Commit new local WebP image for the food guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/food-guide/mahane-yehuda-food-stalls.webp
          if git diff --cached --quiet; then echo "No image changes"; exit 0; fi
          git commit -m "Add attributed cropped Mahane Yehuda food stall photo"
          git pull --rebase origin main
          git push origin HEAD:main
