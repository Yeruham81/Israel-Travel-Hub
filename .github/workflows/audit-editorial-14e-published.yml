name: Stage 14E - read-only published editorial audit
on:
  push:
    branches: [audit/editorial-14e-published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check current production HTML against approved editorial samples
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          import re, time
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip=0
                  self.parts=[]
                  self.ids=set()
                  self.notes=0
                  self.canon=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag in ('script','style','template'): self.skip+=1
                  if 'id' in a: self.ids.add(a['id'])
                  if a.get('data-testid')=='seven-day-transfer-times-note': self.notes+=1
                  if tag=='link' and a.get('rel')=='canonical': self.canon.append(a.get('href'))
              def handle_endtag(self,tag):
                  if tag in ('script','style','template') and self.skip: self.skip-=1
              def handle_data(self,d):
                  if not self.skip: self.parts.append(d)
          origin='https://www.israel-taxi.com'
          tests=[
              ('/', ['TripAdvisor'], []),
              ('/private-driver-in-israel/', ['Get a quote','solo travelers'], ['Request a personal quote']),
              ('/privacy-policy/', ['Inquiries, forms and your choices'], ['Enquiries, forms and your choices']),
              ('/travel-blog/ben-gurion-airport-to-haifa/', ['A standard adult train ticket costs ₪30.50','Standard adult one-way public transport fares, updated November 2026'], ['Check the current fare and make sure your train stops']),
              ('/attractions/mount-tabor/', ['Entry to Mount Tabor is free'], ['The Israel Nature and Parks Authority lists free entry to Mount Tabor']),
              ('/attractions/tel-megiddo/', ['Facilities include a museum, an explanatory film and visitor services near the entrance'], ['The official site lists a museum, explanatory film']),
              ('/attractions/mount-zion/', ['Follow a short circuit for the main landmarks'], ['This guide helps you choose a route, check visiting hours and find each entrance']),
              ('/travel-blog/churches-in-jerusalem/', ['Holy Sepulchre, Via Dolorosa and historic churches','Pilgrimage churches in a historic hillside village'], []),
              ('/travel-blog/israel-itinerary-7-days/', ['The times shown are for sightseeing only'], []),
              ('/shore-excursions/ashdod/', ['Confirm availability for your sailing date, total price, port access and return arrangements with the operator'], []),
              ('/shore-excursions/haifa/', ['Confirm availability for your sailing date, total price, port access and return arrangements with the operator'], []),
          ]
          errors=[]
          for path, required, removed in tests:
              try:
                  request=Request(origin+path,headers={'User-Agent':'IsraelTravelHub-EditorialAudit/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
                  with urlopen(request,timeout=20) as response:
                      html=response.read().decode('utf-8')
                      status=response.status
                      cache=response.headers.get('X-LiteSpeed-Cache','')
                  p=Page(); p.feed(html)
                  body=re.sub(r'\s+',' ',' '.join(p.parts))
                  normalize=lambda s:re.sub(r'\s+',' ',s)
                  issues=[f'missing: {s}' for s in required if normalize(s) not in body]
                  issues += [f'old wording: {s}' for s in removed if normalize(s) in body]
                  if status!=200: issues.append(f'HTTP {status}')
                  if p.canon!=[origin+path]: issues.append(f'canonical: {p.canon}')
                  if path.endswith('7-days/') and p.notes!=1: issues.append(f'transfer time note count: {p.notes}')
                  if path=='/private-driver-in-israel/' and 'request-quote' not in p.ids: issues.append('quote anchor missing')
                  if path=='/privacy-policy/' and 'enquiries' not in p.ids: issues.append('legacy privacy anchor missing')
                  if '/shore-excursions/' in path and body.count(required[0])!=1: issues.append(f'repeated note count: {body.count(required[0])}')
                  print(f'{path}: HTTP {status}, cache={cache}, '+('PASS' if not issues else 'FAIL: '+'; '.join(issues)),flush=True)
                  errors.extend(path+' '+issue for issue in issues)
              except Exception as exc:
                  print(f'{path}: ERROR {exc}',flush=True); errors.append(f'{path}: {exc}')
              time.sleep(.2)
          print(f'Checked {len(tests)} production pages; {len(errors)} discrepancies',flush=True)
          if errors: raise SystemExit(1)
          PY
