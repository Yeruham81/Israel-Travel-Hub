name: Read-only local market photo review
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-local-food-images.yml"
permissions:
  contents: read
jobs:
  preview:
    if: contains(github.event.head_commit.message, '[food-image-review]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q Pillow && python scripts/inspect-local-food-images.py
      - uses: actions/upload-artifact@v4
        with:
          name: food-market-local-photo-review
          path: /tmp/food-review/market-candidates.jpg
          retention-days: 2
