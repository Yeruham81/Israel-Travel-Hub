name: Generate optimized mobile hero photos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-mobile-hero-images.yml

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image optimizer
        run: python3 -m pip install --quiet --user Pillow
      - name: Re-encode mobile hero photo variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          for path in sorted(Path("src/assets/home").glob("hero-*-sm.webp")):
              dest = path.with_name(path.stem + "-optimized.webp")
              with Image.open(path) as image:
                  src = ImageOps.exif_transpose(image).convert("RGB")
                  before = src.size
                  src.thumbnail((960, 960), Image.Resampling.LANCZOS)
                  src.save(dest, format="WEBP", quality=58, method=6)
                  # Preserve the old asset whenever a variant is unexpectedly
                  # larger; only keep genuinely smaller mobile assets.
                  if dest.stat().st_size >= path.stat().st_size:
                      dest.unlink()
                      print(f"unchanged {path.name}: {before}")
                  else:
                      print(f"{path.name} {before} {path.stat().st_size} -> {dest.name} {src.size} {dest.stat().st_size}")
          PY
      - name: Commit optimized mobile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/home/hero-*-sm-optimized.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add smaller mobile WebP hero images without changing other image variants'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
