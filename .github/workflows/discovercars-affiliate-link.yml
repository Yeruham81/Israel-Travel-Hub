name: Generate DiscoverCars Israel Travelpayouts affiliate link

on:
  push:
    branches: [main]
    paths:
      - 'scripts/travelpayouts/generate-discovercars.mjs'
      - '.github/workflows/discovercars-affiliate-link.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate link generator
        run: node --check scripts/travelpayouts/generate-discovercars.mjs
      - name: Generate link with protected Travelpayouts API token
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/generate-discovercars.mjs
      - name: Upload verified link for implementation
        uses: actions/upload-artifact@v4
        with:
          name: discovercars-israel-deeplink
          path: artifacts/discovercars-israel-link.json
          if-no-files-found: error
          retention-days: 14
