name: Import Mount of Olives cemetery photo and tour link
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-mount-olives-cemetery.yml']
permissions:
  contents: write
jobs:
  import:
    if: contains(github.event.head_commit.message, '[mount-olives-assets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare licensed, compressed cemetery photo
        run: |
          set -euo pipefail
          mkdir -p public/images/jerusalem/mount-of-olives
          curl -fLsS --retry 4 --retry-delay 3 --max-time 90 -A "IsraelTravelHub/1.0 (photo attribution, local copy)" -o /tmp/mount-olives-cemetery.jpg 'https://upload.wikimedia.org/wikipedia/commons/9/95/Jerusalem_Mount_of_Olives_BW_2010-09-20_07-57-31.JPG'
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          path='/tmp/mount-olives-cemetery.jpg'
          im=Image.open(path).convert('RGB')
          im.thumbnail((800,800),Image.Resampling.LANCZOS)
          output='public/images/jerusalem/mount-of-olives/jewish-cemetery.webp'
          im.save(output,format='WEBP',quality=76,method=6)
          import os
          print('Cemetery image dimensions',im.size,'bytes',os.path.getsize(output))
          PY
      - name: Commit optimized image to the repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/jerusalem/mount-of-olives/jewish-cemetery.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add licensed Mount of Olives cemetery photograph"
            git push
          fi
      - name: Generate third Viator tour partner link with Travelpayouts
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.TRAVELPAYOUTS_API_TOKEN;
          if(!token){console.log('Partner URL generation unavailable: Travelpayouts secret not configured');process.exit(0)}
          const url='https://www.viator.com/tours/Jerusalem/jerusalem-daily-tour/d921-208675P3';
          const res=await fetch('https://api.travelpayouts.com/links/v1/create',{method:'POST',
            headers:{'Content-Type':'application/json','X-Access-Token':token},
            body:JSON.stringify({trs:406243,marker:622032,shorten:true,links:[{url,sub_id:'mount_olives_jerusalem_classic'}]}),
            signal:AbortSignal.timeout(25000)});
          if(!res.ok){console.log('Partner link API HTTP '+res.status);process.exit(0)}
          const data=await res.json();
          const entry=data?.result?.links?.find(x=>x.url===url);
          const link=entry?.partner_url||'';
          if(entry?.code==='success'&&/^https:\/\/viator\.(?:tpk\.lv|tpm\.li|tp\.st)\//.test(link))console.log('MOUNT_OLIVES_VIATOR_PARTNER_URL='+link);
          else console.log('Partner URL not confirmed; keep third card in editorial-only mode');
          JS
