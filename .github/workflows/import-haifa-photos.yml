name: Import licensed Haifa neighbourhood photographs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-haifa-photos.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download credited Wikimedia originals and create optimized WebP images
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          cat >/tmp/import_haifa.py <<'PY'
          import io, json, urllib.parse, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          photos = {
            "haifa-german-colony.webp": "150421 haifa - ben gurion boulevard PikiWiki Israel.jpg",
            "haifa-wadi-nisnas.webp": "Street Scene - Wadi Nisnas Neighborhood - Haifa - Israel - 01 (5690594824).jpg",
            "haifa-turkish-market.webp": "110861 haifa - the turkish market PikiWiki Israel.jpg",
            "haifa-bat-galim.webp": "111718 haifa, a view of the bat galim neighborhood PikiWiki Israel.jpg",
          }
          headers = {"User-Agent": "IsraelTravelHubEditor/1.0 (travel guide attribution checks; github-actions)", "Accept": "application/json,image/jpeg,*/*"}
          for output, filename in photos.items():
            query = urllib.parse.urlencode({"action":"query", "format":"json", "prop":"imageinfo", "iiprop":"url", "iiurlwidth":"960", "titles":"File:"+filename})
            request = urllib.request.Request("https://commons.wikimedia.org/w/api.php?"+query, headers=headers)
            with urllib.request.urlopen(request, timeout=45) as resp:
              data = json.load(resp)
            infos = [page["imageinfo"][0] for page in data["query"]["pages"].values() if page.get("imageinfo")]
            assert len(infos) == 1, f"Missing verified Commons image {filename}"
            original = infos[0]["url"]
            thumb = infos[0].get("thumburl") or original
            # Commons direct originals can 429 shared GitHub runners. Prefer the
            # smaller thumbnail; fall back to independently cached image proxy.
            candidates = [
              thumb,
              "https://wsrv.nl/?url=" + urllib.parse.quote(thumb, safe="") + "&w=900",
              "https://images.weserv.nl/?url=" + urllib.parse.quote(original, safe="") + "&w=900",
            ]
            raw = None
            for candidate in candidates:
              try:
                request = urllib.request.Request(candidate, headers=headers)
                with urllib.request.urlopen(request, timeout=75) as resp:
                  result = resp.read()
                if len(result) > 9000:
                  raw = result
                  print("Downloaded",filename,"via",urllib.parse.urlsplit(candidate).netloc)
                  break
              except Exception as ex:
                print("Image host unavailable, trying fallback:", type(ex).__name__, str(ex)[:125])
            assert raw is not None, f"Failed all authorized mirrors for {filename}"
            image = ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert("RGB")
            assert image.width >= 800 and image.height >= 600, filename
            image.thumbnail((900,700), Image.Resampling.LANCZOS)
            target = Path("public/images/attractions")/output
            target.parent.mkdir(parents=True, exist_ok=True)
            image.save(target, "WEBP", quality=82, method=6)
            assert 5000 < target.stat().st_size < 260000, (filename,target.stat().st_size)
            print("Imported", filename, "as", target, image.size, target.stat().st_size)
          PY
          python /tmp/import_haifa.py
      - name: Commit and publish the four local Haifa photographs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/attractions/haifa-german-colony.webp public/images/attractions/haifa-wadi-nisnas.webp public/images/attractions/haifa-turkish-market.webp public/images/attractions/haifa-bat-galim.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add four licensed Haifa neighbourhood WebP photographs'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
