name: Full Project Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      VITE_INDEXABLE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bash scripts/install-ci-dependencies.sh

      # TanStack Router regenerates routeTree.gen.ts at build time.
      # Build first so type-checking sees any newly added file routes.
      - name: Build production version
        run: bun run build

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run all tests
        run: bun run test

      # Match the same static build that will be published to Premium hosting.
      # Running only the ordinary SSR build can miss prerender-specific failures.
      - name: Validate Hostinger prerender before any deployment is eligible
        env:
          HOSTINGER_STATIC_BUILD: "true"
          VITE_CANONICAL_ORIGIN: ${{ vars.HOSTINGER_CANONICAL_ORIGIN || 'https://saddlebrown-guanaco-454061.hostingersite.com' }}
          VITE_INDEXABLE: ${{ vars.HOSTINGER_INDEXABLE || 'false' }}
        run: |
          bash scripts/build-validated-static.sh
          node scripts/verify-hostinger-static-export.mjs
