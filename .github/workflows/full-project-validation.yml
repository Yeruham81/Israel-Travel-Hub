name: Full Project Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      VITE_INDEXABLE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test deployment storage maintenance in isolated fixtures
        run: python3 scripts/test-deployment-storage.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bash scripts/install-ci-dependencies.sh

      # TanStack Router regenerates routeTree.gen.ts at build time.
      # Build first so type-checking sees any newly added file routes.
      - name: Build production version
        run: bun run build

      - name: Check TypeScript
        run: npx tsc --noEmit

      # Opt-in diagnostics: reuse the installed dependencies and generated routes.
      # Unused declarations are reported, never a deployment gate.
      - name: Audit unused TypeScript declarations (non-blocking)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[unused-audit]')) }}
        continue-on-error: true
        shell: bash
        run: |
          report="$RUNNER_TEMP/unused-typescript.txt"
          status=0
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters > "$report" 2>&1 || status=$?
          cat "$report"
          echo "TypeScript diagnostic exit code: $status"
          python3 - "$report" "$status" <<'PY'
          import collections
          import os
          import pathlib
          import re
          import sys

          report = pathlib.Path(sys.argv[1]).read_text()
          status = int(sys.argv[2])
          unused_codes = {"6133", "6138", "6192", "6196", "6198"}
          counts = collections.Counter()
          files = collections.Counter()
          other = []
          for line in report.splitlines():
              match = re.match(r"^(.+?)\(\d+,\d+\): error TS(\d+):", line)
              if match:
                  path, code = match.groups()
                  if code in unused_codes:
                      counts[code] += 1
                      files[path] += 1
                  else:
                      other.append(line)
              elif re.search(r"\berror TS\d+:", line):
                  other.append(line)

          total = sum(counts.values())
          print(f"UNUSED_AUDIT: {total} diagnostics across {len(files)} files; {len(other)} other diagnostics")
          summary = [
              "### Optional TypeScript unused-declaration audit",
              f"- Unused-declaration diagnostics: {total}",
              f"- Files affected: {len(files)}",
              f"- Other compiler diagnostics: {len(other)}",
              f"- Compiler exit code: {status}",
              "",
              "| Diagnostic | Count |", "|---|---:|",
              *[f"| TS{code} | {count} |" for code, count in sorted(counts.items())],
              "",
              "| Source file | Diagnostics |", "|---|---:|",
              *[f"| `{path}` | {count} |" for path, count in files.most_common()],
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(summary) + "\n")
          if other or (status and not total):
              print("::warning::Unused-declaration audit may be incomplete; inspect compiler output.")
              sys.exit(1)
          PY

      - name: Run regression tests (editorial layout checks on manual runs only)
        env:
          CI_FUNCTIONAL_ONLY: ${{ github.event_name != 'workflow_dispatch' }}
        run: bun run test

      # Match the same static build that will be published to Premium hosting.
      # Running only the ordinary SSR build can miss prerender-specific failures.
      - name: Validate Hostinger prerender before any deployment is eligible
        env:
          HOSTINGER_STATIC_BUILD: "true"
          VITE_CANONICAL_ORIGIN: ${{ vars.HOSTINGER_CANONICAL_ORIGIN || 'https://saddlebrown-guanaco-454061.hostingersite.com' }}
          VITE_INDEXABLE: ${{ vars.HOSTINGER_INDEXABLE || 'false' }}
        run: |
          bash scripts/build-validated-static.sh
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/verify-hostinger-static-export.mjs --editorial
          else
            node scripts/verify-hostinger-static-export.mjs
          fi
