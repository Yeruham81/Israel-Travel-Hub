name: Full Project Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      VITE_INDEXABLE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test deployment storage maintenance in isolated fixtures
        run: python3 scripts/test-deployment-storage.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bash scripts/install-ci-dependencies.sh

      - name: Validate operational scripts without external API calls
        shell: bash
        env:
          TRAVELPAYOUTS_API_TOKEN: ""
        run: |
          set -euo pipefail
          git ls-files -z scripts | while IFS= read -r -d '' script; do
            case "$script" in
              *.js|*.mjs|*.cjs) node --check "$script" ;;
              *.sh) bash -n "$script" ;;
            esac
          done
          for script in generate-airport-platforms generate-bethlehem-category-tours generate-bethlehem-tours generate-deadsea-tours generate-food-eilat-tours generate-galilee-tours generate-jerusalem-tours generate-masada-tours generate-negev-golan-tours generate-northern-coast-tours generate-seven-missing-links generate-shore-excursions generate-tel-aviv-tours; do
            node "scripts/travelpayouts/$script.mjs" --validate
          done
          node scripts/travelpayouts/generate-links.mjs --validate
          for input in remaining-hotels paamonim-hotel jerusalem-neighborhood-fifth-hotels haifa-browse; do
            node scripts/travelpayouts/generate-links.mjs "scripts/travelpayouts/$input.json" --validate
          done
          node --test scripts/israel-events-source.test.mjs scripts/travelpayouts/registry-source.test.mjs

      - name: Test rendered photo attribution audit
        run: node --test scripts/verify-photo-credits.test.mjs

      - name: Test image alternative text audit
        run: node --test scripts/verify-image-alts.test.mjs

      # TanStack Router regenerates routeTree.gen.ts at build time.
      # Build first so type-checking sees any newly added file routes.
      - name: Build production version
        run: bun run build

      - name: Enforce ESLint with zero warnings
        run: bun run lint

      - name: Enforce authored code and configuration formatting
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          import prettier from "prettier";

          const generated = new Set([
            "src/routeTree.gen.ts",
            "src/data/generated/guide-directory.ts",
            "src/data/israelEventFeed.generated.json",
            "src/data/attractionHubResponsivePhotos.ts",
            "src/data/travelBlogHubResponsivePhotos.ts",
            "public/data/boi-exchange-rates.json",
            "public/sitemap.xml",
            "public/robots.txt",
            "bun.lock",
          ]);
          // Exact pre-existing exceptions from the final baseline, pending
          // separate review of CSS and standalone browser assets. New files
          // are not exempt. Documentation and archived workflows are out of scope.
          const deferred = new Set([
            "src/styles.css",
            "public/consent-embed.js",
            "public/maps/akko-attractions.html",
            "public/maps/area.html",
            "public/maps/dead-sea-attractions.html",
            "public/maps/english-style.json",
            "public/maps/haifa-museums.html",
            "public/maps/jaffa-attractions.html",
            "public/maps/jerusalem-churches.html",
            "public/maps/jerusalem-museums.html",
            "public/maps/jerusalem-old-city.html",
            "public/maps/jerusalem-shopping.html",
            "public/maps/mount-of-olives.html",
            "public/maps/mount-zion.html",
            "public/maps/shore-destinations.html",
            "public/maps/tel-aviv-attractions.html",
            "public/maps/tel-aviv-beaches.html",
            "public/maps/tel-aviv-museums.html",
            "public/maps/top-ten-israel.html",
            "public/maps/via-dolorosa.html",
            "public/widgets/discovercars.html",
          ]);
          const eligible = (file) => {
            if (generated.has(file) || file.startsWith("docs/") || file.endsWith(".md")) return false;
            if (/^\.github\/.*\.ya?ml$/.test(file)) return true;
            if (file.startsWith("src/")) return /\.(?:[jt]sx?|[cm][jt]s|css|json)$/.test(file);
            if (file.startsWith("scripts/")) return /\.(?:[cm]?[jt]s|[jt]sx|json)$/.test(file);
            if (file.startsWith("public/")) return /\.(?:js|mjs|css|json|html)$/.test(file);
            return !file.includes("/") && (/\.(?:[cm]?[jt]s|json)$/.test(file) || file === ".prettierrc");
          };
          const files = execFileSync("git", ["ls-files", "-z"]).toString().split("\0").filter(Boolean);
          const failures = [];
          const exceptions = [];
          let checked = 0;
          for (const file of files.filter(eligible)) {
            const info = await prettier.getFileInfo(file, { ignorePath: ".prettierignore", withNodeModules: false });
            if (info.ignored || !info.inferredParser) {
              failures.push(file + " (unexpected ignored or unsupported file)");
              continue;
            }
            const source = fs.readFileSync(file, "utf8");
            const options = await prettier.resolveConfig(file);
            try {
              const formatted = await prettier.format(source, { ...options, filepath: file });
              checked++;
              if (source === formatted) continue;
              if (deferred.has(file)) exceptions.push(file);
              else failures.push(file);
            } catch (error) {
              failures.push(file + " (parser error: " + error.message + ")");
            }
          }
          console.log("Checked authored files:", checked);
          console.log("Existing deferred formatting gaps:", exceptions.length, exceptions);
          if (failures.length) {
            console.error("Formatting gate failed:", failures);
            process.exitCode = 1;
          }
          if (checked === 0) throw Error("Formatting scope is empty");
          JS

      - name: Check TypeScript including unused declarations
        run: npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters

      - name: Run regression tests (editorial layout checks on manual runs only)
        env:
          CI_FUNCTIONAL_ONLY: ${{ github.event_name != 'workflow_dispatch' }}
        run: bun run test

      # Match the same static build that will be published to Premium hosting.
      # Running only the ordinary SSR build can miss prerender-specific failures.
      - name: Validate Hostinger prerender before any deployment is eligible
        env:
          HOSTINGER_STATIC_BUILD: "true"
          VITE_CANONICAL_ORIGIN: ${{ vars.HOSTINGER_CANONICAL_ORIGIN || 'https://saddlebrown-guanaco-454061.hostingersite.com' }}
          VITE_INDEXABLE: ${{ vars.HOSTINGER_INDEXABLE || 'false' }}
        run: |
          bash scripts/build-validated-static.sh
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/verify-hostinger-static-export.mjs --editorial
          else
            node scripts/verify-hostinger-static-export.mjs
          fi
