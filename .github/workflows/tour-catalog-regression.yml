name: Tour catalog regression
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: tours-regression-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    name: Validate linked tour catalog routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      VITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/install-ci-dependencies.sh
      # Regenerate the TanStack route tree before loading the route-based tests.
      - name: Generate route tree and build
        run: bun run build
      - name: Check tour catalog regression tests
        run: bun run test src/test/tours.test.tsx
