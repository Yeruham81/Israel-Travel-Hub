name: Airport transfer hub regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/routes/airport-transfers.index.tsx'
      - 'src/components/AirportDestinationCard.tsx'
      - 'src/components/AirportRoutePage.tsx'
      - 'src/components/AirportBookingPlatforms.tsx'
      - 'src/components/TransferQuoteForm.tsx'
      - 'src/components/TravelGuide.tsx'
      - 'src/data/airportTransfers.ts'
      - 'src/data/airportRoutes.ts'
      - 'src/data/registry.ts'
      - 'src/test/airport-transfers.test.tsx'
      - 'src/test/airport-routes.test.tsx'
      - 'src/test/transportation.test.tsx'
      - 'src/test/currency-prices.test.tsx'
      - 'src/test/site-voice.test.ts'
      - '.github/workflows/airport-transfers-regression.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      VITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bash scripts/install-ci-dependencies.sh
      - name: Build and generate route tree
        run: bun run build
      - name: Run airport transfer and shared-layout regressions
        run: bun run test src/test/airport-transfers.test.tsx src/test/airport-routes.test.tsx src/test/currency-prices.test.tsx src/test/site-voice.test.ts src/test/transportation.test.tsx src/test/hub-header-layout.test.ts
