name: Stage 5.5.6b - persist verified authored-code patch and validate committed code
on:
  push:
    branches: [audit/lint-quality-stage5-final]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-5-5-6b-code-permanent
  cancel-in-progress: false
jobs:
  persist:
    if: github.ref == 'refs/heads/audit/lint-quality-stage5-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5-6b-code-trial
          run-id: 46064419359
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Apply exact verified authored-code patch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          b44a3538f3f4513d7c016ed77ce892b916829347c4133c0e21db562a960cc47c  stage-5-5-6b-code.patch
          HASHES
          )
          test "$(git rev-parse origin/main)" = 47dadd24ef568dd508ff478cd366ada679179d6d
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/audit/lint-quality-stage5-final)"
          git diff --exit-code
          if git apply --reverse --check "$out/stage-5-5-6b-code.patch" 2>/dev/null; then
            echo "Verified patch already present"
          else
            test "$(git rev-parse HEAD^)" = 5f38bb27a2ba952c97a7a21f9239c039439fb40f
            test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/lint-quality-stage5-final.yml
            git apply --check "$out/stage-5-5-6b-code.patch"
            git apply --index "$out/stage-5-5-6b-code.patch"
            git diff --cached --check
            python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"verified-trial"
          expected=set(json.loads((out/"changed.json").read_text()))
          scope=set(json.loads((out/"scope.json").read_text()))
          actual=set(subprocess.check_output(["git","diff","--cached","--name-only","-z"]).decode().split("\0"))-{""}
          assert len(expected)==30 and len(scope)==30 and expected<=scope
          assert actual==expected,(actual-expected,expected-actual)
          assert all(x.startswith(("src/","scripts/")) and x.endswith((".ts",".tsx",".mjs")) and not x.endswith("ResponsivePhotos.ts") for x in actual)
          print("Exact verified scope:",len(actual),"authored source and script files")
          PY
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stage 5.5.6b: permanently apply verified authored-code formatting patch'
            git push origin HEAD:refs/heads/audit/lint-quality-stage5-final
          fi
          git diff --exit-code
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Permanent commit: $(git rev-parse HEAD)"
  validate:
    needs: persist
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      CI_FUNCTIONAL_ONLY: "false"
      VITE_INDEXABLE: "true"
      VITE_CANONICAL_ORIGIN: https://www.israel-taxi.com
      HOSTINGER_STATIC_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.persist.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5-6b-code-trial
          run-id: 46064419359
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Verify permanent commit and exact patch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          b44a3538f3f4513d7c016ed77ce892b916829347c4133c0e21db562a960cc47c  stage-5-5-6b-code.patch
          HASHES
          )
          test "$(git rev-parse HEAD)" = "${{ needs.persist.outputs.commit }}"
          test "$(git rev-parse origin/main)" = 47dadd24ef568dd508ff478cd366ada679179d6d
          git merge-base --is-ancestor origin/main HEAD
          git apply --reverse --check "$out/stage-5-5-6b-code.patch"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/permanent-report"
          git rev-parse HEAD | tee "$RUNNER_TEMP/permanent-report/validated-commit.txt"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Build current main reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/main-reference" 47dadd24ef568dd508ff478cd366ada679179d6d
          cd "$RUNNER_TEMP/main-reference"
          bash scripts/install-ci-dependencies.sh
          bash scripts/build-validated-static.sh
      - name: Lint and check 30 authored source and script files
        run: |
          bun run lint
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import prettier from 'prettier';
          const scope=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'verified-trial','scope.json'),'utf8'));
          if(scope.length!==30)throw Error('Unexpected scope');
          for(const file of scope){
            const options=await prettier.resolveConfig(file);
            if(!await prettier.check(fs.readFileSync(file,'utf8'),{...options,filepath:file}))throw Error('Formatting failed '+file);
          }
          console.log('PASS: all 30 committed authored source and script files satisfy Prettier');
          JS
      - name: Build production and verify static export and strict TypeScript
        run: |
          node --test scripts/israel-events-source.test.mjs scripts/travelpayouts/registry-source.test.mjs scripts/verify-photo-credits.test.mjs
          python3 scripts/test-deployment-storage.py
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-trial'
          for file in json.loads((out/'scope.json').read_text()):
              if file.endswith(('.js','.mjs','.cjs')):
                  subprocess.run(['node','--check',file],check=True)
          print('PASS: all JavaScript scripts parse with Node')
          PY
          export TRAVELPAYOUTS_API_TOKEN=""
          for script in generate-airport-platforms generate-bethlehem-category-tours generate-bethlehem-tours generate-deadsea-tours generate-food-eilat-tours generate-galilee-tours generate-jerusalem-tours generate-masada-tours generate-negev-golan-tours generate-northern-coast-tours generate-seven-missing-links generate-shore-excursions generate-tel-aviv-tours; do
            node "scripts/travelpayouts/$script.mjs" --validate
          done
          node scripts/travelpayouts/generate-links.mjs --validate
          for input in remaining-hotels paamonim-hotel jerusalem-neighborhood-fifth-hotels haifa-browse; do
            node scripts/travelpayouts/generate-links.mjs "scripts/travelpayouts/$input.json" --validate
          done
          bash scripts/build-validated-static.sh
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters
          node scripts/verify-hostinger-static-export.mjs --editorial
      - name: Compare committed production output with main
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/verified-trial/compare.py" "$RUNNER_TEMP/main-reference/.output/public" .output/public | tee "$RUNNER_TEMP/permanent-report/production-parity.txt"
      - name: Full regression on permanent commit
        shell: bash
        run: |
          set -euo pipefail
          VITE_INDEXABLE=false HOSTINGER_STATIC_BUILD=false bun run test 2>&1 | tee "$RUNNER_TEMP/permanent-report/regression.txt"
      - name: Guard authored source after validation
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only","-z"]).decode().split("\0"))-{""}
          allowed={"src/data/generated/guide-directory.ts","src/routeTree.gen.ts","public/sitemap.xml","public/robots.txt"}
          assert changed<=allowed,changed-allowed
          PY
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-5-6b-code-permanent-validation
          path: ${{ runner.temp }}/permanent-report/
          if-no-files-found: warn
