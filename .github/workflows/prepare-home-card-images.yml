name: Prepare lightweight mobile home card images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-home-card-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out original image assets
        uses: actions/checkout@v4
      - name: Prepare image optimizer
        run: python3 -m pip install --user --quiet Pillow
      - name: Create responsive WebP images for compact mobile cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          sources = [p for p in Path("src/assets/home").glob("*.webp") if not p.name.startswith("hero-") and not p.stem.endswith("-card")]
          sources += [Path("src/assets/haifa/panorama.webp"), Path("src/assets/dead-sea/beach.webp")]
          for source in sources:
              if not source.exists():
                  continue
              output = source.with_name(source.stem + "-card.webp")
              with Image.open(source) as original:
                  converted = ImageOps.exif_transpose(original).convert("RGB")
                  converted.thumbnail((360, 270), Image.Resampling.LANCZOS)
                  converted.save(output, format="WEBP", quality=67, method=6)
              print(f"{source} -> {output} ({output.stat().st_size} bytes)")
          PY
      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/home/*-card.webp src/assets/haifa/*-card.webp src/assets/dead-sea/*-card.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add optimized compact home card photos for responsive mobile display'
            git push origin HEAD:main
          fi
