name: Stage 5.3 - inspect existing lint suppressions
on:
  push:
    branches: [audit/lint-quality-stage5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suppression-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Gather actual suppressed diagnostics and unused directives
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/suppression-audit"
          mkdir -p "$out"
          git status --porcelain > "$out/before-status.txt"
          git rev-parse HEAD > "$out/source-commit.txt"
          status=0
          node_modules/.bin/eslint . --rule 'prettier/prettier: off' --report-unused-disable-directives-severity warn --format json --output-file "$out/lint.json" || status=$?
          test "$status" -le 1
          test -s "$out/lint.json"
          git status --porcelain > "$out/after-status.txt"
          diff -u "$out/before-status.txt" "$out/after-status.txt"
      - name: Inspect each suppression with TypeScript syntax and type context
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';
          const root=process.cwd(), out=path.join(process.env.RUNNER_TEMP,'suppression-audit');
          const lint=JSON.parse(fs.readFileSync(path.join(out,'lint.json'),'utf8'));
          const config=ts.readConfigFile('tsconfig.json',ts.sys.readFile);
          if(config.error) throw Error(ts.flattenDiagnosticMessageText(config.error.messageText,' '));
          const parsed=ts.parseJsonConfigFileContent(config.config,ts.sys,root);
          const program=ts.createProgram(parsed.fileNames,parsed.options);
          const checker=program.getTypeChecker();
          const relative=p=>path.relative(root,p).replaceAll('\\','/');
          const scope=p=>p==='src/routeTree.gen.ts'||p.startsWith('src/data/generated/')||p.endsWith('.generated.json')?'generated':p.startsWith('src/test/')||/\.(test|spec)\.[^.]+$/.test(p)||p.startsWith('src/test-utils/')?'tests':p.startsWith('src/')?'application':p.startsWith('scripts/')?'scripts':'configuration/other';
          const shorten=(s,n=400)=>String(s??'').replace(/\s+/g,' ').trim().slice(0,n);
          const typeText=t=>t?shorten(checker.typeToString(t,undefined,ts.TypeFormatFlags.NoTruncation),240):null;
          const items=[], unused=[], active=[];
          const tally=(xs,key)=>Object.fromEntries(Object.entries(xs.reduce((a,x)=>(a[x[key]]=(a[x[key]]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]));
          for(const f of lint){
            const file=relative(f.filePath);
            for(const m of f.messages){
              const entry={file,line:m.line,rule:m.ruleId,severity:m.severity,message:m.message};
              if(!m.ruleId&&/Unused eslint-disable directive/i.test(m.message)) unused.push(entry);
              else active.push(entry);
            }
            if(!f.suppressedMessages?.length) continue;
            const raw=fs.readFileSync(f.filePath,'utf8'), lines=raw.split(/\r?\n/);
            const source=program.getSourceFile(f.filePath)||ts.createSourceFile(f.filePath,raw,ts.ScriptTarget.Latest,true,file.endsWith('.tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
            const inProgram=!!program.getSourceFile(f.filePath);
            for(const m of f.suppressedMessages){
              const pos=source.getPositionOfLineAndCharacter(m.line-1,m.column-1);
              let node=source;
              function visit(n){if(n.getFullStart()<=pos&&pos<n.end){node=n;ts.forEachChild(n,visit);}}
              visit(source);
              let typeNode=node;
              while(typeNode!==source&&typeNode.kind!==ts.SyntaxKind.AnyKeyword)typeNode=typeNode.parent;
              const any=typeNode.kind===ts.SyntaxKind.AnyKeyword?typeNode:null;
              const parent=any?.parent;
              let kind=any?'other explicit any':'directive or other rule';
              let expressionType=null, contextualType=null;
              if(parent){
                if(ts.isAsExpression(parent)||ts.isTypeAssertionExpression(parent)){
                  kind='type assertion';
                  if(inProgram){expressionType=typeText(checker.getTypeAtLocation(parent.expression));contextualType=typeText(checker.getContextualType(parent));}
                }else if(ts.isParameter(parent))kind='parameter annotation';
                else if(ts.isVariableDeclaration(parent))kind='variable annotation';
                else if(ts.isArrayTypeNode(parent))kind='array element type';
                else if(ts.isTypeReferenceNode(parent))kind='generic type argument';
                else if(ts.isPropertySignature(parent)||ts.isPropertyDeclaration(parent))kind='property annotation';
                else if(ts.isFunctionLike(parent))kind='return type';
                else if(ts.isIndexSignatureDeclaration(parent))kind='index signature';
                else if(ts.isUnionTypeNode(parent)||ts.isIntersectionTypeNode(parent))kind='union/intersection';
              }
              let enclosing=parent||node;
              while(enclosing.parent&&enclosing.parent!==source&&!ts.isStatement(enclosing)&&!ts.isPropertyAssignment(enclosing)&&!ts.isMethodDeclaration(enclosing))enclosing=enclosing.parent;
              const row={file,line:m.line,column:m.column,rule:m.ruleId,scope:scope(file),kind,expressionType,contextualType,
                inProgram,sourceLine:lines[m.line-1],context:lines.slice(Math.max(0,m.line-4),m.line+2).join('\n'),
                enclosing:shorten(enclosing.getText(source),450),suppressions:m.suppressions||[]};
              items.push(row);
            }
          }
          const original=items.filter(x=>['@typescript-eslint/no-explicit-any','@typescript-eslint/ban-ts-comment'].includes(x.rule));
          const intentional=items.filter(x=>['no-control-regex','prefer-rest-params'].includes(x.rule));
          const summary={commit:fs.readFileSync(path.join(out,'source-commit.txt'),'utf8').trim(),total:items.length,original:original.length,stage52:intentional.length,originalFiles:new Set(original.map(x=>x.file)).size,byRule:tally(items,'rule'),originalByScope:tally(original,'scope'),originalByKind:tally(original,'kind'),originalByFile:tally(original,'file'),applicationByKind:tally(original.filter(x=>x.scope==='application'),'kind'),unusedDirectiveCount:unused.length,activeByRule:tally(active,'rule'),activeErrors:active.filter(x=>x.severity===2).length};
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
          fs.writeFileSync(path.join(out,'suppressed-context.json'),JSON.stringify(items,null,2));
          fs.writeFileSync(path.join(out,'unused-directives.json'),JSON.stringify(unused,null,2));
          const esc=s=>String(s??'').replaceAll('\t',' ').replaceAll('\n',' ');
          fs.writeFileSync(path.join(out,'suppressed-context.tsv'),['file\tline\tcolumn\trule\tscope\tkind\texpressionType\tcontextualType\tsourceLine',...items.map(x=>[x.file,x.line,x.column,x.rule,x.scope,x.kind,x.expressionType,x.contextualType,x.sourceLine].map(esc).join('\t'))].join('\n')+'\n');
          console.log('SUPPRESSION_SUMMARY',JSON.stringify(summary));
          for(const item of original)console.log('SUPPRESSED_CONTEXT',JSON.stringify(item));
          for(const item of unused)console.log('UNUSED_DIRECTIVE',JSON.stringify(item));
          const md=['## Stage 5.3 – suppression inventory','', 'Counts describe suppressed diagnostics, not necessarily distinct suppression comments. Syntax classification is preliminary, not a recommendation to remove a suppression.','',...Object.entries(summary).filter(([k,v])=>typeof v!=='object').map(([k,v])=>'- '+k+': '+v),'','### Original suppressions by scope',...Object.entries(summary.originalByScope).map(([k,v])=>'- '+k+': '+v),'','### Original suppressions by rule',...Object.entries(summary.byRule).map(([k,v])=>'- '+k+': '+v)];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md.join('\n')+'\n');
          if(summary.original!==124||summary.stage52!==4) console.log('::warning::Suppression counts changed from verified stage 5.2; inspect inventory.');
          if(summary.activeErrors) throw Error('Unexpected active nonformat lint errors');
          JS
      - name: Save suppression inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-3-suppression-inventory
          path: ${{ runner.temp }}/suppression-audit/
          if-no-files-found: warn
