name: Stage 5.5.2 - persist verified patches and validate committed code
on:
  push:
    branches: [audit/lint-quality-stage5]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-5-5-2-permanent
  cancel-in-progress: false
jobs:
  persist:
    if: github.ref == 'refs/heads/audit/lint-quality-stage5'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5b-format-trial
          run-id: 46038195874
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Apply exact verified patches to audit branch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          d312d64a29f1ad292717fd6ce33065075202d0e2bdf40b2fc74f7944a499892a  stage-5-5b-test-migration.patch
          5b0f9171bd3f9ef7439c1b4ff7e0b38d1bd365f21850f7711dd76725bbad37b6  stage-5-5b.patch
          de85d36fae38ab0a0dc91147aaf517b846a17664b5956d8f42c9dfb891c99dd8  changed.json
          7296c8516ebfa3fbb5070e62af1424fe4f8c5fe767b30269ad53d757486dcd65  assertion-migration.json
          HASHES
          )
          test "$(git rev-parse origin/main)" = 3252d8096c9ae78242df837bc890f55fe7cf6c36
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/audit/lint-quality-stage5)"
          git diff --exit-code
          if git apply --reverse --check "$out/stage-5-5b.patch" && git apply --reverse --check "$out/stage-5-5b-test-migration.patch"; then
            echo "Verified patches already present"
          else
            test "$(git rev-parse HEAD^)" = d63d434db22835275e60a7c0fa020c48f0162113
            test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/lint-quality-stage5.yml
            git apply --check "$out/stage-5-5b-test-migration.patch" "$out/stage-5-5b.patch"
            git apply --index "$out/stage-5-5b-test-migration.patch" "$out/stage-5-5b.patch"
            git diff --cached --check
            python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"verified-trial"
          tests=set(json.loads((out/"assertion-migration.json").read_text()))
          sources=set(json.loads((out/"changed.json").read_text()))
          actual=set(subprocess.check_output(["git","diff","--cached","--name-only","-z"]).decode().split("\0"))-{""}
          assert len(tests)==30 and len(sources)==184 and not tests&sources
          assert actual==tests|sources,(actual-(tests|sources),(tests|sources)-actual)
          print("Exact verified scope:",len(tests),"test files,",len(sources),"source files")
          PY
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stage 5.5.2: permanently apply validated formatting and regression assertion patches'
            git push origin HEAD:refs/heads/audit/lint-quality-stage5
          fi
          git diff --exit-code
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Permanent commit: $(git rev-parse HEAD)"
  validate:
    needs: persist
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      CI_FUNCTIONAL_ONLY: "false"
      VITE_INDEXABLE: "true"
      VITE_CANONICAL_ORIGIN: "https://www.israel-taxi.com"
      HOSTINGER_STATIC_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.persist.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5b-format-trial
          run-id: 46038195874
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Confirm committed patches and reference
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          d312d64a29f1ad292717fd6ce33065075202d0e2bdf40b2fc74f7944a499892a  stage-5-5b-test-migration.patch
          5b0f9171bd3f9ef7439c1b4ff7e0b38d1bd365f21850f7711dd76725bbad37b6  stage-5-5b.patch
          fc9f24087b337009b57fed151e7e8d314255122b305896628306abd04bf0ff11  compare.py
          f156bdb103dca2df79e7a6e7e2f2539cc8599dc5c49148b2d3cd96cefaca424a  scope.json
          HASHES
          )
          test "$(git rev-parse HEAD)" = "${{ needs.persist.outputs.commit }}"
          test "$(git rev-parse origin/main)" = 3252d8096c9ae78242df837bc890f55fe7cf6c36
          git merge-base --is-ancestor origin/main HEAD
          git apply --reverse --check "$out/stage-5-5b.patch" "$out/stage-5-5b-test-migration.patch"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/permanent-report"
          git rev-parse HEAD | tee "$RUNNER_TEMP/permanent-report/validated-commit.txt"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Build current main reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/main-reference" 3252d8096c9ae78242df837bc890f55fe7cf6c36
          cd "$RUNNER_TEMP/main-reference"
          bash scripts/install-ci-dependencies.sh
          bash scripts/build-validated-static.sh
      - name: Lint and verify all 479 scoped files
        run: |
          bun run lint
          node_modules/.bin/prettier --check 'src/routes/**/*.{ts,tsx}' 'src/route-heads/**/*.{ts,tsx}'
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import prettier from 'prettier';
          const scope=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'verified-trial','scope.json'),'utf8'));
          if(scope.length!==479)throw Error('Unexpected scope');
          for(const file of scope){
            const options=await prettier.resolveConfig(file);
            if(!await prettier.check(fs.readFileSync(file,'utf8'),{...options,filepath:file}))throw Error('Formatting check failed: '+file);
          }
          console.log('PASS: all 479 committed source files satisfy Prettier');
          JS
      - name: Build production and verify static export and strict TypeScript
        run: |
          bash scripts/build-validated-static.sh
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters
          node scripts/verify-hostinger-static-export.mjs --editorial
      - name: Compare committed production output with main
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/verified-trial/compare.py" "$RUNNER_TEMP/main-reference/.output/public" .output/public | tee "$RUNNER_TEMP/permanent-report/production-parity.txt"
      - name: Full regression on permanent commit
        shell: bash
        run: |
          set -euo pipefail
          VITE_INDEXABLE=false HOSTINGER_STATIC_BUILD=false bun run test 2>&1 | tee "$RUNNER_TEMP/permanent-report/regression.txt"
      - name: Guard authored source after validation
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only","-z"]).decode().split("\0"))-{""}
          allowed={"src/data/generated/guide-directory.ts","src/routeTree.gen.ts","public/sitemap.xml","public/robots.txt"}
          assert changed<=allowed,changed-allowed
          PY
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-5-2-permanent-validation
          path: ${{ runner.temp }}/permanent-report/
          if-no-files-found: warn
