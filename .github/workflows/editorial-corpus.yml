name: Full Site Editorial Corpus
on:
  push:
    branches: [editorial/full-site-review]
  workflow_dispatch:
    inputs:
      log_group:
        description: "Group number to print to job log"
        required: false
        default: "2"
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      VITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bash scripts/install-ci-dependencies.sh
      - name: Verify reviewed group regression tests
        run: bun run test src/test/home-hero-copy.test.tsx src/test/homepage-structure.test.tsx src/test/about-page.test.tsx src/test/private-driver.test.tsx src/components/HomeHero.test.ts src/test/airport-transfers.test.tsx src/test/airport-routes.test.tsx src/test/airport-journeys.test.tsx src/test/travel-guides.test.tsx src/data/travelGuides.test.ts src/test/site-voice.test.ts src/data/taxiGuideCluster.test.ts src/test/car-rental-guide.test.tsx src/test/car-rental-affiliate.test.ts src/test/transportation.test.tsx src/data/israelItineraries.test.ts src/test/mount-of-olives-feature.test.tsx src/test/mount-zion-feature.test.tsx src/test/mount-zion-revision.test.ts src/test/mount-zion-map.test.ts src/test/old-city-jerusalem-feature.test.tsx src/test/via-dolorosa-feature.test.tsx src/data/jerusalemChurches.test.ts src/data/jerusalemMuseums.test.ts src/data/jerusalemShopping.test.ts src/test/jaffa-feature.test.tsx src/data/telAvivAttractionsGuide.test.ts src/data/telAvivBeaches.test.ts src/data/telAvivMuseums.test.ts src/test/akko-feature.test.tsx src/test/caesarea-feature.test.tsx src/test/rosh-hanikra-feature.test.tsx src/test/haifa-city-guide.test.tsx src/test/haifa-city-regression.test.tsx src/test/sea-of-galilee-attraction.test.tsx src/test/tel-megiddo-feature.test.tsx src/data/haifaMuseums.test.ts src/test/dead-sea-attraction.test.tsx src/test/ein-gedi-feature.test.tsx src/test/masada-feature.test.tsx
      - name: Build static HTML
        env:
          HOSTINGER_STATIC_BUILD: "true"
          VITE_CANONICAL_ORIGIN: https://www.israel-taxi.com
          VITE_INDEXABLE: "true"
        run: bash scripts/build-validated-static.sh
      - name: Verify and extract every canonical page
        env:
          EDITORIAL_LOG_GROUP: ${{ inputs.log_group || '8' }}
        run: node scripts/export-editorial-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-corpus
          path: editorial-review-export/
          if-no-files-found: error
          retention-days: 14
