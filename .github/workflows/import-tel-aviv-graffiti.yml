name: Import licensed Florentin graffiti photograph
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-tel-aviv-graffiti.yml"
permissions:
  contents: write
concurrency:
  group: tel-aviv-graffiti-image
  cancel-in-progress: false
jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-tlv-graffiti]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Download CC BY 4.0 Florentin photo and verify Commons metadata
        run: node scripts/import-tel-aviv-graffiti.mjs
      - name: Create optimized 960x540 WebP photo
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image,ImageOps
          source=Path(os.environ["RUNNER_TEMP"])/"tel-aviv-photo"/"florentin-graffiti.jpg"
          with Image.open(source) as im:
              im=ImageOps.exif_transpose(im).convert("RGB")
              if min(im.size)<650: raise ValueError("Source resolution too low")
              im=ImageOps.fit(im,(960,540),method=Image.Resampling.LANCZOS)
              target=Path("public/images/tel-aviv-attractions/florentin-graffiti.webp")
              target.parent.mkdir(parents=True,exist_ok=True)
              im.save(target,format="WEBP",quality=78,method=6)
          data=target.read_bytes()
          if not (data[:4]==b"RIFF" and data[8:12]==b"WEBP" and 9000<len(data)<250000):raise ValueError("Invalid compressed WebP")
          print(target,len(data))
          PY
      - name: Commit image and source attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/telAvivGraffitiPhotoCredit.json public/images/tel-aviv-attractions/florentin-graffiti.webp
          if git diff --cached --quiet; then echo "Photo already current"; exit 0; fi
          git commit -m "Add location-specific CC BY graffiti photo and attribution"
          git pull --rebase origin main
          git push origin HEAD:main
