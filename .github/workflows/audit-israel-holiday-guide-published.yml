name: Audit published Israel holiday visitor guide
on:
  workflow_run:
    workflows: ["Deploy static website to Hostinger Premium"]
    types: [completed]
permissions:
  contents: read
jobs:
  retired-route:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check retired holiday calculator independently of image loading
        shell: bash
        run: |
          set -euo pipefail
          url="https://saddlebrown-guanaco-454061.hostingersite.com/travel-blog/israel-holidays/"
          status="$(curl --http1.1 --retry 1 --max-time 25 -sSL -o /tmp/retired-calendar-response.html -w "%{http_code}" "$url")"
          echo "Retired /travel-blog/israel-holidays/: HTTP $status"
          case "$status" in
            404|410) echo "PASS: removed calendar route is not served" ;;
            429) echo "::error::Rate-limited: HTTP status could not be verified independently"; exit 1 ;;
            *) echo "::error::Removed route unexpectedly returned HTTP $status"; exit 1 ;;
          esac
  audit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install headless Chromium for published-page checks
        run: |
          mkdir -p /tmp/holiday-browser
          npm install --prefix /tmp/holiday-browser --no-save playwright@1.56.1
          /tmp/holiday-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify the published holidays guide on desktop and mobile
        env:
          NODE_PATH: /tmp/holiday-browser/node_modules
          HOLIDAY_GUIDE_ORIGIN: https://saddlebrown-guanaco-454061.hostingersite.com
        run: node scripts/audit-israel-holiday-guide-published.cjs
      - name: Save read-only audit evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: israel-holiday-guide-published-audit
          path: /tmp/holiday-guide-published/
          retention-days: 14
          if-no-files-found: warn
