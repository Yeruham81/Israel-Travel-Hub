name: Import Ein Gedi synagogue photo once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-ein-gedi-mosaic.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and optimize attributed photograph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/attractions
          curl -fLsS --retry 3 --max-time 45 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Ein_Gedi_synagogue058.JPG/960px-Ein_Gedi_synagogue058.JPG' \
            -o /tmp/ein-gedi-mosaic.jpg
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/ein-gedi-mosaic.jpg').convert('RGB')
          im.thumbnail((640, 480))
          im.save('public/images/attractions/ein-gedi-synagogue-mosaic.webp', 'WEBP', quality=76, method=6)
          PY
          test -s public/images/attractions/ein-gedi-synagogue-mosaic.webp

      - name: Commit optimized local photo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/attractions/ein-gedi-synagogue-mosaic.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add optimized local photo of Ein Gedi synagogue mosaic'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
