name: Deploy static website to Hostinger Premium

# Do not publish broken code. Automatic deployments only follow successful
# Full Project Validation runs on main; credentials never enter Lovable/Vite.
on:
  workflow_run:
    workflows: ["Full Project Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify SSH/target and show changes without uploading"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: hostinger-premium-website
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success' && vars.HOSTINGER_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: "true"
      HOSTINGER_STATIC_BUILD: "true"
      # Hostinger uses reviewed, source-controlled guides from GitHub.
      # No external editorial CMS fetch is required for this deployment.
      VITE_CANONICAL_ORIGIN: ${{ vars.HOSTINGER_CANONICAL_ORIGIN || 'https://saddlebrown-guanaco-454061.hostingersite.com' }}
      VITE_INDEXABLE: ${{ vars.HOSTINGER_INDEXABLE || 'false' }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      HOSTINGER_REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
      HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exactly the commit verified by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Ensure this is still the latest main commit
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" != "$TARGET_SHA" ]]; then
            echo "A newer main commit exists. Skip this obsolete deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js and Bun
        if: steps.freshness.outputs.current == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        if: steps.freshness.outputs.current == 'true'
        run: bash scripts/install-ci-dependencies.sh

      - name: Build all routes as HTML for Premium hosting
        if: steps.freshness.outputs.current == 'true'
        run: bash scripts/build-validated-static.sh

      - name: Assert the release includes the reviewed Uber guide
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s .output/public/travel-blog/uber-in-israel/index.html
          grep -Fq 'Is Uber Available in Israel?' .output/public/travel-blog/uber-in-israel/index.html

      - name: Reject missing pages, wrong canonical, or indexable trial
        if: steps.freshness.outputs.current == 'true'
        run: node scripts/verify-hostinger-static-export.mjs

      - name: Check required SSH secrets and safe remote path
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_SSH_HOST HOSTINGER_SSH_USER HOSTINGER_SSH_PRIVATE_KEY HOSTINGER_SSH_KNOWN_HOSTS HOSTINGER_REMOTE_PATH; do
            [[ -n "${!name}" ]] || { echo "::error::Missing GitHub secret: $name"; exit 1; }
          done
          [[ "$HOSTINGER_REMOTE_PATH" =~ ^/home/[A-Za-z0-9_-]+/domains/[A-Za-z0-9.-]+/public_html/?$ ]] ||
            { echo "::error::Remote path must be the exact Hostinger temporary site's /home/.../domains/.../public_html"; exit 1; }
          [[ "$HOSTINGER_REMOTE_PATH" != *'/domains/israel-taxi.com/'* ]] ||
            { echo "::error::Refusing the legacy live domain israel-taxi.com"; exit 1; }
          [[ "$HOSTINGER_SSH_PORT" =~ ^[0-9]{2,5}$ ]] || exit 1
          [[ "$HOSTINGER_SSH_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || exit 1
          [[ "$HOSTINGER_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1

      - name: Install verified SSH key and pinned host fingerprint
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hostinger_deploy"
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hostinger_deploy" "$HOME/.ssh/known_hosts"

      - name: Verify website marker and existing PHP endpoints on Hostinger
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "test -f '$HOSTINGER_REMOTE_PATH/.ith-static-deploy-ok' && test -f '$HOSTINGER_REMOTE_PATH/index.html' && test ! -e '$HOSTINGER_REMOTE_PATH/wp-config.php' && test -f '$HOSTINGER_REMOTE_PATH/api/quote-request/index.php' && test -f '$HOSTINGER_REMOTE_PATH/api/exchange-rates/index.php'" ||
            { echo "::error::Hostinger deployment marker or expected PHP endpoints are missing; no files were changed"; exit 1; }

      - name: Check transfer plan before changing Hostinger
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -rltvz --dry-run --delay-updates --no-perms --no-owner --no-group \
            --exclude='/.htaccess' --exclude='/api/***' --exclude='/.well-known/***' \
            --exclude='/.user.ini' --exclude='/.ith-static-deploy-ok' \
            --exclude='/wp-content/***' --exclude='/wp-admin/***' --exclude='/wp-includes/***' \
            --exclude='*.php' \
            -e "ssh -p $HOSTINGER_SSH_PORT -i $HOME/.ssh/hostinger_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            .output/public/ "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$HOSTINGER_REMOTE_PATH/"

      - name: Upload only built static files using rsync over SSH
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
            echo "DRY RUN: no files will be changed on Hostinger."
          fi
          # NEVER add --delete. Keep manually configured PHP, .htaccess,
          # host configuration, upload directories and unpublished backups.
          # Maintain a private backup of overwritten HTML/assets outside public_html.
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID"
          if [[ "$DRY_RUN" == "false" ]]; then
            ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" "umask 077 && mkdir -p '$BACKUP_DIR'"
            args+=(--backup --backup-dir="$BACKUP_DIR")
          fi
          rsync -rltvz --delay-updates --no-perms --no-owner --no-group \
            --exclude='/.htaccess' \
            --exclude='/api/***' \
            --exclude='/.well-known/***' \
            --exclude='/.user.ini' \
            --exclude='/.ith-static-deploy-ok' \
            --exclude='/wp-content/***' \
            --exclude='/wp-admin/***' \
            --exclude='/wp-includes/***' \
            --exclude='*.php' \
            "${args[@]}" \
            -e "ssh -p $HOSTINGER_SSH_PORT -i $HOME/.ssh/hostinger_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            .output/public/ "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$HOSTINGER_REMOTE_PATH/"

      # This one retired map was published before switching Tabgha back to Google Maps.
      # Preserve normal upload behavior; relocate only this verified obsolete file.
      - name: Retire obsolete OpenStreetMap Tabgha file
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID"
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "set -eu
             old='$HOSTINGER_REMOTE_PATH/maps/tabgha-churches.html'
             if [ -L \"\$old\" ]; then echo 'Refusing to remove unexpected symlink' >&2; exit 1; fi
             if [ -f \"\$old\" ]; then
               grep -Fq 'tile.openstreetmap.org' \"\$old\" || { echo 'Obsolete file contents are unexpected' >&2; exit 1; }
               umask 077
               mkdir -p '$BACKUP_DIR'
               mv -- \"\$old\" '$BACKUP_DIR/retired-tabgha-churches.html'
             fi
             test ! -e \"\$old\""
          echo "Retired the exact obsolete Tabgha map only (or it was already absent)."

      - name: Read-only public smoke test
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in / /travel-blog/ /travel-blog/uber-in-israel/ /attractions/capernaum/ /attractions/mount-precipice/ /attractions/tel-megiddo/ /attractions/basilica-of-the-annunciation/ /attractions/rosh-hanikra/ /attractions/caesarea/ /api/quote-request/ /api/exchange-rates/; do
            status="$(curl --retry 2 --retry-delay 2 --max-time 20 -L -sS -o /dev/null -w '%{http_code}' "$VITE_CANONICAL_ORIGIN$path")"
            echo "$path -> HTTP $status"
            [[ "$status" == "200" ]] || { echo "::error::Website smoke test failed for $path"; exit 1; }
          done
          uber_html="$(curl --retry 2 --max-time 20 -fsSL "$VITE_CANONICAL_ORIGIN/travel-blog/uber-in-israel/")"
          if ! grep -Fq 'Is Uber Available in Israel?' <<< "$uber_html"; then
            echo "::error::The published Uber guide does not contain its expected title"
            exit 1
          fi
          capernaum_html="$(mktemp)"
          curl --retry 2 --max-time 20 -fsSL -o "$capernaum_html" "$VITE_CANONICAL_ORIGIN/attractions/capernaum/"
          if ! grep -Fq 'Capernaum (Kfar Nahum): Visitor Guide' "$capernaum_html"; then
            echo "::error::The published Capernaum attraction guide is missing its title"
            exit 1
          fi
          # SSR may insert HTML comment boundaries between dynamic place name and heading text.
          # Assert the actual fact-card panel instead of a fragile concatenated text string.
          if ! grep -Fq 'data-testid="attraction-at-a-glance"' "$capernaum_html"; then
            echo "::error::The published Capernaum guide is missing its at-a-glance panel"
            exit 1
          fi
          rm -f "$capernaum_html"
          # Check the published Mount Precipice page itself, including SEO and images.
          precipice_html="$(mktemp)"
          curl --retry 2 --max-time 20 -fsSL -o "$precipice_html" "$VITE_CANONICAL_ORIGIN/attractions/mount-precipice/"
          node - "$precipice_html" "$VITE_CANONICAL_ORIGIN/attractions/mount-precipice/" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const expectedUrl = process.argv[3];
          const canonicalLinks = [...html.matchAll(/<link\b[^>]*>/gi)]
            .map(match => match[0])
            .filter(tag => /\brel=["']canonical["']/i.test(tag));
          if (!/<title[^>]*>[^<]*Mount Precipice[^<]*<\/title>/i.test(html)) {
            console.error("::error::Mount Precipice published page is missing its title");
            process.exit(1);
          }
          if (!html.includes('data-testid="mount-precipice-visitor-cards"')) {
            console.error("::error::Mount Precipice published page is missing its visitor information");
            process.exit(1);
          }
          if (!canonicalLinks.some(tag => tag.includes('href="' + expectedUrl + '"'))) {
            console.error("::error::Mount Precipice published page has a missing or incorrect canonical link");
            process.exit(1);
          }
          console.log("Mount Precipice published title, visitor content and canonical verified.");
          NODE
          rm -f "$precipice_html"
          for image_name in mount-precipice-jezreel-view.webp mount-precipice-mount-tabor-view.webp; do
            image_file="$(mktemp)"
            curl --retry 2 --max-time 20 -fsSL -o "$image_file" "$VITE_CANONICAL_ORIGIN/images/attractions/$image_name"
            if [[ "$(file --mime-type -b "$image_file")" != "image/webp" ]]; then
              rm -f "$image_file"
              echo "::error::Mount Precipice image $image_name did not return a valid WebP file"
              exit 1
            fi
            rm -f "$image_file"
            echo "Mount Precipice image $image_name -> valid WebP"
          done
          # Verify Tel Megiddo's published route and its three nonrepeating photos.
          megiddo_html="$(mktemp)"
          curl --retry 2 --max-time 20 -fsSL -o "$megiddo_html" "$VITE_CANONICAL_ORIGIN/attractions/tel-megiddo/"
          node - "$megiddo_html" "$VITE_CANONICAL_ORIGIN/attractions/tel-megiddo/" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const expectedUrl = process.argv[3];
          const canonicalLinks = [...html.matchAll(/<link\b[^>]*>/gi)]
            .map(match => match[0]).filter(tag => /\brel=["']canonical["']/i.test(tag));
          if (!/<title[^>]*>[^<]*Tel Megiddo National Park[^<]*<\/title>/i.test(html)) {
            console.error("::error::Published Tel Megiddo title is missing");
            process.exit(1);
          }
          if (!html.includes('data-testid="tel-megiddo-visitor-hours"') || !html.includes('data-testid="attraction-at-a-glance"')) {
            console.error("::error::Published Tel Megiddo visitor sections are missing");
            process.exit(1);
          }
          if (!canonicalLinks.some(tag => tag.includes('href="' + expectedUrl + '"'))) {
            console.error("::error::Published Tel Megiddo canonical URL is wrong");
            process.exit(1);
          }
          console.log("Tel Megiddo published title, visitor information and canonical verified.");
          NODE
          rm -f "$megiddo_html"
          for image_name in tel-megiddo-gate.webp tel-megiddo-city-layers.webp tel-megiddo-aerial.webp; do
            image_file="$(mktemp)"
            curl --retry 2 --max-time 20 -fsSL -o "$image_file" "$VITE_CANONICAL_ORIGIN/images/attractions/$image_name"
            if [[ "$(file --mime-type -b "$image_file")" != "image/webp" ]]; then
              rm -f "$image_file"
              echo "::error::Tel Megiddo image $image_name did not return a valid WebP"
              exit 1
            fi
            rm -f "$image_file"
            echo "Tel Megiddo image $image_name -> valid WebP"
          done
          # Check the published Nazareth Basilica of the Annunciation and its four photographs.
          annunciation_html="$(mktemp)"
          curl --retry 2 --max-time 20 -fsSL -o "$annunciation_html" "$VITE_CANONICAL_ORIGIN/attractions/basilica-of-the-annunciation/"
          node - "$annunciation_html" "$VITE_CANONICAL_ORIGIN/attractions/basilica-of-the-annunciation/" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const expectedUrl = process.argv[3];
          const canonicalLinks = [...html.matchAll(/<link\b[^>]*>/gi)]
            .map(match => match[0]).filter(tag => /\brel=["']canonical["']/i.test(tag));
          if (!/<title[^>]*>[^<]*Basilica of the Annunciation[^<]*<\/title>/i.test(html)) {
            console.error("::error::Published Annunciation basilica title is missing");
            process.exit(1);
          }
          if (!html.includes('data-testid="annunciation-visitor-hours"') || !html.includes('data-testid="attraction-at-a-glance"')) {
            console.error("::error::Published Annunciation basilica visitor sections are missing");
            process.exit(1);
          }
          if (!canonicalLinks.some(tag => tag.includes('href="' + expectedUrl + '"'))) {
            console.error("::error::Published Annunciation basilica canonical URL is wrong");
            process.exit(1);
          }
          console.log("Annunciation basilica published title, visiting information and canonical verified.");
          NODE
          rm -f "$annunciation_html"
          for image_name in annunciation-grotto.webp annunciation-upper-basilica.webp annunciation-marian-mosaics.webp annunciation-dome.webp; do
            image_file="$(mktemp)"
            curl --retry 2 --max-time 20 -fsSL -o "$image_file" "$VITE_CANONICAL_ORIGIN/images/attractions/$image_name"
            if [[ "$(file --mime-type -b "$image_file")" != "image/webp" ]]; then
              rm -f "$image_file"
              echo "::error::Annunciation image $image_name did not return a valid WebP"
              exit 1
            fi
            rm -f "$image_file"
            echo "Annunciation image $image_name -> valid WebP"
          done
          # Verify Rosh Hanikra's published page and all five unique grotto/coast images.
          rosh_hanikra_html="$(mktemp)"
          curl --retry 2 --max-time 20 -fsSL -o "$rosh_hanikra_html" "$VITE_CANONICAL_ORIGIN/attractions/rosh-hanikra/"
          node - "$rosh_hanikra_html" "$VITE_CANONICAL_ORIGIN/attractions/rosh-hanikra/" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const expectedUrl = process.argv[3];
          const canonicalLinks = [...html.matchAll(/<link\b[^>]*>/gi)]
            .map(match => match[0]).filter(tag => /\brel=["']canonical["']/i.test(tag));
          if (!/<title[^>]*>[^<]*Rosh Hanikra[^<]*<\/title>/i.test(html)) {
            console.error("::error::Rosh Hanikra published title is missing");
            process.exit(1);
          }
          if (!html.includes('data-testid="rosh-hanikra-visitor-hours"') || !html.includes('data-testid="attraction-at-a-glance"')) {
            console.error("::error::Rosh Hanikra published visitor sections are missing");
            process.exit(1);
          }
          if (!canonicalLinks.some(tag => tag.includes('href="' + expectedUrl + '"'))) {
            console.error("::error::Rosh Hanikra published canonical URL is missing or incorrect");
            process.exit(1);
          }
          console.log("Rosh Hanikra published title, visitor information and canonical verified.");
          NODE
          rm -f "$rosh_hanikra_html"
          for image_name in rosh-hanikra-cable-car.webp rosh-hanikra-blue-grotto.webp rosh-hanikra-railway-tunnel.webp rosh-hanikra-cliffs.webp rosh-hanikra-coast.webp; do
            image_file="$(mktemp)"
            curl --retry 2 --max-time 20 -fsSL -o "$image_file" "$VITE_CANONICAL_ORIGIN/images/attractions/$image_name"
            if [[ "$(file --mime-type -b "$image_file")" != "image/webp" ]]; then
              rm -f "$image_file"
              echo "::error::Rosh Hanikra image $image_name did not return a valid WebP"
              exit 1
            fi
            rm -f "$image_file"
            echo "Rosh Hanikra image $image_name -> valid WebP"
          done
          # Confirm the upgraded Caesarea route, prices, canonical and Drive-backed images.
          caesarea_html="$(mktemp)"
          curl --retry 2 --max-time 20 -fsSL -o "$caesarea_html" "$VITE_CANONICAL_ORIGIN/attractions/caesarea/"
          node - "$caesarea_html" "$VITE_CANONICAL_ORIGIN/attractions/caesarea/" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const expectedUrl = process.argv[3];
          const canonicalLinks = [...html.matchAll(/<link\\b[^>]*>/gi)]
            .map(match => match[0]).filter(tag => /\\brel=["']canonical["']/i.test(tag));
          if (!/<title[^>]*>[^<]*Caesarea National Park[^<]*<\\/title>/i.test(html)) {
            console.error("::error::Caesarea page title is missing");
            process.exit(1);
          }
          for (const required of [
            'data-testid="caesarea-hours-tickets"',
            'data-testid="attraction-at-a-glance"',
            'data-testid="caesarea-coastal-panorama"',
            "Harbor only",
            "₪46",
            "₪18",
            "caesarea-ruins-hero.svg",
            "caesarea-crusader-arches.svg",
            "caesarea-aqueduct-arches.svg",
          ]) {
            if (!html.includes(required)) {
              console.error("::error::Caesarea published page is missing " + required);
              process.exit(1);
            }
          }
          if (!canonicalLinks.some(tag => tag.includes('href="' + expectedUrl + '"'))) {
            console.error("::error::Caesarea published canonical URL is incorrect");
            process.exit(1);
          }
          console.log("Caesarea title, content, pricing, images and canonical verified.");
          NODE
          rm -f "$caesarea_html"
          for image_name in caesarea-ruins-hero.svg caesarea-crusader-arches.svg caesarea-aqueduct-arches.svg; do
            image_file="$(mktemp)"
            curl --retry 2 --max-time 20 -fsSL -o "$image_file" "$VITE_CANONICAL_ORIGIN/images/attractions/$image_name"
            if [[ "$(file --mime-type -b "$image_file")" != "image/svg+xml" ]] || ! grep -Fq '<image ' "$image_file"; then
              rm -f "$image_file"
              echo "::error::Caesarea image $image_name is missing or invalid"
              exit 1
            fi
            rm -f "$image_file"
            echo "Caesarea photo asset $image_name -> valid SVG with embedded image"
          done
          echo "Source-controlled static guides published; existing PHP APIs still respond to GET."
