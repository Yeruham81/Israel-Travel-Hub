name: Deploy static website to Hostinger Premium

# Do not publish broken code. Automatic deployments only follow successful
# Full Project Validation runs on main; credentials never enter Lovable/Vite.
on:
  workflow_run:
    workflows: ["Full Project Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify SSH/target and show changes without uploading"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: hostinger-premium-website
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success' && vars.HOSTINGER_AUTO_DEPLOY == 'true' && vars.HOSTINGER_CUTOVER_FREEZE != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: "true"
      HOSTINGER_STATIC_BUILD: "true"
      # Hostinger uses reviewed, source-controlled guides from GitHub.
      # No external editorial CMS fetch is required for this deployment.
      VITE_CANONICAL_ORIGIN: ${{ vars.HOSTINGER_CANONICAL_ORIGIN || 'https://saddlebrown-guanaco-454061.hostingersite.com' }}
      VITE_INDEXABLE: ${{ vars.HOSTINGER_INDEXABLE || 'false' }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      HOSTINGER_REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
      HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      # Freeze before Hostinger domain changes. Read-only dry runs stay available.
      HOSTINGER_CUTOVER_FREEZE: ${{ vars.HOSTINGER_CUTOVER_FREEZE || 'false' }}
      # Explicit separate opt-in after confirming the NEW webroot in hPanel/SSH.
      HOSTINGER_PRODUCTION_DEPLOY_APPROVED: ${{ vars.HOSTINGER_PRODUCTION_DEPLOY_APPROVED || 'false' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exactly the commit verified by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Ensure this is still the latest main commit
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" != "$TARGET_SHA" ]]; then
            echo "A newer main commit exists. Skip this obsolete deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js and Bun
        if: steps.freshness.outputs.current == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        if: steps.freshness.outputs.current == 'true'
        run: bash scripts/install-ci-dependencies.sh

      - name: Build all routes as HTML for Premium hosting
        if: steps.freshness.outputs.current == 'true'
        run: bash scripts/build-validated-static.sh

      - name: Assert the release includes the reviewed Uber guide
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s .output/public/travel-blog/uber-in-israel/index.html
          grep -Fq 'Is Uber Available in Israel?' .output/public/travel-blog/uber-in-israel/index.html

      - name: Reject missing pages, wrong canonical, or indexable trial
        if: steps.freshness.outputs.current == 'true'
        run: node scripts/verify-hostinger-static-export.mjs

      - name: Check required SSH secrets and safe remote path
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_SSH_HOST HOSTINGER_SSH_USER HOSTINGER_SSH_PRIVATE_KEY HOSTINGER_SSH_KNOWN_HOSTS HOSTINGER_REMOTE_PATH; do
            [[ -n "${!name}" ]] || { echo "::error::Missing GitHub secret: $name"; exit 1; }
          done
          [[ "$HOSTINGER_REMOTE_PATH" =~ ^/home/[A-Za-z0-9_-]+/domains/[A-Za-z0-9.-]+/public_html/?$ ]] ||
            { echo "::error::Remote path must be the verified site's exact /home/.../domains/.../public_html"; exit 1; }
          # The production-domain folder name is not evidence that the site is
          # WordPress or the new site; require production metadata and explicit
          # permission before the first non-dry-run upload to that directory.
          if [[ "$HOSTINGER_REMOTE_PATH" == *'/domains/israel-taxi.com/public_html'* ||
                "$HOSTINGER_REMOTE_PATH" == *'/domains/www.israel-taxi.com/public_html'* ]]; then
            [[ "$VITE_CANONICAL_ORIGIN" == "https://www.israel-taxi.com" && "$VITE_INDEXABLE" == "true" ]] ||
              { echo "::error::Production webroot requires reviewed canonical/index settings"; exit 1; }
            if [[ "$DRY_RUN" != "true" && "$HOSTINGER_PRODUCTION_DEPLOY_APPROVED" != "true" ]]; then
              echo "::error::Production webroot uploads require HOSTINGER_PRODUCTION_DEPLOY_APPROVED=true"
              exit 1
            fi
          fi
          if [[ "$HOSTINGER_CUTOVER_FREEZE" == "true" && "$DRY_RUN" != "true" ]]; then
            echo "::error::Hostinger cutover freeze is enabled. Only dry runs are permitted."
            exit 1
          fi
          [[ "$HOSTINGER_SSH_PORT" =~ ^[0-9]{2,5}$ ]] || exit 1
          [[ "$HOSTINGER_SSH_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || exit 1
          [[ "$HOSTINGER_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1

      - name: Install verified SSH key and pinned host fingerprint
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hostinger_deploy"
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hostinger_deploy" "$HOME/.ssh/known_hosts"

      - name: Verify website marker and existing PHP endpoints on Hostinger
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "test -f '$HOSTINGER_REMOTE_PATH/.ith-static-deploy-ok' && test -f '$HOSTINGER_REMOTE_PATH/index.html' && test ! -e '$HOSTINGER_REMOTE_PATH/wp-config.php' && test ! -e '$HOSTINGER_REMOTE_PATH/wp-load.php' && test ! -d '$HOSTINGER_REMOTE_PATH/wp-admin' && test ! -d '$HOSTINGER_REMOTE_PATH/wp-includes' && test -f '$HOSTINGER_REMOTE_PATH/api/quote-request/index.php' && test -f '$HOSTINGER_REMOTE_PATH/api/exchange-rates/index.php'" ||
            { echo "::error::Hostinger deployment marker or expected PHP endpoints are missing; no files were changed"; exit 1; }

      - name: Check transfer plan before changing Hostinger
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -rltvz --dry-run --delay-updates --no-perms --no-owner --no-group \
            --exclude='/.htaccess' --exclude='/api/***' --exclude='/.well-known/***' \
            --exclude='/.user.ini' --exclude='/.ith-static-deploy-ok' \
            --exclude='/wp-content/***' --exclude='/wp-admin/***' --exclude='/wp-includes/***' \
            --exclude='*.php' \
            -e "ssh -p $HOSTINGER_SSH_PORT -i $HOME/.ssh/hostinger_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            .output/public/ "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$HOSTINGER_REMOTE_PATH/"

      - name: Upload only built static files using rsync over SSH
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
            echo "DRY RUN: no files will be changed on Hostinger."
          fi
          # NEVER add --delete. Keep manually configured PHP, .htaccess,
          # host configuration, upload directories and unpublished backups.
          # Maintain a private backup of overwritten HTML/assets outside public_html.
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID"
          if [[ "$DRY_RUN" == "false" ]]; then
            ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" "umask 077 && mkdir -p '$BACKUP_DIR'"
            args+=(--backup --backup-dir="$BACKUP_DIR")
          fi
          rsync -rltvz --delay-updates --no-perms --no-owner --no-group \
            --exclude='/.htaccess' \
            --exclude='/api/***' \
            --exclude='/.well-known/***' \
            --exclude='/.user.ini' \
            --exclude='/.ith-static-deploy-ok' \
            --exclude='/wp-content/***' \
            --exclude='/wp-admin/***' \
            --exclude='/wp-includes/***' \
            --exclude='*.php' \
            "${args[@]}" \
            -e "ssh -p $HOSTINGER_SSH_PORT -i $HOME/.ssh/hostinger_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            .output/public/ "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$HOSTINGER_REMOTE_PATH/"

      - name: Verify four airport guides directly on Hostinger
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" "HOSTINGER_REMOTE_PATH='$HOSTINGER_REMOTE_PATH' sh -s" <<'REMOTE'
          set -eu
          cd "$HOSTINGER_REMOTE_PATH"
          for city in jerusalem tel-aviv haifa ein-bokek; do
            page="travel-blog/ben-gurion-airport-to-$city/index.html"
            test -s "$page"
            grep -Fq 'data-testid="airport-journey-comparison"' "$page"
            grep -Fq 'data-testid="airport-arrival-areas"' "$page"
            grep -Fq 'data-testid="airport-related-guides"' "$page"
            grep -Fq 'id="request-quote"' "$page"
            echo "$page: published HTML verified"
          done
          taxi_page="travel-blog/ben-gurion-airport-taxis/index.html"
          test -s "$taxi_page"
          grep -Fq 'data-testid="airport-taxi-booking-steps"' "$taxi_page"
          grep -Fq 'data-testid="airport-taxi-destination-cards"' "$taxi_page"
          grep -Fq 'airport-taxi-sign.webp' "$taxi_page"
          grep -Fq 'Need a private airport pickup?' "$taxi_page"
          echo "$taxi_page: published HTML verified"
          REMOTE

      - name: Retire the removed tickets and admission page
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .output/public/tickets/index.html
          test -s .output/public/car-rental/index.html
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID/retired-tickets-page"
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "HOSTINGER_REMOTE_PATH='$HOSTINGER_REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' sh -s" <<'REMOTE'
          set -eu
          cd "$HOSTINGER_REMOTE_PATH"
          test -f .ith-static-deploy-ok
          test ! -L tickets
          relative=tickets/index.html
          if [ -f "$relative" ]; then
            test ! -L "$relative"
            umask 077
            mkdir -p "$BACKUP_DIR"
            mv "$relative" "$BACKUP_DIR/index.html"
          fi
          rmdir tickets 2>/dev/null || true
          test ! -e "$relative"
          test -s car-rental/index.html
          REMOTE

      - name: Retire the removed Israel holidays date-picker only
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The upload deliberately preserves unrelated Hostinger files.
          # This is a precisely scoped retirement of one public HTML file, with an
          # out-of-webroot backup. It does not install a permanent redirect or 410 rule:
          # /travel-blog/israel-holidays/ may be recreated in the future.
          test ! -e .output/public/travel-blog/israel-holidays/index.html
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID/retired-israel-holidays"
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "HOSTINGER_REMOTE_PATH='$HOSTINGER_REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' sh -s" <<'REMOTE'
          set -eu
          cd "$HOSTINGER_REMOTE_PATH"
          test -f .ith-static-deploy-ok
          test -d travel-blog
          test ! -L travel-blog
          test ! -L travel-blog/israel-holidays
          relative=travel-blog/israel-holidays/index.html
          if [ -f "$relative" ]; then
            test ! -L "$relative"
            umask 077
            mkdir -p "$BACKUP_DIR"
            mv "$relative" "$BACKUP_DIR/index.html"
          fi
          rmdir travel-blog/israel-holidays 2>/dev/null || true
          test ! -e "$relative"
          REMOTE

      - name: Retire obsolete Eilat travel-blog HTML without affecting new attraction page
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A non-deleting rsync keeps old HTML unless retired explicitly.
          # Back up only this exact obsolete HTML file outside public_html.
          test ! -e .output/public/travel-blog/eilat/index.html
          test -s .output/public/attractions/eilat/index.html
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID/retired-eilat-guide"
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "HOSTINGER_REMOTE_PATH='$HOSTINGER_REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' sh -s" <<'REMOTE'
          set -eu
          cd "$HOSTINGER_REMOTE_PATH"
          test -f .ith-static-deploy-ok
          test -d travel-blog
          test ! -L travel-blog
          test ! -L travel-blog/eilat
          relative=travel-blog/eilat/index.html
          if [ -f "$relative" ]; then
            test ! -L "$relative"
            umask 077
            mkdir -p "$BACKUP_DIR"
            mv "$relative" "$BACKUP_DIR/index.html"
          fi
          rmdir travel-blog/eilat 2>/dev/null || true
          test ! -e "$relative"
          test -s attractions/eilat/index.html
          REMOTE

      - name: Preserve established public URLs
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Move only the six superseded staging documents outside the webroot.
          # Require their restored replacements first; do not install redirects.
          for city in jerusalem tel-aviv haifa ein-bokek; do
            test -s ".output/public/travel-blog/ben-gurion-airport-to-$city/index.html"
            test ! -e ".output/public/travel-blog/how-to-get-from-ben-gurion-airport-to-$city/index.html"
          done
          test -s .output/public/private-driver-in-israel/index.html
          test ! -e .output/public/private-driver/index.html
          test -s .output/public/about-me/index.html
          test ! -e .output/public/about-moshe-barak/index.html
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID/restored-original-urls"
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "HOSTINGER_REMOTE_PATH='$HOSTINGER_REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' sh -s" <<'REMOTE'
          set -eu
          cd "$HOSTINGER_REMOTE_PATH"
          test -f .ith-static-deploy-ok
          test -d travel-blog
          test ! -L travel-blog
          for retired in \
            travel-blog/how-to-get-from-ben-gurion-airport-to-jerusalem \
            travel-blog/how-to-get-from-ben-gurion-airport-to-tel-aviv \
            travel-blog/how-to-get-from-ben-gurion-airport-to-haifa \
            travel-blog/how-to-get-from-ben-gurion-airport-to-ein-bokek \
            private-driver \
            about-moshe-barak; do
            case "$retired" in
              private-driver) retained=private-driver-in-israel ;;
              about-moshe-barak) retained=about-me ;;
              *) retained="travel-blog/${retired#travel-blog/how-to-get-from-}" ;;
            esac
            test ! -L "$retained"
            test ! -L "$retained/index.html"
            test -s "$retained/index.html"
            test ! -L "$retired"
            test ! -L "$retired/index.html"
            if [ -f "$retired/index.html" ]; then
              umask 077
              mkdir -p "$BACKUP_DIR/$retired"
              mv "$retired/index.html" "$BACKUP_DIR/$retired/index.html"
            fi
            rmdir "$retired" 2>/dev/null || true
            test ! -e "$retired/index.html"
          done
          REMOTE

      - name: Retire exact old accommodation HTML pages without redirects
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID/retired-accommodation"
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "HOSTINGER_REMOTE_PATH='$HOSTINGER_REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' sh -s" <<'REMOTE'
          set -eu
          cd "$HOSTINGER_REMOTE_PATH"
          test -f .ith-static-deploy-ok
          test ! -L accommodation
          umask 077
          for relative in \
            accommodation/jerusalem/downtown-hotels/index.html \
            accommodation/jerusalem/mamilla-king-david-hotels/index.html \
            accommodation/jerusalem/old-city-hotels/index.html \
            accommodation/jerusalem/mahane-yehuda-nachlaot-hotels/index.html \
            accommodation/jerusalem/east-jerusalem-hotels/index.html \
            accommodation/jerusalem/german-colony-baka-hotels/index.html \
            accommodation/tel-aviv/beachfront-hotels/index.html \
            accommodation/tel-aviv/dizengoff-city-center-hotels/index.html \
            accommodation/tel-aviv/old-north-port-hotels/index.html \
            accommodation/tel-aviv/neve-tzedek-hotels/index.html \
            accommodation/tel-aviv/jaffa-hotels/index.html \
            accommodation/tel-aviv/florentin-hotels/index.html \
            accommodation/tel-aviv/kerem-hateimanim-hotels/index.html \
            accommodation/tel-aviv/rothschild-boulevard-hotels/index.html \
            accommodation/haifa/boutique-hotels/index.html \
            accommodation/haifa/family-hotels/index.html \
            accommodation/tiberias/luxury-hotels/index.html \
            accommodation/tiberias/family-hotels/index.html \
            accommodation/dead-sea/spa-hotels/index.html \
            accommodation/dead-sea/family-hotels/index.html; do
            parent=${relative%/index.html}
            citydir=${parent%/*}
            if [ -L "$citydir" ] || [ -L "$parent" ] || [ -L "$relative" ]; then
              echo "Refusing symlink at $relative" >&2
              exit 1
            fi
            if [ -f "$relative" ]; then
              target="$BACKUP_DIR/$relative"
              mkdir -p "$(dirname "$target")"
              mv -- "$relative" "$target"
            fi
          done
          REMOTE
          echo "Retired old accommodation HTML pages into a private backup, when present."

      # Delete only the two explicitly withdrawn old guide HTML files.
      # The upload is non-destructive because PHP and other site assets
      # must remain untouched; take a private backup before retiring these paths.
      - name: Retire removed day-trip guide HTML
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID/retired-day-trip-guides"
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "HOSTINGER_REMOTE_PATH='$HOSTINGER_REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' sh -s" <<'REMOTE'
          set -eu
          cd "$HOSTINGER_REMOTE_PATH"
          test -f .ith-static-deploy-ok
          test ! -L travel-blog
          umask 077
          for slug in day-trips-from-jerusalem day-trips-from-tel-aviv; do
            old="travel-blog/$slug/index.html"
            test ! -L "travel-blog/$slug"
            test ! -L "$old"
            if [ -f "$old" ]; then
              mkdir -p "$BACKUP_DIR"
              mv -- "$old" "$BACKUP_DIR/$slug.html"
            fi
            test ! -e "$old"
          done
          REMOTE

      # This one retired map was published before switching Tabgha back to Google Maps.
      # Preserve normal upload behavior; relocate only this verified obsolete file.
      - name: Retire obsolete OpenStreetMap Tabgha file
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$(dirname "$HOSTINGER_REMOTE_PATH")/cms-static-backups/$GITHUB_RUN_ID"
          ssh -p "$HOSTINGER_SSH_PORT" -i "$HOME/.ssh/hostinger_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "set -eu
             old='$HOSTINGER_REMOTE_PATH/maps/tabgha-churches.html'
             if [ -L \"\$old\" ]; then echo 'Refusing to remove unexpected symlink' >&2; exit 1; fi
             if [ -f \"\$old\" ]; then
               grep -Fq 'tile.openstreetmap.org' \"\$old\" || { echo 'Obsolete file contents are unexpected' >&2; exit 1; }
               umask 077
               mkdir -p '$BACKUP_DIR'
               mv -- \"\$old\" '$BACKUP_DIR/retired-tabgha-churches.html'
             fi
             test ! -e \"\$old\""
          echo "Retired the exact obsolete Tabgha map only (or it was already absent)."

      - name: Read-only public smoke test
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
