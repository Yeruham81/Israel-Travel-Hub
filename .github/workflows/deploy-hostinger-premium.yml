            console.error("::error::Haifa must display eight principal city highlights");process.exitCode=1;
          }
          if (!html.includes("viator.tpm.li/") || !html.includes("getyourguide.tpm.li/")) {
            console.error("::error::Haifa Travelpayouts tour cards missing");process.exitCode=1;
          }
          const headings = [...html.matchAll(/<h[1-6]\b[^>]*>([\s\S]*?)<\/h[1-6]>/gi)]
            .map(m => m[1].replace(/<[^>]+>/g, "").trim());
          for (const title of ["Where to eat in Haifa","Practical tips for visiting Haifa","Getting to and around Haifa"]) {
            if (!headings.includes(title)) { console.error("::error::Haifa heading missing: "+title);process.exitCode=1; }
          }
          if (headings.some(title => /jaffa/i.test(title))) {
            console.error("::error::Jaffa heading leaked into Haifa guide");process.exitCode=1;
          }
          for (const code of ["368992P3","22120","58143P8"]) {
            if (!html.includes('data-provider-product-code="'+code+'"')) {
              console.error("::error::Haifa product ID missing: "+code);process.exitCode=1;
            }
          }
          if (html.includes("Guided Haifa city walk from the port")) {
            console.error("::error::Obsolete tour title on Haifa page");process.exitCode=1;
          }
          NODE
          for photo in haifa-bahai-gardens.webp haifa-stella-maris.webp haifa-cable-car.webp haifa-beach.webp haifa-german-colony.webp haifa-wadi-nisnas.webp haifa-turkish-market.webp haifa-bat-galim.webp; do
            curl --http1.1 --retry-all-errors --retry 2 --max-time 35 -fsSL "$VITE_CANONICAL_ORIGIN/images/attractions/$photo" -o "/tmp/$photo"
            node - "/tmp/$photo" "$photo" <<'NODE'
          const fs = require("node:fs"); const b=fs.readFileSync(process.argv[2]);
          if(b.length<1000||b.toString("ascii",0,4)!=="RIFF"||b.toString("ascii",8,12)!=="WEBP") {
            console.error("::error::Invalid Haifa photo: "+process.argv[3]);process.exit(1);
          }
          NODE
          done
          echo "Haifa guide, eight highlights, affiliate tours, canonical and eight photographs verified."

      - name: Verify published Sea of Galilee guide, sidebar and migration
        if: steps.freshness.outputs.current == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$VITE_CANONICAL_ORIGIN"
          # Use HTTP/1.1 and retries for Hostinger's intermittent HTTP/2 resets.
          curl --http1.1 --retry-all-errors --retry 3 --retry-delay 2 --max-time 40 -fsSL "$root/attractions/sea-of-galilee/" -o /tmp/sea-of-galilee-page.html
          curl --http1.1 --retry-all-errors --retry 3 --retry-delay 2 --max-time 40 -fsSL "$root/attractions/" -o /tmp/galilee-attractions-hub.html
          # Check the initial response separately: a permanent 301/308 is preferred
          # once the Hostinger .htaccess migration redirects have been installed.
          curl --http1.1 --retry-all-errors --retry 3 --retry-delay 2 --max-time 40 -fsS -D /tmp/galilee-legacy-headers.txt -o /tmp/galilee-legacy-initial.html "$root/travel-blog/sea-of-galilee/"
          curl --http1.1 --retry-all-errors --retry 3 --retry-delay 2 --max-time 40 -fsSL "$root/travel-blog/sea-of-galilee/" -o /tmp/galilee-legacy-alias.html
          curl --http1.1 --retry-all-errors --retry 3 --retry-delay 2 --max-time 40 -fsSL "$root/sitemap.xml" -o /tmp/galilee-sitemap.xml
          curl --http1.1 --retry-all-errors --retry 3 --retry-delay 2 --max-time 40 -fsSL "$root/images/attractions/sea-of-galilee.webp" -o /tmp/galilee-hero.webp
          node - <<'NODE'
          const fs = require("node:fs");
          const page = fs.readFileSync("/tmp/sea-of-galilee-page.html", "utf8");
          const hub = fs.readFileSync("/tmp/galilee-attractions-hub.html", "utf8");
          const legacy = fs.readFileSync("/tmp/galilee-legacy-alias.html", "utf8");
          const legacyHeaders = fs.readFileSync("/tmp/galilee-legacy-headers.txt", "utf8");
          const initial = legacyHeaders.split(/\r?\n\r?\n/).findLast(block => /^HTTP\/\S+\s+\d+/m.test(block)) ?? "";
          const initialStatus = Number(initial.match(/^HTTP\/\S+\s+(\d+)/m)?.[1] ?? 0);
          const redirectLocation = initial.match(/^location:\s*(\S+)/im)?.[1] ?? "";

          const sitemap = fs.readFileSync("/tmp/galilee-sitemap.xml", "utf8");
          const picture = fs.readFileSync("/tmp/galilee-hero.webp");
          const origin = process.env.VITE_CANONICAL_ORIGIN;
          const target = origin + "/attractions/sea-of-galilee/";
          const canonical = html => [...html.matchAll(/<link\b[^>]*>/gi)].some(match =>
            /\brel=["']canonical["']/i.test(match[0]) && match[0].includes('href="' + target + '"'));
          const errors = [];
          const check = (condition, description) => { if (!condition) errors.push(description); };
          check(canonical(page), "New page canonical");
          check(/<h1\b/i.test(page) && page.includes("The Sea of Galilee"), "Lake guide heading");
          check(page.includes('data-testid="attraction-at-a-glance"'), "At-a-glance facts");
          check(page.includes('data-testid="galilee-beaches"'), "Three beach options");
          check(page.includes("Tzemach Beach") && page.includes("Hukok North") && page.includes("Kursi Beach"), "Named supervised beaches");
          check(page.includes("Plan a day at the Sea of Galilee"), "Day itineraries");
          check(page.includes('data-testid="galilee-tour-cards"') && page.includes("viator.tpm.li/") && page.includes("getyourguide.tpm.li/"), "Affiliate tour cards");
          check(page.includes('data-testid="stay-trip-photo-grid"'), "Illustrated related guide cards");
          check(page.includes("Sea of Galilee &amp; Jordan River") || page.includes("Sea of Galilee & Jordan River"), "Sidebar full label");
          check(hub.includes("Sea of Galilee") && hub.includes("/attractions/sea-of-galilee/"), "Attractions hub route");
          const permanentRedirect = [301, 308].includes(initialStatus) && !!redirectLocation &&
            new URL(redirectLocation, origin + "/travel-blog/sea-of-galilee/").href === target;
          const noindexAlias = initialStatus === 200 && legacy.includes('noindex,follow') && canonical(legacy);
          check(permanentRedirect || noindexAlias,
            "Old Galilee route must permanently redirect to the new page or remain a canonical noindex alias (status: " + initialStatus + ")");

          check(sitemap.includes("/attractions/sea-of-galilee/") && !sitemap.includes("/travel-blog/sea-of-galilee/"), "Sitemap includes only the new route");
          check(picture.length > 1000 && picture.toString("ascii", 0, 4) === "RIFF" && picture.toString("ascii", 8, 12) === "WEBP", "Published hero WebP");
          if (errors.length) {
            for (const error of errors) console.error("::error::Sea of Galilee published audit failed: " + error);
            process.exit(1);
          }
          console.log("Sea of Galilee published route, canonical, beach content, tour cards, six-card block, sidebar, legacy alias, sitemap and hero verified.");
          NODE
