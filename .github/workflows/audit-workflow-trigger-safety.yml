name: Stage 5.5.5b - validate workflow trigger safety

on:
  push:
    branches: [audit/workflow-trigger-safety]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      VITE_INDEXABLE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify workflow trigger restrictions and unchanged execution steps
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, yaml
          base="531be0c328fa74c3e84494660d1ca440cfbe013f"
          paths=[p for p in pathlib.Path(".github/workflows").glob("*.yml") if p.name.startswith("travelpayouts-") or p.name in {"discovercars-affiliate-link.yml","generate-seven-travelpayouts-links.yml"}]
          assert len(paths)==16,len(paths)
          for p in paths:
              old=yaml.load(subprocess.check_output(["git","show",base+":"+str(p)],text=True),Loader=yaml.BaseLoader)
              new=yaml.load(p.read_text(),Loader=yaml.BaseLoader)
              assert set(new["on"])=={"workflow_dispatch"},p
              assert old["permissions"]==new["permissions"],p
              for name, job in new["jobs"].items():
                  if p.name=="travelpayouts-link-pilot.yml":
                      continue
                  assert job["if"]=="github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'",p
                  steps=job["steps"]
                  if p.name in {"travelpayouts-airport-platforms.yml","travelpayouts-food-eilat-tours.yml","travelpayouts-shore-excursions.yml","travelpayouts-welcome-retry.yml"}:
                      assert steps[2:4]==[{"uses":"oven-sh/setup-bun@v2","with":{"bun-version":"1.4.4"}},{"run":"bash scripts/install-ci-dependencies.sh"}],p
                      steps=steps[:2]+steps[4:]
                  assert steps==old["jobs"][name]["steps"],p
          p=pathlib.Path(".github/workflows/refresh-public-exchange-rates.yml")
          old=yaml.load(subprocess.check_output(["git","show",base+":"+str(p)],text=True),Loader=yaml.BaseLoader)
          new=yaml.load(p.read_text(),Loader=yaml.BaseLoader)
          assert set(new["on"])=={"workflow_dispatch","schedule"}
          assert new["on"]["schedule"]==old["on"]["schedule"]
          assert new["permissions"]==old["permissions"]
          assert new["jobs"]["refresh"]["steps"]==old["jobs"]["refresh"]["steps"]
          print("PASS: manual-only affiliate workflows; FX schedule unchanged; execution steps preserved")
          PY

      - name: Test deployment storage maintenance in isolated fixtures
        run: python3 scripts/test-deployment-storage.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bash scripts/install-ci-dependencies.sh

      - name: Validate operational scripts without external API calls
        shell: bash
        env:
          TRAVELPAYOUTS_API_TOKEN: ""
        run: |
          set -euo pipefail
          git ls-files -z scripts | while IFS= read -r -d '' script; do
            case "$script" in
              *.js|*.mjs|*.cjs) node --check "$script" ;;
              *.sh) bash -n "$script" ;;
            esac
          done
          for script in generate-airport-platforms generate-bethlehem-category-tours generate-bethlehem-tours generate-deadsea-tours generate-food-eilat-tours generate-galilee-tours generate-jerusalem-tours generate-masada-tours generate-negev-golan-tours generate-northern-coast-tours generate-seven-missing-links generate-shore-excursions generate-tel-aviv-tours; do
            node "scripts/travelpayouts/$script.mjs" --validate
          done
          node scripts/travelpayouts/generate-links.mjs --validate
          for input in remaining-hotels paamonim-hotel jerusalem-neighborhood-fifth-hotels haifa-browse; do
            node scripts/travelpayouts/generate-links.mjs "scripts/travelpayouts/$input.json" --validate
          done
          node --test scripts/israel-events-source.test.mjs scripts/travelpayouts/registry-source.test.mjs

      # TanStack Router regenerates routeTree.gen.ts at build time.
      # Build first so type-checking sees any newly added file routes.
      - name: Build production version
        run: bun run build

      - name: Check TypeScript
        run: npx tsc --noEmit

      # Opt-in diagnostics: reuse the installed dependencies and generated routes.
      # Unused declarations are reported, never a deployment gate.
      - name: Audit unused TypeScript declarations (non-blocking)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[unused-audit]')) }}
        continue-on-error: true
        shell: bash
        run: |
          report="$RUNNER_TEMP/unused-typescript.txt"
          status=0
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters > "$report" 2>&1 || status=$?
          cat "$report"
          echo "TypeScript diagnostic exit code: $status"
          python3 - "$report" "$status" <<'PY'
          import collections
          import os
          import pathlib
          import re
          import sys

          report = pathlib.Path(sys.argv[1]).read_text()
          status = int(sys.argv[2])
          unused_codes = {"6133", "6138", "6192", "6196", "6198"}
          counts = collections.Counter()
          files = collections.Counter()
          other = []
          for line in report.splitlines():
              match = re.match(r"^(.+?)\(\d+,\d+\): error TS(\d+):", line)
              if match:
                  path, code = match.groups()
                  if code in unused_codes:
                      counts[code] += 1
                      files[path] += 1
                  else:
                      other.append(line)
              elif re.search(r"\berror TS\d+:", line):
                  other.append(line)

          total = sum(counts.values())
          print(f"UNUSED_AUDIT: {total} diagnostics across {len(files)} files; {len(other)} other diagnostics")
          summary = [
              "### Optional TypeScript unused-declaration audit",
              f"- Unused-declaration diagnostics: {total}",
              f"- Files affected: {len(files)}",
              f"- Other compiler diagnostics: {len(other)}",
              f"- Compiler exit code: {status}",
              "",
              "| Diagnostic | Count |", "|---|---:|",
              *[f"| TS{code} | {count} |" for code, count in sorted(counts.items())],
              "",
              "| Source file | Diagnostics |", "|---|---:|",
              *[f"| `{path}` | {count} |" for path, count in files.most_common()],
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(summary) + "\n")
          if other or (status and not total):
              print("::warning::Unused-declaration audit may be incomplete; inspect compiler output.")
              sys.exit(1)
          PY

      - name: Run regression tests (editorial layout checks on manual runs only)
        env:
          CI_FUNCTIONAL_ONLY: "false"
        run: bun run test

      # Match the same static build that will be published to Premium hosting.
      # Running only the ordinary SSR build can miss prerender-specific failures.
      - name: Validate Hostinger prerender before any deployment is eligible
        env:
          HOSTINGER_STATIC_BUILD: "true"
          VITE_CANONICAL_ORIGIN: https://www.israel-taxi.com
          VITE_INDEXABLE: "true"
        run: |
          bash scripts/build-validated-static.sh
          node scripts/verify-hostinger-static-export.mjs --editorial
