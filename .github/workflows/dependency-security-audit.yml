name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    # Each Sunday at 05:19 UTC; security advisories change without code updates.
    - cron: "19 5 * * 0"
  push:
    branches: [main]
    paths:
      - "bun.lock"
      - "package.json"
      - ".github/workflows/dependency-security-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (without persisted credentials)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Audit production dependencies (high and critical)
        run: bun audit --prod --audit-level=high

      - name: Audit all dependencies including developer tooling
        if: always()
        run: bun audit --audit-level=high
