name: Temporary editorial disclaimer audit
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/temporary-editorial-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate redundant editorial qualifier candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,json,collections
          pat=re.compile(r"\b(?:not\s+(?:an?|the|intended|meant|necessarily|automatically|always|just|only|for|a\s+guaranteed)|rather\s+than|instead\s+of|does\s+not|do\s+not|no\s+guarantee|cannot|can't|aren't|isn't)\b",re.I)
          more=re.compile(r"(?:map|photo|image|figure|card|route|trip|itinerary|time|destination|location|journey|guide|illustrat|estimate|chart|comparison|indicative|precise|accurate|sketch|schematic)",re.I)
          rows=[]
          for root in ("src/components","src/data","src/routes","src/lib"):
            for p in sorted(pathlib.Path(root).rglob("*")):
              if p.suffix not in (".ts",".tsx",".md") or ".test." in p.name:continue
              try: lines=p.read_text().splitlines()
              except: continue
              for n,line in enumerate(lines,1):
                if not pat.search(line): continue
                if not more.search(line): continue
                for m in list(pat.finditer(line))[:8]:
                  s=max(0,m.start()-115);e=min(len(line),m.end()+200)
                  rows.append((str(p),n,line[s:e].replace("\t"," ")))
          print("TOTAL_EDITORIAL_NEGATION_CANDIDATES",len(rows))
          print("FILES_WITH_CANDIDATES",len(set(x[0] for x in rows)))
          groups=collections.Counter(x[0] for x in rows)
          for filename,count in groups.most_common(40): print("CANDIDATE_FILE",filename,count)
          for p,n,context in rows[:750]:
            print("CANDIDATE",json.dumps({"file":p,"line":n,"snippet":context},ensure_ascii=False))
          PY
      - name: Identify meta instructions, repetitive map captions and technical labels
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,json
          pats=[
            re.compile(r'\b(?:this|the) (?:map|image|photo|figure|table|chart|card|widget|guide|page|section) (?:shows|illustrates|displays|provides|covers|is|does|uses|helps|serves|means|points)\b',re.I),
            re.compile(r'\b(?:not an? (?:itinerary|route|guarantee|quote|map|booking|guide|live|current)|no (?:need|guarantee)|do not (?:assume|treat|mistake)|for orientation)\b',re.I),
            re.compile(r'\b(?:swipe|scroll|tap|click|hover) (?:the|on|to|through|sideways|down|up|left|right)\b',re.I),
            re.compile(r'\b(?:illustrative|indicative|approximate|estimated|snapshot|example)\b.{0,90}\b(?:not|only|for|rather|than)\b',re.I),
          ]
          rows=[]
          for root in ('src/components','src/data','src/routes'):
            for p in pathlib.Path(root).rglob('*'):
              if p.suffix not in ('.ts','.tsx') or '.test.' in p.name: continue
              for n,line in enumerate(p.read_text().splitlines(),1):
                if any(pat.search(line) for pat in pats):
                  line=line.strip()
                  if not line.startswith('//') and not line.startswith('/*') and not line.startswith('*'):
                    rows.append((str(p),n,line))
          print('META_COPY_CANDIDATE_LINES',len(rows))
          for p,n,s in rows[:500]:
            print('META_COPY',json.dumps({'path':p,'line':n,'text':s[:420]},ensure_ascii=False))
          PY
