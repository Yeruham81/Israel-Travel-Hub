name: Generate GigSky Israel eSIM affiliate link

on:
  push:
    branches: [main]
    paths:
      - 'scripts/travelpayouts/generate-gigsky.mjs'
      - '.github/workflows/gigsky-affiliate-link.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate generator syntax
        run: node --check scripts/travelpayouts/generate-gigsky.mjs
      - name: Generate tracked destination link
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/generate-gigsky.mjs
      - name: Upload link for implementation review
        uses: actions/upload-artifact@v4
        with:
          name: gigsky-israel-deeplink
          path: artifacts/gigsky-israel-link.json
          if-no-files-found: error
          retention-days: 14
