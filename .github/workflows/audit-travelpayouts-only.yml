name: Verify all affiliate links use Travelpayouts
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit-travelpayouts-only.cjs"
      - "scripts/travelpayouts/**"
      - "src/data/registry.ts"
      - "src/data/tours.ts"
      - "src/data/*affiliate*"
      - "src/lib/*affiliate*.ts"
      - "src/components/*BookingPlatforms.tsx"
      - "src/components/*Widget*.tsx"
      - "src/components/ExternalProviderTourCard.tsx"
      - "src/components/HotelDestinationPage.tsx"
      - "src/components/HotelCategoryPage.tsx"
      - "public/widgets/**"
      - ".github/workflows/audit-travelpayouts-only.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  affiliate-link-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enforce Travelpayouts-only source links
        run: node scripts/audit-travelpayouts-only.cjs
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'workflow_dispatch'
      - name: Install site dependencies
        if: github.event_name == 'workflow_dispatch'
        run: bun install --frozen-lockfile
      - name: Start isolated full-site preview
        if: github.event_name == 'workflow_dispatch'
        env:
          VITE_CANONICAL_ORIGIN: http://127.0.0.1:4173
          VITE_INDEXABLE: "false"
        run: |
          node scripts/generate-sitemap.mjs --mode development
          nohup ./node_modules/.bin/vite dev --host 127.0.0.1 --port 4173 > /tmp/travelpayouts-vite.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS --max-time 3 http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -80 /tmp/travelpayouts-vite.log
          exit 1
      - name: Install read-only Chromium
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm install --prefix /tmp/travelpayouts-audit --no-save playwright@1.56.1
          /tmp/travelpayouts-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Crawl all rendered pages in isolated preview and verify outbound links
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_PATH: /tmp/travelpayouts-audit/node_modules
          SITE_AUDIT_ORIGIN: http://127.0.0.1:4173
        run: node scripts/audit-travelpayouts-only.cjs --published
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelpayouts-affiliate-link-audit
          path: /tmp/travelpayouts-affiliate-audit.json
          if-no-files-found: warn
          retention-days: 14
