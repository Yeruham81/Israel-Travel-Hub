name: Import credited Old Jaffa Wishing Bridge photograph

# Editorial one-shot import, run only when this workflow file is added to main.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-jaffa-wishing-bridge.yml"

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download licensed original and convert to optimized local WebP
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 --max-time 60 \
            -H 'User-Agent: IsraelTravelHubEditor/1.0 (Wikimedia Commons photo attribution)' \
            'https://upload.wikimedia.org/wikipedia/commons/c/c0/PikiWiki_Israel_14029_Wishing_Bridge_in_Old_Jaffa.JPG' \
            -o /tmp/jaffa-wishing-bridge-source.jpg
          test "$(wc -c < /tmp/jaffa-wishing-bridge-source.jpg)" -gt 30000
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('/tmp/jaffa-wishing-bridge-source.jpg')
          assert source.width >= 800 and source.height >= 600
          source = source.convert('RGB')
          source.thumbnail((900, 675), Image.Resampling.LANCZOS)
          target = Path('public/images/attractions/jaffa-summit-garden.webp')
          source.save(target, 'WEBP', quality=82, method=6)
          print(f'Saved {target}: {source.size} and {target.stat().st_size} bytes')
          assert target.stat().st_size < 240000
          PY
      - name: Commit the image while retaining the original copyright attribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/attractions/jaffa-summit-garden.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Use licensed Avishai Teicher Wishing Bridge photo in Jaffa guide'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
