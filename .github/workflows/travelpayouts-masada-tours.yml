name: Travelpayouts Masada Dead Sea tour deep links
on:
  push:
    branches: [main]
    paths:
      - 'scripts/travelpayouts/generate-masada-tours.mjs'
      - '.github/workflows/travelpayouts-masada-tours.yml'
permissions:
  contents: read
jobs:
  generate:
    if: contains(github.event.head_commit.message, '[generate-masada-tour-links]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/travelpayouts/generate-masada-tours.mjs --validate
      - name: Generate exact product link candidates
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/generate-masada-tours.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masada-tour-link-candidates
          path: artifacts/travelpayouts-masada-tours.json
          if-no-files-found: warn
          retention-days: 14
