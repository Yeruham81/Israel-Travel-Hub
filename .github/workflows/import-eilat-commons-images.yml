name: Import licensed Eilat attraction photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-eilat-commons-images.yml"
permissions:
  contents: write
concurrency:
  group: eilat-commons-photo-import
  cancel-in-progress: false
jobs:
  import-photos:
    if: contains(github.event.head_commit.message, '[import-eilat-commons]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download verified Creative Commons Eilat photos and optimize to WebP
        run: |
          python -m pip install --disable-pip-version-check -q Pillow
          python - <<'PY'
          import json, re, time, urllib.parse, urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps

          # Each source is an actual Eilat location; author/license verified on Commons.
          photos = [
            ("eilat-birdwatching-park.webp", "PikiWiki Israel 85046 eilat bird park.jpg", "CC BY 2.5", .63),
            ("eilat-botanical-garden.webp", "Eilat Botanical garden 12.jpg", "CC BY-SA 3.0", .50),
            ("eilat-glass-bottom-boat.webp", "Glass-bottom boat, Israel Yam 7, Eilat (2023).jpg", "CC BY 4.0", .52),
          ]
          headers = {"User-Agent": "IsraelTravelHub/1.0 (licensed tourism photos; contact via repository)"}
          def download(url):
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=35) as response:
                          return response.read()
                  except Exception:
                      if attempt == 3: raise
                      time.sleep(2*(attempt+1))
          target_dir=Path("public/images/attractions")
          target_dir.mkdir(parents=True, exist_ok=True)
          for output, filename, expected, focus_x in photos:
              params=urllib.parse.urlencode({
                  "action":"query", "format":"json", "prop":"imageinfo",
                  "titles":"File:"+filename, "iiprop":"url|extmetadata",
                  "iiurlwidth":1200
              })
              metadata=json.loads(download("https://commons.wikimedia.org/w/api.php?"+params))
              info=next(iter(metadata["query"]["pages"].values())).get("imageinfo", [None])[0]
              if not info: raise ValueError("Missing Commons image metadata: "+filename)
              license_name=re.sub(r"<[^>]+>","",info.get("extmetadata",{}).get("LicenseShortName",{}).get("value",""))
              if license_name != expected: raise ValueError("License mismatch: "+filename+" "+repr(license_name))
              url=info.get("thumburl") or info.get("url")
              if not url or not (url.startswith("https://upload.wikimedia.org/") or url.startswith("https://thumb.wikimedia.org/")):
                  raise ValueError("Untrusted image URL: "+str(url))
              data=download(url)
              if not (12000 < len(data) < 8500000): raise ValueError("Unreasonable source file size")
              with Image.open(BytesIO(data)) as im:
                  im=ImageOps.exif_transpose(im).convert("RGB")
                  if min(im.size)<540: raise ValueError("Insufficient source resolution")
                  im=ImageOps.fit(im,(720,540),method=Image.Resampling.LANCZOS,centering=(focus_x,.5))
                  dest=target_dir/output
                  im.save(dest, "WEBP", quality=77, method=6)
              b=dest.read_bytes()
              if not (b[:4]==b"RIFF" and b[8:12]==b"WEBP" and 10000<len(b)<180000):
                  raise ValueError("Invalid/oversized WebP: "+output+" "+str(len(b)))
              print(output, len(b), expected)
          PY
      - name: Commit optimized images to site source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/attractions/eilat-birdwatching-park.webp public/images/attractions/eilat-botanical-garden.webp public/images/attractions/eilat-glass-bottom-boat.webp
          if git diff --cached --quiet; then echo "No image changes"; exit 0; fi
          git commit -m "Add three credited and optimized Eilat Commons photographs"
          git pull --rebase origin main
          git push origin HEAD:main
