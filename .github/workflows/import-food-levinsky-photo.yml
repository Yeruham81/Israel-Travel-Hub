name: Import licensed Levinsky spice shop photo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-food-levinsky-photo.yml"
permissions:
  contents: write
concurrency:
  group: israel-food-levinsky-image
  cancel-in-progress: false
jobs:
  import:
    if: contains(github.event.head_commit.message, '[food-levinsky-image]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -q Pillow
          python scripts/import-food-levinsky-photo.py
      - name: Add locally optimized photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/food-guide/levinsky-spice-shop.webp
          if git diff --cached --quiet; then echo "No image changes"; exit 0; fi
          git commit -m "Add credited Levinsky Market spice-shop WebP"
          git pull --rebase origin main
          git push origin HEAD:main
