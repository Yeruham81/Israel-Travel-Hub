name: Cookie consent browser audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/**/*Cookie*.tsx'
      - 'src/components/**/*Consent*.tsx'
      - 'src/components/**/*Widget*.tsx'
      - 'src/components/Analytics.tsx'
      - 'src/components/Layout.tsx'
      - 'src/components/HotelDestinationPage.tsx'
      - 'src/components/HotelCategoryPage.tsx'
      - 'src/components/MountOlivesAttractionPage.tsx'
      - 'src/styles.css'
      - 'src/components/CarRentalGuide.tsx'
      - 'src/components/*Footer*.tsx'
      - 'src/routes/__root.tsx'
      - 'src/routes/car-rental*'
      - 'src/routes/accommodation*'
      - 'src/hooks/use-cookie-consent.ts'
      - 'src/lib/*consent*.ts'
      - 'src/lib/analytics.ts'
      - 'src/lib/getyourguide-city-widget.ts'
      - 'public/maps/**'
      - 'public/widgets/**'
      - 'scripts/audit-cookie-consent.cjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/cookie-consent-audit.yml'

permissions:
  contents: read
concurrency:
  group: cookie-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: "true"
      VITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Install headless Chromium
        run: |
          npm install --prefix /tmp/cookie-audit --no-save playwright@1.56.1
          /tmp/cookie-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Start local website
        run: |
          node scripts/generate-sitemap.mjs --mode development
          nohup ./node_modules/.bin/vite dev --host 127.0.0.1 --port 4173 > /tmp/cookie-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS --max-time 4 http://127.0.0.1:4173/car-rental/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/cookie-vite.log
          exit 1
      - name: Verify actual browser requests and consent changes
        env:
          NODE_PATH: /tmp/cookie-audit/node_modules
        run: node scripts/audit-cookie-consent.cjs
      - name: Show preview diagnostics on failure
        if: failure()
        run: test ! -f /tmp/cookie-vite.log || tail -100 /tmp/cookie-vite.log
