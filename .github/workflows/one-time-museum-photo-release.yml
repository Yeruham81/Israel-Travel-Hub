name: One-time validated Hostinger museum photo release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-museum-photo-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-once:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Wait for full validation of the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          found_success=false
          for attempt in $(seq 1 70); do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '[.workflow_runs[] | select(.name == "Full Project Validation") | .conclusion] | first // ""')"
            echo "Full Project Validation: ${conclusion:-pending} (${attempt}/70)"
            if [[ "$conclusion" == "success" ]]; then
              found_success=true
              break
            fi
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" ]]; then
              echo "::error::Validation did not succeed"
              exit 1
            fi
            sleep 12
          done
          [[ "$found_success" == "true" ]] || { echo "::error::Validation timeout"; exit 1; }
      - name: Ensure no subsequent main commit exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$latest" == "$GITHUB_SHA" ]] || { echo "::error::Newer main commit; do not release stale version"; exit 1; }
      - name: Trigger the existing safe Hostinger workflow in live mode
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run deploy-hostinger-premium.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          echo "Dispatched standard Hostinger workflow for SHA $GITHUB_SHA"
