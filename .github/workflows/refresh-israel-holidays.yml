name: Refresh Israel holiday calendar

on:
  workflow_dispatch:
  schedule:
    # Weekly refresh; also runs once when this workflow is first committed.
    - cron: "23 4 * * 2"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-israel-holidays.yml"
      - "scripts/sync-israel-holidays.mjs"

permissions:
  contents: write

concurrency:
  group: holiday-calendar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download and validate future holiday calendars
        run: node scripts/sync-israel-holidays.mjs

      - name: Check whether the verified calendar changed
        id: changed
        run: |
          if git diff --quiet -- src/data/israelHolidayFuture.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.changed.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Validate site build, types and tests before publication
        if: steps.changed.outputs.changed == 'true'
        run: |
          bun run build
          npx tsc --noEmit
          bun run test

      - name: Commit snapshot only after successful validation
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/israelHolidayFuture.generated.json
          git commit -m "chore: refresh future Israel holiday dates"
          git push origin HEAD:main
