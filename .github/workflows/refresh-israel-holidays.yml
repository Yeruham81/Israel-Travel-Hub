name: Refresh Israel holiday calendar

on:
  workflow_dispatch:
  schedule:
    # Weekly refresh; also runs once when this workflow is first committed.
    - cron: "23 4 * * 2"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-israel-holidays.yml"
      - "scripts/sync-israel-holidays.mjs"

permissions:
  contents: write

concurrency:
  group: holiday-calendar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test holiday source title normalization
        run: node --test scripts/holiday-source-labels.test.mjs

      - name: Download and validate future holiday calendars
        run: node scripts/sync-israel-holidays.mjs

      - name: Check whether the verified calendar changed
        id: changed
        run: |
          if git diff --quiet -- src/data/israelHolidayFuture.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.changed.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore Bun download cache
        if: steps.changed.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: bash scripts/install-ci-dependencies.sh

      - name: Validate site build, types and tests before publication
        if: steps.changed.outputs.changed == 'true'
        run: |
          bun run build
          npx tsc --noEmit
          bun run test

      - name: Publish calendar update without overwriting concurrent changes
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/israelHolidayFuture.generated.json
          git commit -m "chore: refresh future Israel holiday dates"

          # Build and tests can modify tracked files (e.g. sitemap.xml) and
          # create untracked files. They were not part of the calendar commit.
          # A rebase requires a clean worktree, even though those files are
          # irrelevant to the snapshot being published.
          echo "Working-tree changes left by validation:"
          git status --short
          git stash push --include-untracked -m "Temporary CI validation outputs"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::CI working tree is not clean after stashing validation outputs."
            exit 1
          fi

          # Other code changes may reach main while calendar validation runs.
          # Rebase the calendar-only commit onto the latest remote history.
          # The stash belongs to this disposable Actions runner and is not
          # reapplied: unrelated generated files must never be published.
          # Never force-push; a conflict in the snapshot must fail safely.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Calendar update conflicts with changes on main. No remote files were overwritten."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Holiday calendar published successfully."
              exit 0
            fi
            echo "Main advanced during push attempt ${attempt}; retrying."
            sleep $((attempt * 2))
          done
          echo "::error::Main advanced during all 5 attempts. Calendar data was not published."
          exit 1
