name: Refresh Israel holiday calendar

on:
  workflow_dispatch:
  schedule:
    # Weekly refresh; also runs once when this workflow is first committed.
    - cron: "23 4 * * 2"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-israel-holidays.yml"
      - "scripts/sync-israel-holidays.mjs"

permissions:
  contents: write

concurrency:
  group: holiday-calendar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download and validate future holiday calendars
        run: node scripts/sync-israel-holidays.mjs

      - name: Commit snapshot only when the data changed
        run: |
          if git diff --quiet -- src/data/israelHolidayFuture.generated.json; then
            echo "Holiday snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/israelHolidayFuture.generated.json
          git commit -m "chore: refresh future Israel holiday dates"
          git push origin HEAD:main
