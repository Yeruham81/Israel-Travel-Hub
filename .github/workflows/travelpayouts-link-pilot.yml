name: Travelpayouts hotel affiliate-link generator

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Select hotel batch
        type: choice
        default: remaining
        options:
          - remaining
          - pilot
          - paamonim
          - jerusalem-areas
          - haifa-browse
  push:
    branches: [main]
    paths:
      - 'scripts/travelpayouts/**'
      - '.github/workflows/travelpayouts-link-pilot.yml'

permissions:
  contents: read

jobs:
  validate-input:
    name: Validate hotel input URLs without credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate generator syntax
        run: node --check scripts/travelpayouts/generate-links.mjs
      - name: Check pilot and remaining affiliate link source lists
        run: |
          node scripts/travelpayouts/generate-links.mjs --validate
          node scripts/travelpayouts/generate-links.mjs scripts/travelpayouts/remaining-hotels.json --validate
          node scripts/travelpayouts/generate-links.mjs scripts/travelpayouts/paamonim-hotel.json --validate
          node scripts/travelpayouts/generate-links.mjs scripts/travelpayouts/jerusalem-neighborhood-fifth-hotels.json --validate
          node scripts/travelpayouts/generate-links.mjs scripts/travelpayouts/haifa-browse.json --validate

  generate-links:
    name: Generate candidate links for review (never edits site)
    # API credentials are only accessed for manual runs or a deliberately tagged
    # config commit, never for unrelated workflow changes.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[generate-hotel-links]'))
    needs: validate-input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate candidates with Travelpayouts partner-link API
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          REQUESTED_BATCH: ${{ inputs.batch }}
          IS_PAAMONIM_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[paamonim-hotel]') }}
          IS_JERUSALEM_AREAS_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[generate-jerusalem-areas]') }}
          IS_HAIFA_BROWSE_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[generate-haifa-browse]') }}
        run: |
          if [ "$REQUESTED_BATCH" = "haifa-browse" ] || [ "$IS_HAIFA_BROWSE_PUSH" = "true" ]; then
            node scripts/travelpayouts/generate-links.mjs scripts/travelpayouts/haifa-browse.json
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const input = JSON.parse(readFileSync("scripts/travelpayouts/haifa-browse.json", "utf8"));
              const data = JSON.parse(readFileSync("artifacts/travelpayouts-pilot.json", "utf8"));
              if (data.project_id !== input.project_id || data.partner_id !== input.partner_id
                  || data.items?.length !== 5 || input.links.length !== 5) throw Error("Incomplete Haifa browse batch");
              for (const target of input.links) {
                const item = data.items.find(x => x.id === target.id);
                if (!item || item.original_url !== target.url || item.status !== "generated_pending_review"
                    || !/^https:\/\/expedia\.(?:tpm\.li|tpk\.lv)\/[A-Za-z0-9]+\/?(?:\?[^\s]*)?$/.test(item.affiliate_url ?? "")) {
                  throw Error("Unverified Haifa Expedia affiliate link: " + target.id);
                }
                console.log(target.id + " verified affiliate: " + item.affiliate_url);
              }
            '
          elif [ "$REQUESTED_BATCH" = "jerusalem-areas" ] || [ "$IS_JERUSALEM_AREAS_PUSH" = "true" ]; then
            node scripts/travelpayouts/generate-links.mjs scripts/travelpayouts/jerusalem-neighborhood-fifth-hotels.json
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const data = JSON.parse(readFileSync("artifacts/travelpayouts-pilot.json", "utf8"));
              const input = JSON.parse(readFileSync("scripts/travelpayouts/jerusalem-neighborhood-fifth-hotels.json", "utf8"));
              if (data.items?.length !== input.links.length || input.links.length !== 5) throw Error("Incomplete hotel batch");
              for (const item of input.links) {
                const result = data.items.find(x => x.id === item.id);
                if (!result || result.original_url !== item.url || result.status !== "generated_pending_review"
                    || !/^https:\/\/expedia\.(?:tpm\.li|tpk\.lv)\/[A-Za-z0-9]+\/?$/.test(result.affiliate_url ?? "")) {
                  throw Error("Unverified direct Expedia partner link: " + item.id);
                }
                console.log(item.id + " verified candidate: " + result.affiliate_url);
              }
            '
          elif [ "$REQUESTED_BATCH" = "paamonim" ] || [ "$IS_PAAMONIM_PUSH" = "true" ]; then
            node scripts/travelpayouts/generate-links.mjs scripts/travelpayouts/paamonim-hotel.json
            # The generated short affiliate URL is public; never print the protected API token.
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const data = JSON.parse(readFileSync("artifacts/travelpayouts-pilot.json", "utf8"));
              const item = data.items?.find(x => x.id === "jlm-paamonim");
              if (!item || item.original_url !== "https://www.expedia.com/Jerusalem-Hotels-Paamonim-Jerusalem-Hotel.h14708123.Hotel-Information"
                  || item.status !== "generated_pending_review"
                  || !/^https:\/\/expedia\.(?:tpm\.li|tpk\.lv)\/[A-Za-z0-9]+\/?$/.test(item.affiliate_url ?? "")) {
                throw Error("Paamonim partner link failed source and domain validation");
              }
              console.log("Paamonim approved candidate: " + item.affiliate_url);
            '
          elif [ "$REQUESTED_BATCH" = "pilot" ]; then
            node scripts/travelpayouts/generate-links.mjs
          else
            node scripts/travelpayouts/generate-links.mjs scripts/travelpayouts/remaining-hotels.json
          fi
      - name: Upload generated link candidates for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelpayouts-hotel-link-candidates
          path: |
            artifacts/travelpayouts-pilot.json
            artifacts/travelpayouts-pilot.csv
          if-no-files-found: warn
          retention-days: 14
