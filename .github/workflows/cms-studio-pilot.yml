name: CMS pilot - Validate or deploy Sanity Studio

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'cms-pilot/**'
      - '.github/workflows/cms-studio-pilot.yml'
  workflow_dispatch:
    inputs:
      deploy_studio:
        description: 'Deploy EDITOR only to Sanity hosting (never to Hostinger)'
        type: boolean
        required: true
        default: false
      studio_hostname:
        description: 'Sanity studio subdomain (without .sanity.studio)'
        type: string
        required: true
        default: 'israel-taxi-travel-ekfs0mfw'

permissions:
  contents: read

concurrency:
  group: sanity-studio-pilot
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Studio schema and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms-pilot
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Studio assets
        run: npm run build

  deploy-editor:
    name: Deploy pilot editor to Sanity hosting only
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      ${{ github.event_name == 'pull_request'
          && (github.event.action == 'labeled' || github.event.action == 'synchronize')
          && contains(github.event.pull_request.labels.*.name, 'cms-deploy-studio')
          && github.event.pull_request.number == 12
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.head.ref == 'feature/sanity-uber-pilot-20261112' }}
    defaults:
      run:
        working-directory: cms-pilot
    steps:
      - name: Checkout the same validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy Studio (not site)
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "Missing SANITY_AUTH_TOKEN GitHub Actions secret." >&2
            exit 1
          fi
          npx sanity deploy --url israel-taxi-travel-ekfs0mfw --yes --schema-required
