name: Import legacy Mount of Olives photographs

# Temporary, one-time local import of photographs from the owner's old website.
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-olives-local-images.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Migrate five authentic attraction photos into the local repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          import time

          photos = {
            "pater-noster.webp": "2026/02/Pater_Noster_Church_mount_of_olives_jerusalem.webp",
            "chapel-of-ascension.webp": "2026/02/Chapel_of_the_Ascension_mount_of_olives_jerusalem.webp",
            "dominus-flevit.webp": "2026/02/Dominus_Flevit_Church_in_Jerusalem.webp",
            "mary-magdalene-church.webp": "2025/08/Saint_Mary_Magdalene_Church_mount_of_olives_jerusalem_1.jpg.webp",
            "tomb-of-virgin-mary.webp": "2026/02/Tomb_of_the_Virgin_Mary._Staircase_of_47_steps.webp",
          }
          target = Path("public/images/jerusalem/mount-of-olives")
          target.mkdir(parents=True, exist_ok=True)
          for filename, original in photos.items():
            url = "https://www.israel-taxi.com/wp-content/uploads/" + original
            request = Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; Israel-Travel-Hub site photo migration)","Accept":"image/webp,image/*;q=0.9"})
            for attempt in range(3):
              try:
                with urlopen(request, timeout=25) as response:
                  image_bytes = response.read(2000001)
                break
              except (OSError, URLError):
                if attempt == 2: raise
                time.sleep(2)
            if not (len(image_bytes) >= 10000 and len(image_bytes) < 2000000 and image_bytes[:4] == b"RIFF" and image_bytes[8:12] == b"WEBP"):
              raise RuntimeError(f"Invalid webp {original}: {len(image_bytes)} bytes")
            (target/filename).write_bytes(image_bytes)
            print(f"{target/filename}: {len(image_bytes)} bytes")
          PY
      - name: Commit locally served media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/jerusalem/mount-of-olives/
          if ! git diff --cached --quiet; then
            git commit -m "Restore local Mount of Olives photos from original site media"
            git push origin HEAD:main
          fi
