name: Travelpayouts food and Eilat tour deeplinks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/travelpayouts/generate-food-eilat-tours.mjs'
      - '.github/workflows/travelpayouts-food-eilat-tours.yml'
permissions:
  contents: read
jobs:
  generate:
    if: contains(github.event.head_commit.message, '[generate-food-eilat-tour-links]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/travelpayouts/generate-food-eilat-tours.mjs --validate
      - name: Create exact product-specific links
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/generate-food-eilat-tours.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: food-eilat-tour-link-candidates
          path: artifacts/travelpayouts-food-eilat-tours.json
          if-no-files-found: warn
          retention-days: 14
