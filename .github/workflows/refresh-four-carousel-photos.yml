name: Restore Jaffa Masada Caesarea and Ramon carousel photography

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-four-carousel-photos.yml"

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, '[refresh-four-carousel-photos]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=12,<13"
      - name: Verify and optimize exact user-selected photographs from Commons originals
        run: python scripts/refresh_four_hero.py
      - name: Validate all 12 output files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          slugs = ("jaffa-port","masada-dead-sea","caesarea-coast","ramon-crater")
          dims = {"large":(2880,1440),"medium":(1920,960),"mobile":(900,1125)}
          limits = {"large":1600000,"medium":900000,"mobile":460000}
          for slug in slugs:
              for variant,expected in dims.items():
                  path=Path(f"src/assets/home/hero-refresh-{slug}-v3-{variant}.webp")
                  assert path.is_file() and 40000 < path.stat().st_size <= limits[variant], path
                  with Image.open(path) as img:
                      assert img.format=="WEBP" and img.size==expected, path
          assert len(list(Path("src/assets/home").glob("hero-refresh-*-v3-*.webp")))==12
          print("All 12 local WebP derivatives verified.")
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/home/hero-refresh-*-v3-*.webp
          git commit -m "Import four verified full resolution panoramas for hero carousel"
          git push origin HEAD:main
