name: Inspect legacy WordPress featured images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-wordpress-featured.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Read featured images from original site (read-only)
        shell: bash
        run: |
          python3 -m pip install -q requests beautifulsoup4
          python3 - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          base="https://www.israel-taxi.com"
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (compatible; IsraelTravelHubImageAudit/1.0; +https://www.israel-taxi.com)"})
          def imgurl(img):
              if img is None: return None
              for key in ("data-src","data-lazy-src","data-original","src"):
                  v=img.get(key)
                  if v and not (v.startswith("data:") or "placeholder" in v or "blank.gif" in v):
                      return v
              return None
          try:
              url=base+"/travel-blog/"
              response=session.get(url,timeout=55)
              print("ARCHIVE_STATUS",response.status_code,"BYTES",len(response.content),"FINAL_URL",response.url)
              response.raise_for_status()
              soup=BeautifulSoup(response.text,"html.parser")
              print("ARCHIVE_TITLE",soup.title.get_text(strip=True) if soup.title else "?")
              print("ALL_IMG_COUNT",len(soup.select("img")))
              candidates=soup.select("article, .elementor-post, .premium-blog-post-container, .e-loop-item, .jet-listing-grid__item")
              seen=set()
              for item in candidates:
                  head=item.select_one(".elementor-post__title, .entry-title, .post-title, h2, h3")
                  if not head: continue
                  anchor=head.find("a",href=True) or item.find("a",href=re.compile("/travel-blog/"))
                  if not anchor: continue
                  href=anchor.get("href","")
                  if href.rstrip("/") in (base+"/travel-blog", "/travel-blog"): continue
                  if not "/travel-blog/" in href: continue
                  if href in seen:continue
                  seen.add(href)
                  image=item.find("img")
                  result={"title":head.get_text(" ",strip=True),"href":href,"featured_src":imgurl(image),"alt":image.get("alt","") if image else "",
                           "article_class":" ".join(item.get("class",[]))}
                  print("ARCHIVE_CARD",json.dumps(result,ensure_ascii=False))
              print("ARCHIVE_CARDS_TOTAL",len(seen))
              if not seen:
                  for node in soup.find_all("img")[:8]:
                      print("IMAGE_SAMPLE",str(node)[:350])
                  for node in soup.find_all("article")[:2]:
                      print("ARTICLE_SAMPLE",str(node)[:850])
          except Exception as e:
              print("ARCHIVE_ERROR",repr(e))
          try:
              api=base+"/wp-json/wp/v2/posts"
              res=session.get(api,params={"per_page":100,"_embed":1},timeout=55)
              print("WP_API_STATUS",res.status_code,"BYTES",len(res.content),"CONTENT_TYPE",res.headers.get("content-type"))
              if res.ok and "json" in res.headers.get("content-type",""):
                  data=res.json()
                  if isinstance(data,list):
                      for post in data:
                          media=(post.get("_embedded") or {}).get("wp:featuredmedia") or []
                          feature=media[0].get("source_url") if media else None
                          print("WP_FEATURED",json.dumps({"slug":post.get("slug"),"link":post.get("link"),
                              "title":BeautifulSoup(post.get("title",{}).get("rendered",""),"html.parser").get_text(strip=True),
                              "image":feature,"featured_media":post.get("featured_media")},ensure_ascii=False))
                      print("WP_POSTS_TOTAL",len(data))
          except Exception as e:
              print("WP_API_ERROR",repr(e))
          PY
      - name: Compare original featured images with local image archive
        shell: bash
        run: |
          python3 -m pip install -q pillow imagehash beautifulsoup4 requests
          python3 - <<'PY'
          import os, io, json, re, requests, concurrent.futures
          from bs4 import BeautifulSoup
          from PIL import Image, ImageOps
          import imagehash
          base="https://www.israel-taxi.com/travel-blog/"
          r=requests.get(base,timeout=45,headers={"User-Agent":"Mozilla/5.0"});r.raise_for_status()
          doc=BeautifulSoup(r.text,"html.parser")
          entries=[]
          for article in doc.select("article"):
              h=article.select_one("h2, h3, .elementor-post__title, .entry-title")
              a=h.find("a",href=True) if h else None
              img=article.find("img")
              if a and img and "/travel-blog/" in a.get("href",""):
                  raw=img.get("data-src") or img.get("data-lazy-src") or img.get("src")
                  if raw and raw.startswith("http") and a["href"].rstrip("/") != base.rstrip("/"):
                      entries.append((a["href"].split("/travel-blog/")[-1].strip("/"),raw))
          local=[]
          for root in ("src/assets","public/images"):
              for folder,_,files in os.walk(root):
                  for file in files:
                      if not file.lower().endswith((".webp",".png",".jpg",".jpeg")):continue
                      p=os.path.join(folder,file)
                      try:
                          with Image.open(p) as im:
                              local.append((p,imagehash.phash(ImageOps.exif_transpose(im).convert("RGB"))))
                      except Exception: pass
          print("LOCAL_IMAGES",len(local),"LEGACY_FEATURED",len(entries))
          def inspect(entry):
              slug,url=entry
              try:
                  resp=requests.get(url,timeout=35,headers={"User-Agent":"Mozilla/5.0"});resp.raise_for_status()
                  with Image.open(io.BytesIO(resp.content)) as im:
                      oldhash=imagehash.phash(ImageOps.exif_transpose(im).convert("RGB"))
                  best=sorted(((oldhash-hash,path) for path,hash in local),key=lambda x:x[0])[:3]
                  return {"slug":slug,"filename":url.split("/")[-1],"matches":[{"distance":int(n),"local":p} for n,p in best]}
              except Exception as e:return {"slug":slug,"filename":url.split("/")[-1],"error":str(e)[:120]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              results=list(pool.map(inspect,entries))
          for item in results:print("PHOTO_MATCH",json.dumps(item,ensure_ascii=False))
          PY
