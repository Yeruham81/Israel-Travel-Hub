name: One-time safe security dependency patches

on:
  push:
    branches:
      - security/lockfile-patches-oct-2026
    paths:
      - .github/workflows/dependency-patch-one-time.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      VITE_INDEXABLE: "false"
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Verify input lockfile
        run: bun install --frozen-lockfile
      - name: Preview compatible vulnerability fixes
        run: bun audit fix --audit-level=high --dry-run || true
      - name: Apply compatible patch/minor fixes only (never --latest)
        run: |
          set +e
          bun audit fix --audit-level=high > /tmp/security-patch-report.log 2>&1
          status=$?
          set -e
          cat /tmp/security-patch-report.log
          # Exit code 1 may mean remaining advisories, not failure to apply
          # some safe fixes. Fail on a package-registry/network error instead.
          if grep -Eiq 'error fetching|timed out|ECONNRESET|unable to resolve|failed to fetch' /tmp/security-patch-report.log; then
            echo "::error::Dependency registry error; not publishing a partial lockfile."
            exit 1
          fi
          echo "Bun fix exit code: $status (remaining advisories are handled separately)."
          git diff --stat -- package.json bun.lock
      - name: Verify dependency graph
        run: bun install --frozen-lockfile
      - name: Production audit (report outstanding advisories without hiding them)
        continue-on-error: true
        run: bun audit --prod --audit-level=high
      - name: Full audit (also includes build tooling)
        continue-on-error: true
        run: bun audit --audit-level=high
      - name: Validate build, type-check, and tests
        run: |
          bun run build
          bunx tsc --noEmit
          bun run test
      - name: Commit only tested package patches and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json bun.lock
          # Do not leave an auto-updater or scheduled write workflow in the PR.
          git rm -- .github/workflows/dependency-patch-one-time.yml
          git commit -m 'Apply verified, within-range security updates to Bun dependencies'
          # Builds may regenerate a route tree or sitemap. Never commit those
          # unrelated outputs, and ensure they cannot break the rebase.
          git stash push --include-untracked -m 'CI build output not part of security patch'
          # We are already based on the remote security branch's workflow
          # commit. Do NOT rebase this temporary branch onto main here, because
          # that rewrites its history and the safe non-force push is rejected.
          git push origin HEAD:security/lockfile-patches-oct-2026
