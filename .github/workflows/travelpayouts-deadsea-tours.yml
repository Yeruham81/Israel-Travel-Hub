name: Generate Jerusalem Dead Sea Travelpayouts links

# Explicit operator action only; source formatting must never call the partner API.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Generate Jerusalem-to-Dead-Sea candidate partner links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate generator syntax
        run: |
          node --check scripts/travelpayouts/generate-deadsea-tours.mjs
          node scripts/travelpayouts/generate-deadsea-tours.mjs --validate
      - name: Use protected API token to generate Jerusalem-to-Dead-Sea links
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/generate-deadsea-tours.mjs
      - name: Upload generated candidates (requires editorial approval to publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelpayouts-deadsea-jerusalem-to-the-dead-sea-links
          path: artifacts/travelpayouts-deadsea-jerusalem-to-the-dead-sea.json
          if-no-files-found: warn
          retention-days: 14
