name: Generate Jerusalem Dead Sea Travelpayouts links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/travelpayouts/generate-deadsea-tours.mjs'
      - '.github/workflows/travelpayouts-deadsea-tours.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Generate U017 candidate partner links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate generator syntax
        run: |
          node --check scripts/travelpayouts/generate-deadsea-tours.mjs
          node scripts/travelpayouts/generate-deadsea-tours.mjs --validate
      - name: Use protected API token to generate U017 links
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/generate-deadsea-tours.mjs
      - name: Upload generated candidates (requires editorial approval to publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelpayouts-deadsea-u017-links
          path: artifacts/travelpayouts-deadsea-u017.json
          if-no-files-found: warn
          retention-days: 14
