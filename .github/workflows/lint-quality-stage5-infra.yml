name: Stage 5.5.5b - persist verified YAML patch and validate committed code
on:
  push:
    branches: [audit/lint-quality-stage5-infra]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-5-5-5b-infra-permanent
  cancel-in-progress: false
jobs:
  persist:
    if: github.ref == 'refs/heads/audit/lint-quality-stage5-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5-5b-infra-trial
          run-id: 46061138078
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Apply exact verified YAML patch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          383e62c0607c908a1b500ac12e80ed6b7b7dbad8ab3c4cd18576c26adccbcda2  stage-5-5-5b-infra.patch
          HASHES
          )
          test "$(git rev-parse origin/main)" = 31d7963b29101048f62925c1c849d35449f59d88
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/audit/lint-quality-stage5-infra)"
          git diff --exit-code
          if git apply --reverse --check "$out/stage-5-5-5b-infra.patch" 2>/dev/null; then
            echo "Verified patch already present"
          else
            git merge-base --is-ancestor 31d7963b29101048f62925c1c849d35449f59d88 HEAD
            test "$(git diff --name-only 31d7963b29101048f62925c1c849d35449f59d88 HEAD)" = .github/workflows/lint-quality-stage5-infra.yml
            git apply --check "$out/stage-5-5-5b-infra.patch"
            git apply --index "$out/stage-5-5-5b-infra.patch"
            git diff --cached --check
            python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"verified-trial"
          expected=set(json.loads((out/"changed.json").read_text()))
          scope=set(json.loads((out/"scope.json").read_text()))
          actual=set(subprocess.check_output(["git","diff","--cached","--name-only","-z"]).decode().split("\0"))-{""}
          assert len(expected)==20 and len(scope)==52 and expected<=scope
          assert actual==expected,(actual-expected,expected-actual)
          assert all(x.startswith(".github/workflows/") and x.endswith((".yml",".yaml")) and x!=".github/workflows/lint-quality-stage5-infra.yml" for x in actual)
          # The artifact excludes hidden candidate paths. Reconstruct the verified
          # patch in an isolated index from the pinned reference, and compare blobs.
          import tempfile
          with tempfile.TemporaryDirectory() as tmp:
              env={**os.environ,"GIT_INDEX_FILE":str(pathlib.Path(tmp)/"index")}
              subprocess.run(["git","read-tree","31d7963b29101048f62925c1c849d35449f59d88"],env=env,check=True)
              subprocess.run(["git","apply","--cached",str(out/"stage-5-5-5b-infra.patch")],env=env,check=True)
              def blob(file,env):
                  return subprocess.check_output(["git","show",":"+file],env=env)
              for file in actual:
                  assert blob(file,env)==blob(file,os.environ)==pathlib.Path(file).read_bytes(),file
          report=json.loads((out/"yaml-report.json").read_text())
          assert len(report)==52 and {r["file"] for r in report}==scope
          assert all(r["semanticParity"] and r["status"] in ("changed","already-formatted") for r in report)
          assert {r["file"] for r in report if r["status"]=="changed"}==expected
          print("Exact verified scope:",len(actual),"YAML infrastructure files")
          PY
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stage 5.5.5b: permanently apply verified YAML formatting patch'
            git push origin HEAD:refs/heads/audit/lint-quality-stage5-infra
          fi
          git diff --exit-code
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Permanent commit: $(git rev-parse HEAD)"
  validate:
    needs: persist
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      CI_FUNCTIONAL_ONLY: "false"
      VITE_INDEXABLE: "true"
      VITE_CANONICAL_ORIGIN: https://www.israel-taxi.com
      HOSTINGER_STATIC_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.persist.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5-5b-infra-trial
          run-id: 46061138078
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Verify permanent commit and exact patch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          383e62c0607c908a1b500ac12e80ed6b7b7dbad8ab3c4cd18576c26adccbcda2  stage-5-5-5b-infra.patch
          HASHES
          )
          test "$(git rev-parse HEAD)" = "${{ needs.persist.outputs.commit }}"
          test "$(git rev-parse origin/main)" = 31d7963b29101048f62925c1c849d35449f59d88
          git merge-base --is-ancestor origin/main HEAD
          git apply --reverse --check "$out/stage-5-5-5b-infra.patch"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/permanent-report"
          git rev-parse HEAD | tee "$RUNNER_TEMP/permanent-report/validated-commit.txt"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Build current main reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/main-reference" 31d7963b29101048f62925c1c849d35449f59d88
          cd "$RUNNER_TEMP/main-reference"
          bash scripts/install-ci-dependencies.sh
          bash scripts/build-validated-static.sh
      - name: Lint and check 52 YAML infrastructure files
        run: |
          bun run lint
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import prettier from 'prettier';
          const scope=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'verified-trial','scope.json'),'utf8'));
          if(scope.length!==52)throw Error('Unexpected scope');
          for(const file of scope){
            const options=await prettier.resolveConfig(file);
            if(!await prettier.check(fs.readFileSync(file,'utf8'),{...options,filepath:file}))throw Error('Formatting failed '+file);
          }
          console.log('PASS: all 52 committed YAML infrastructure files satisfy Prettier');
          JS
      - name: Build production and verify static export and strict TypeScript
        run: |
          node --test scripts/israel-events-source.test.mjs scripts/travelpayouts/registry-source.test.mjs scripts/verify-photo-credits.test.mjs
          python3 scripts/test-deployment-storage.py
          python3 - <<'PY'
          import ast, pathlib, subprocess, yaml, json, os
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"verified-trial"
          for file in json.loads((out/"scope.json").read_text()):
              before=subprocess.check_output(["git","show","31d7963b29101048f62925c1c849d35449f59d88:"+file],text=True)
              after=pathlib.Path(file).read_text()
              def fingerprint(text, loader):
                  def node(n):
                      if isinstance(n,yaml.ScalarNode): return ("scalar",n.tag,n.value)
                      if isinstance(n,yaml.SequenceNode): return ("sequence",n.tag,[node(x) for x in n.value])
                      if isinstance(n,yaml.MappingNode): return ("mapping",n.tag,[(node(k),node(v)) for k,v in n.value])
                      raise ValueError("Unsupported node")
                  return node(yaml.compose(text,Loader=loader))
              assert all(fingerprint(before,l)==fingerprint(after,l) for l in (yaml.BaseLoader,yaml.SafeLoader)),file
          for p in pathlib.Path("scripts").rglob("*.py"): ast.parse(p.read_text(),filename=str(p))
          for p in pathlib.Path("scripts").rglob("*.sh"): subprocess.run(["bash","-n",str(p)],check=True)
          print("PASS: 52 YAML files preserve parsed semantics; Python and Shell syntax checked")
          PY
          bash scripts/build-validated-static.sh
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters
          node scripts/verify-hostinger-static-export.mjs --editorial
      - name: Compare committed production output with main
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/verified-trial/compare.py" "$RUNNER_TEMP/main-reference/.output/public" .output/public | tee "$RUNNER_TEMP/permanent-report/production-parity.txt"
      - name: Full regression on permanent commit
        shell: bash
        run: |
          set -euo pipefail
          VITE_INDEXABLE=false HOSTINGER_STATIC_BUILD=false bun run test 2>&1 | tee "$RUNNER_TEMP/permanent-report/regression.txt"
      - name: Guard authored source after validation
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only","-z"]).decode().split("\0"))-{""}
          allowed={"src/data/generated/guide-directory.ts","src/routeTree.gen.ts","public/sitemap.xml","public/robots.txt"}
          assert changed<=allowed,changed-allowed
          PY
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-5-5b-infra-permanent-validation
          path: ${{ runner.temp }}/permanent-report/
          if-no-files-found: warn
