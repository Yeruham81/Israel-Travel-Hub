name: Optimize airport-transfer hub images

on:
  push:
    branches: [main]
    paths:
      - "scripts/optimize_airport_hub_images.py"
      - ".github/workflows/optimize-airport-hub-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: optimize-airport-hub-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for proportional WebP resize
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Generate the airport hub's small image variants
        run: python scripts/optimize_airport_hub_images.py
      - name: Verify output integrity and measured size savings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          d = json.loads(Path('docs/AIRPORT_HUB_IMAGE_DELIVERY_REPORT.json').read_text())
          assert len(d['files']) == 14, d
          assert d['savedBytes'] > 150000, d
          for f in d['files']:
              with Image.open(f['optimized']) as img:
                  assert img.format == 'WEBP'
                  assert img.width <= f['sourceWidth']
              assert f['optimizedBytes'] <= f['sourceBytes']
          print('Source-to-thumbnail reduction:', d['savedBytes'], 'bytes')
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked application dependencies
        run: bash scripts/install-ci-dependencies.sh
      - name: Build project and generate the typed route tree
        run: bun run build
      - name: Run hub visual/functionality regressions
        run: bun x vitest run src/test/airport-transfers.test.tsx
      - name: Verify TypeScript
        run: bun x tsc --noEmit
      - name: Commit verified image and hub changes without overwriting concurrent edits
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/airport-transfers/*-hub.webp \
            src/data/airportTransfers.ts \
            src/components/AirportDestinationCard.tsx \
            src/components/GuideHeroMedia.tsx \
            src/routes/airport-transfers.index.tsx \
            src/test/airport-transfers.test.tsx \
            docs/AIRPORT_HUB_IMAGE_DELIVERY_REPORT.json
          if git diff --cached --quiet; then
            echo "Nothing to optimize"
          else
            git commit -m "Serve compact high-quality airport hub images"
            # The Vite build regenerates a tracked route tree. It is not part
            # of this image-only change; reset sandbox-only unstaged outputs
            # after committing the approved assets, before rebasing.
            git status --short
            git reset --hard HEAD
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Optimized images safely committed"
                break
              fi
              if [[ "$i" == "5" ]]; then
                echo "::error::Unable to push safely after five attempts"
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Validate the final main branch for Hostinger deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run full-project-validation.yml --ref main
