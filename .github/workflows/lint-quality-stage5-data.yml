name: Stage 5.5.3 - persist verified data patch and validate committed code
on:
  push:
    branches: [audit/lint-quality-stage5-data]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-5-5-3-permanent
  cancel-in-progress: false
jobs:
  persist:
    if: github.ref == 'refs/heads/audit/lint-quality-stage5-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5-3-data-trial
          run-id: 46042252263
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Apply exact verified data patch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          40e495de788f37cdf739d64688271472a1694355c335f9f6b3896147a8dae2ab  stage-5-5-3-data.patch
          54f5742400bf64f8fefa698ac227169cfc34aada4238bd507cacc6641459b7d2  changed.json
          fc9f24087b337009b57fed151e7e8d314255122b305896628306abd04bf0ff11  compare.py
          0ced140c004f945f1737a7821bb7c7a990e0c941e9f145ff8c9f413e6b4e3350  emitted-comparison.json
          7817e47401c585b40dcaf23bd33a3c4d3682c25cc5d761297b2a4a3dd737c362  scope.json
          HASHES
          )
          test "$(git rev-parse origin/main)" = 48d6696cb2fdc81ab52cb901f8d394d21abb8625
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/audit/lint-quality-stage5-data)"
          git diff --exit-code
          if git apply --reverse --check "$out/stage-5-5-3-data.patch"; then
            echo "Verified patch already present"
          else
            test "$(git rev-parse HEAD^)" = c8594654663492e90263f28a3e2f8fd4192a6aa2
            test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/lint-quality-stage5-data.yml
            git apply --check "$out/stage-5-5-3-data.patch"
            git apply --index "$out/stage-5-5-3-data.patch"
            git diff --cached --check
            python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"verified-trial"
          expected=set(json.loads((out/"changed.json").read_text()))
          scope=set(json.loads((out/"scope.json").read_text()))
          actual=set(subprocess.check_output(["git","diff","--cached","--name-only","-z"]).decode().split("\0"))-{""}
          assert len(expected)==106 and len(scope)==110 and expected<=scope
          assert actual==expected,(actual-expected,expected-actual)
          assert all(x.startswith("src/data/") and x.endswith(".ts") and not x.endswith(".test.ts") for x in actual)
          print("Exact verified scope:",len(actual),"authored data files")
          PY
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stage 5.5.3: permanently apply verified data formatting patch'
            git push origin HEAD:refs/heads/audit/lint-quality-stage5-data
          fi
          git diff --exit-code
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Permanent commit: $(git rev-parse HEAD)"
  validate:
    needs: persist
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      CI_FUNCTIONAL_ONLY: "false"
      VITE_INDEXABLE: "true"
      VITE_CANONICAL_ORIGIN: https://www.israel-taxi.com
      HOSTINGER_STATIC_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.persist.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5-3-data-trial
          run-id: 46042252263
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Verify permanent commit and exact patch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          40e495de788f37cdf739d64688271472a1694355c335f9f6b3896147a8dae2ab  stage-5-5-3-data.patch
          54f5742400bf64f8fefa698ac227169cfc34aada4238bd507cacc6641459b7d2  changed.json
          fc9f24087b337009b57fed151e7e8d314255122b305896628306abd04bf0ff11  compare.py
          0ced140c004f945f1737a7821bb7c7a990e0c941e9f145ff8c9f413e6b4e3350  emitted-comparison.json
          7817e47401c585b40dcaf23bd33a3c4d3682c25cc5d761297b2a4a3dd737c362  scope.json
          HASHES
          )
          test "$(git rev-parse HEAD)" = "${{ needs.persist.outputs.commit }}"
          test "$(git rev-parse origin/main)" = 48d6696cb2fdc81ab52cb901f8d394d21abb8625
          git merge-base --is-ancestor origin/main HEAD
          git apply --reverse --check "$out/stage-5-5-3-data.patch"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/permanent-report"
          git rev-parse HEAD | tee "$RUNNER_TEMP/permanent-report/validated-commit.txt"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Build current main reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/main-reference" 48d6696cb2fdc81ab52cb901f8d394d21abb8625
          cd "$RUNNER_TEMP/main-reference"
          bash scripts/install-ci-dependencies.sh
          bash scripts/build-validated-static.sh
      - name: Lint and check 110 authored data files
        run: |
          bun run lint
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import prettier from 'prettier';
          const scope=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'verified-trial','scope.json'),'utf8'));
          if(scope.length!==110)throw Error('Unexpected scope');
          for(const file of scope){
            const options=await prettier.resolveConfig(file);
            if(!await prettier.check(fs.readFileSync(file,'utf8'),{...options,filepath:file}))throw Error('Formatting failed '+file);
          }
          console.log('PASS: all 110 committed authored data files satisfy Prettier');
          JS
      - name: Build production and verify static export and strict TypeScript
        run: |
          bash scripts/build-validated-static.sh
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters
          node scripts/verify-hostinger-static-export.mjs --editorial
      - name: Compare committed production output with main
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/verified-trial/compare.py" "$RUNNER_TEMP/main-reference/.output/public" .output/public | tee "$RUNNER_TEMP/permanent-report/production-parity.txt"
      - name: Full regression on permanent commit
        shell: bash
        run: |
          set -euo pipefail
          VITE_INDEXABLE=false HOSTINGER_STATIC_BUILD=false bun run test 2>&1 | tee "$RUNNER_TEMP/permanent-report/regression.txt"
      - name: Guard authored source after validation
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only","-z"]).decode().split("\0"))-{""}
          allowed={"src/data/generated/guide-directory.ts","src/routeTree.gen.ts","public/sitemap.xml","public/robots.txt"}
          assert changed<=allowed,changed-allowed
          PY
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-5-3-permanent-validation
          path: ${{ runner.temp }}/permanent-report/
          if-no-files-found: warn
