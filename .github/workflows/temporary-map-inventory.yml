name: Temporary embedded-map route inventory
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/temporary-map-inventory.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: List map embeds and route-provider URLs throughout published site
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,re,collections
          paths=[]
          for root in ('src','public'):
            paths.extend(p for p in pathlib.Path(root).rglob('*') if p.is_file() and p.suffix in ('.ts','.tsx','.html','.json','.md') and not ('.test.' in p.name or p.name.endswith('.json') or '/maps/english-style' in str(p)))
          cues=[
            re.compile(r'<iframe',re.I),
            re.compile(r'(?:maps\\.google\\.com|google\\.com/maps|google\\.com/url|google\\.com/maps/embed|maps/embed|output=embed|saddr=|daddr=|/maps/dir/|/maps/area\\.html)',re.I),
            re.compile(r'(?:mapEmbed|mapIframe|mapUrl|mapSource|mapSrc|directionsUrl|directionsMap|showRoute|routeMap)',re.I)
          ]
          hits=[]
          for p in sorted(paths):
            try: rows=p.read_text().splitlines()
            except: continue
            relevant=[]
            for j,row in enumerate(rows,1):
              if any(pat.search(row) for pat in cues):
                relevant.append({'line':j,'text':row.strip()[:650]})
            if relevant:
              hits.append({'file':str(p),'count':len(relevant),'refs':relevant[:70]})
          print('MAP_INVENTORY_FILE_COUNT',len(hits))
          for hit in hits:
            if not (hit['file'].startswith('src/components/') or hit['file'].startswith('src/data/') or hit['file'].startswith('src/routes/') or hit['file'].startswith('public/maps/')):continue
            print('MAP_INVENTORY',json.dumps(hit,ensure_ascii=False))
          PY
