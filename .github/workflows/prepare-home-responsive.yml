name: Prepare responsive homepage feature and destination images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-home-responsive.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install optimizer
        run: python3 -m pip install --quiet --user Pillow
      - name: Build sized images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          base = Path("src/assets/home")
          tiles = ["jerusalem-old-city","tel-aviv-coast","tiberias-lake","bethlehem-nativity","masada-dead-sea","caesarea-aqueduct"]
          features = ["airport-pickup","guided-tour","cruise-port","hotel-room","caesarea-dusk"]
          for stem in tiles + ["../haifa/panorama","../dead-sea/beach"]:
              file = base / (stem + ".webp")
              with Image.open(file) as source:
                  img = ImageOps.exif_transpose(source).convert("RGB")
                  img.thumbnail((720, 720), Image.Resampling.LANCZOS)
                  output = file.with_name(file.stem+"-tile.webp")
                  img.save(output,"WEBP",quality=67,method=6)
                  print(f"tile {file}: {file.stat().st_size} -> {output.stat().st_size}")
          for stem in features:
              file = base / (stem+".webp")
              with Image.open(file) as source:
                  img = ImageOps.exif_transpose(source).convert("RGB")
                  img.thumbnail((1080, 800), Image.Resampling.LANCZOS)
                  output = file.with_name(file.stem+"-feature.webp")
                  img.save(output,"WEBP",quality=70,method=6)
                  print(f"feature {file}: {file.stat().st_size} -> {output.stat().st_size}")
          PY
      - name: Commit image variants
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/home/*-tile.webp src/assets/home/*-feature.webp src/assets/haifa/*-tile.webp src/assets/dead-sea/*-tile.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add right-sized WebP images for homepage photo tiles and service features'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
