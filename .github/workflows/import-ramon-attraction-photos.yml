name: Import illustrated Ramon attractions photos once
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-ramon-attraction-photos.yml]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch Creative Commons reference photographs and resize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/attractions
          curl -fL --retry 4 --retry-delay 2 --max-time 75 -A 'IsraelTravelHub-Guide/1.0 (asset import, Wikimedia credit retained)' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sandy%20rectangular%20and%20hexagonal%20prisms%20at%20the%20centre%20of%20Makhtesh%20Ramon%20-%20Ha-Minsara%20(The%20Carpentry%20Shop)%2C%20Israel.jpg?width=800' -o /tmp/ramon-minsara.jpg
          curl -fL --retry 4 --retry-delay 2 --max-time 75 -A 'IsraelTravelHub-Guide/1.0 (asset import, Wikimedia credit retained)' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Fat%20Sand%20Rat.jpg?width=800' -o /tmp/hai-ramon-fat-sand-rat.jpg
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          for source, dest in [
            ('/tmp/ramon-minsara.jpg', 'public/images/attractions/ramon-haminsara-columns.webp'),
            ('/tmp/hai-ramon-fat-sand-rat.jpg', 'public/images/attractions/hai-ramon-fat-sand-rat.webp'),
          ]:
            with Image.open(source) as im:
              im = im.convert('RGB')
              im.thumbnail((800, 600))
              im.save(dest, 'WEBP', quality=76, method=6)
              print(dest, im.size)
          PY
          test -s public/images/attractions/ramon-haminsara-columns.webp
          test -s public/images/attractions/hai-ramon-fat-sand-rat.webp
      - name: Commit the optimized locally hosted photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/attractions/ramon-haminsara-columns.webp public/images/attractions/hai-ramon-fat-sand-rat.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add licensed optimized Ramon geological and wildlife photos'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
