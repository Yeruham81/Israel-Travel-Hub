name: Create right-sized home hero images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-hero-sizes.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet --user Pillow
      - name: Produce responsive WebP images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          for src in sorted(Path("src/assets/home").glob("hero-*.webp")):
              if src.name.endswith("-sm.webp") or src.stem.endswith(("-medium", "-large")):
                  continue
              with Image.open(src) as image:
                  im = ImageOps.exif_transpose(image).convert("RGB")
                  for width, label, quality in [(1440, "medium", 69), (1920, "large", 70)]:
                      target = src.with_name(f"{src.stem}-{label}.webp")
                      resized = im.copy()
                      resized.thumbnail((width, 1100), Image.Resampling.LANCZOS)
                      resized.save(target, "WEBP", quality=quality, method=6)
                      print(f"{src.name} {im.size} {src.stat().st_size} -> {target.name} {resized.size} {target.stat().st_size}")
          PY
      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/home/hero-*-medium.webp src/assets/home/hero-*-large.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add responsive compressed variants for homepage hero slides'
            git push origin HEAD:main
          fi
