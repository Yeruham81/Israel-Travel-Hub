name: Standalone build migration baseline
on:
  push:
    branches: [audit/standalone-build-baseline]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6dfaaea48d48d4bdd9f6b51381cf128020cf4b7e
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bash scripts/install-ci-dependencies.sh
      - name: Inspect public build configuration only
        run: |
          node --input-type=module <<'JS'
          import { loadConfigFromFile, resolveConfig } from 'vite';
          for (const command of ['serve','build']) {
            const mode = command === 'build' ? 'production' : 'development';
            const loaded = await loadConfigFromFile({command,mode}, 'vite.config.ts');
            const c = loaded.config;
            const p = await Promise.all(c.plugins.flat(Infinity));
            console.log('BASE_CONFIG', JSON.stringify({command,plugins:p.flat(Infinity).filter(Boolean).map(x=>x.name),resolve:c.resolve,server:c.server,preview:c.preview,build:c.build,css:c.css,ssr:c.ssr,envPrefix:c.envPrefix,defineKeys:Object.keys(c.define||{}),optimizeDeps:c.optimizeDeps},null,2));
          }
          JS
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('node_modules/@lovable.dev/vite-tanstack-config')
          for f in root.rglob('*'):
              if f.is_file() and f.suffix in ('.js','.mjs','.cjs','.ts') and '.map' not in f.name:
                  lines=f.read_text(errors='replace').splitlines()
                  if len(lines)<10 and len(''.join(lines))>5000: continue
                  selected=set()
                  for i,line in enumerate(lines):
                      if re.search(r'cloudflare|nitro\(|tanstackStart\(|viteReact\(|tsconfigPaths\(|dedupe|cssMinify|lightningcss|optimizeDeps|allowedHosts|envPrefix|defineConfig\(',line,re.I):
                          selected.update(range(max(0,i-3),min(len(lines),i+5)))
                  if selected:
                      print('WRAPPER_FILE',f)
                      for i in sorted(selected)[:220]: print(f'{i+1}: {lines[i][:400]}')
          PY
      - name: Generate exact lockfile delta in disposable checkout
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          delete p.devDependencies['@lovable.dev/vite-tanstack-config'];
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          bun install --lockfile-only
          git diff --numstat -- bun.lock
          git diff -- bun.lock
          bun install --frozen-lockfile
