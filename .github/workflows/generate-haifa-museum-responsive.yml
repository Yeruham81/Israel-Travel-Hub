name: Generate local responsive Haifa museum card images
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-haifa-museum-responsive.yml"
permissions:
  contents: write
concurrency:
  group: haifa-museum-responsive
  cancel-in-progress: false
jobs:
  generate:
    if: contains(github.event.head_commit.message, '[generate-haifa-museum-responsive]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate twenty smaller loss-aware WebP variants without upscaling
        run: |
          python -m pip install --quiet --disable-pip-version-check Pillow
          python scripts/generate-haifa-museum-responsive.py
      - name: Commit optimized width-specific images back to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/haifa-museums/*-360.webp public/images/haifa-museums/*-560.webp
          if git diff --cached --quiet; then echo "All image variants are current"; exit 0; fi
          git commit -m "Add twenty local responsive Haifa museum WebP images"
          git pull --rebase origin main
          git push origin HEAD:main
