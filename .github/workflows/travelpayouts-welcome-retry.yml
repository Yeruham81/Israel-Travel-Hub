name: Validate Welcome Pickups affiliate fallback
on:
  push:
    branches: [main]
    paths:
      - 'scripts/travelpayouts/retry-airport-welcome.mjs'
      - '.github/workflows/travelpayouts-welcome-retry.yml'
permissions:
  contents: write
jobs:
  check:
    if: contains(github.event.head_commit.message, '[retry-airport-welcome]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check official Welcome Pickups URLs and generate links if supported
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/retry-airport-welcome.mjs
      - name: Commit only successful Welcome tracking links
        run: |
          if git diff --quiet -- src/data/registry.ts; then
            echo "No verified new Welcome affiliate links"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/registry.ts
            git commit -m "Add verified Welcome Pickups partner links where supported"
            git push origin HEAD:main
          fi
