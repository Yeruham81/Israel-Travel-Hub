name: Validate Welcome Pickups affiliate fallback
# Explicit operator action only; source formatting must never call the partner API.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Check official Welcome Pickups URLs and generate links if supported
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/retry-airport-welcome.mjs
      - name: Commit only successful Welcome tracking links
        run: |
          if git diff --quiet -- src/data/registry.ts; then
            echo "No verified new Welcome affiliate links"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/registry.ts
            git commit -m "Add verified Welcome Pickups partner links where supported"
            git push origin HEAD:main
          fi
