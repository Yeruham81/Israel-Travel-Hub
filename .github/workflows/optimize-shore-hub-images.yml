name: Optimize shore excursions hub images

on:
  push:
    branches: [main]
    paths:
      - "scripts/optimize_shore_hub_images.py"
      - ".github/workflows/optimize-shore-hub-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: optimize-shore-hub-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Resize only oversized shore hub photos
        run: python scripts/optimize_shore_hub_images.py
      - name: Verify that assets are decodable and originals are preserved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('docs/SHORE_HUB_IMAGE_DELIVERY_REPORT.json')
          report=json.loads(p.read_text())
          assert report['originalsPreserved']
          assert len(report['files']) == 13
          assert report['createdVariants'] == 8
          assert report['savedBytes'] > 450000
          for f in report['files']:
              with Image.open(f['source']) as orig, Image.open(f['served']) as served:
                  assert served.format == 'WEBP'
                  assert served.width <= orig.width
                  assert served.height <= orig.height
                  assert f['servedBytes'] <= f['sourceBytes']
          print('Shore hub source-to-thumbnail reduction:', report['savedBytes'], 'bytes')
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bash scripts/install-ci-dependencies.sh
      - name: Build and generate the route tree
        run: bun run build
      - name: Run shore hub regression tests
        run: bun x vitest run src/test/shore-hub.test.tsx src/test/shore-hub-layout.test.ts src/test/shore-excursions.test.tsx
      - name: Check TypeScript
        run: bun x tsc --noEmit
      - name: Commit verified source and image changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/shore-hub/*.webp \
            src/routes/shore-excursions.index.tsx \
            src/test/shore-hub.test.tsx \
            docs/SHORE_HUB_IMAGE_DELIVERY_REPORT.json
          if git diff --cached --quiet; then
            echo "Shore hub images already optimized"
          else
            git commit -m "Serve optimized WebP thumbnails across shore excursions hub"
            # The production build may regenerate tracked files unrelated to
            # imagery; exclude them from this precise hub-only commit.
            git reset --hard HEAD
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Verified shore hub improvements committed to main"
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                echo "::error::Unable to safely push the verified image changes"
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Validate final main before Hostinger publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run full-project-validation.yml --ref main
