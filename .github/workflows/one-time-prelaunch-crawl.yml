name: Stage 5 JavaScript dependency and preload diagnosis
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-time-prelaunch-crawl.yml']
permissions:
  contents: read
jobs:
  graph:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      HOSTINGER_STATIC_BUILD: "true"
      VITE_CANONICAL_ORIGIN: https://saddlebrown-guanaco-454061.hostingersite.com
      VITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4ca68799155af3e05c8d6b7b6cec308d8945fc9f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Instrument Vite bundle locally without modifying main
        run: |
          mkdir -p stage5-js-audit
          cat > stage5-audit-plugin.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import {gzipSync} from "node:zlib";
          export function stage5AuditPlugin(){
            let config;
            return {name:"stage5-audit-graph",apply:"build",configResolved(c){config=c;},
              generateBundle(options,bundle){
                const chunks=Object.values(bundle).filter(x=>x.type==="chunk").map(c=>({file:c.fileName,name:c.name,entry:c.isEntry,dynamicEntry:c.isDynamicEntry,facade:c.facadeModuleId,imports:c.imports,dynamicImports:c.dynamicImports,bytes:Buffer.byteLength(c.code),gzip:gzipSync(c.code).length,modules:Object.entries(c.modules).map(([id,m])=>({id:id.replace(process.cwd()+"/",""),rendered:m.renderedLength,original:m.originalLength,imports:this.getModuleInfo(id)?.importedIds.map(x=>x.replace(process.cwd()+"/","")),dynamic:this.getModuleInfo(id)?.dynamicallyImportedIds.map(x=>x.replace(process.cwd()+"/",""))}))}));
                const label=String(config.build?.ssr?"ssr":"client")+"-"+String(config.environments?Object.keys(config.environments).join("-"):"vite");
                fs.writeFileSync(path.join(process.cwd(),"stage5-js-audit",label+"-"+Date.now()+".json"),JSON.stringify({label,outDir:config.build.outDir,options:{format:options.format,dir:options.dir},chunks},null,2));
                console.log("BUNDLE_GRAPH",label,chunks.length,chunks.reduce((s,x)=>s+x.bytes,0));
              }};
          }
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path("vite.config.ts");s=p.read_text()
          old='export default defineConfig({'
          assert s.count(old)==1
          p.write_text(s.replace(old,'import { stage5AuditPlugin } from "./stage5-audit-plugin.mjs";\n\n'+old+'\n  vite: { plugins: [stage5AuditPlugin()] },'))
          PY
      - run: bash scripts/build-validated-static.sh
      - name: Map physical chunks and preload references for all six routes
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import {gzipSync} from "node:zlib";
          const dir="stage5-js-audit",root=".output/public";
          const graphs=fs.readdirSync(dir).filter(f=>f.endsWith(".json")).map(f=>JSON.parse(fs.readFileSync(dir+"/"+f)));
          const client=graphs.sort((a,b)=>b.chunks.filter(x=>fs.existsSync(root+"/"+x.file)).length-a.chunks.filter(x=>fs.existsSync(root+"/"+x.file)).length)[0];
          if(!client||!client.chunks.some(x=>fs.existsSync(root+"/"+x.file)))throw Error("Client graph not found");
          const map=new Map(client.chunks.map(x=>[x.file,x]));
          const visit=(start)=>{const seen=new Set(),stack=[...start];while(stack.length){const k=stack.pop();if(seen.has(k)||!map.has(k))continue;seen.add(k);stack.push(...map.get(k).imports);}return seen;};
          const paths=["/","/airport-transfers/","/travel-blog/","/tours/golan-heights/","/accommodation/","/attractions/old-city-jerusalem/"];
          const rows=[];
          for(const p of paths){
            const html=fs.readFileSync(root+p+"index.html","utf8");
            const links=[...html.matchAll(/<link\b[^>]*>/g)].map(x=>x[0]),scripts=[...html.matchAll(/<script\b[^>]*>/g)].map(x=>x[0]);
            const href=t=>t.match(/(?:href|src)="([^"]+)"/)?.[1]?.replace(/^\//,"");
            const preloads=links.filter(t=>/rel="modulepreload"/.test(t)).map(href).filter(Boolean);
            const entry=scripts.filter(t=>/type="module"/.test(t)).map(href).filter(Boolean);
            const imports=[...html.matchAll(/\bimport\s*(?:\(\s*)?["'](\/assets\/[^"']+\.js)["']/g)].map(x=>x[1].slice(1));
            const reach=visit([...entry,...imports]);
            const preReach=visit(preloads);
            const sum=set=>[...set].reduce((n,x)=>n+(map.get(x)?.gzip||0),0);
            const row={path:p,entry,inlineImports:imports,preloads:preloads.length,preloadBytes:sum(preReach),staticClosure:reach.size,staticGzip:sum(reach),onlyPreload:[...preReach].filter(x=>!reach.has(x)).length,preloadFiles:preloads};
            rows.push(row);console.log("HTML_GRAPH",JSON.stringify({...row,preloadFiles:preloads.slice(0,10)}));
          }
          const largest=client.chunks.filter(x=>fs.existsSync(root+"/"+x.file)).sort((a,b)=>b.gzip-a.gzip).slice(0,15).map(x=>({file:x.file,bytes:x.bytes,gzip:x.gzip,imports:x.imports,modules:x.modules.sort((a,b)=>b.rendered-a.rendered).slice(0,15).map(m=>({id:m.id,rendered:m.rendered}))}));
          const report={client:client.label,rows,largest};fs.writeFileSync(dir+"/graph-summary.json",JSON.stringify(report,null,2));
          for(const x of largest)console.log("LARGE_CHUNK",JSON.stringify(x));
          JS
      - name: Install audit browser
        run: |
          npm install --prefix /tmp/stage5fix --no-save playwright@1.56.1 lighthouse@12.8.2
          /tmp/stage5fix/node_modules/.bin/playwright install --with-deps chromium
      - name: Start compressed static preview
        run: |
          cat > /tmp/stage5-server.py <<'PY'
          import gzip, http.server, os, mimetypes
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if urlsplit(self.path).path=="/api/exchange-rates/":
                      body=b'{"rates":null,"status":"unavailable"}'
                      self.send_response(200);self.send_header("Content-Type","application/json");self.send_header("Content-Length",str(len(body)));self.end_headers();self.wfile.write(body);return
                  return super().do_GET()
              def send_head(self):
                  p=Path(self.translate_path(self.path))
                  if p.is_dir() and self.path.endswith("/"):p=p/"index.html"
                  if p.is_file() and p.suffix in (".html",".js",".css",".json",".svg",".xml",".txt") and "gzip" in self.headers.get("Accept-Encoding",""):
                      import io
                      data=gzip.compress(p.read_bytes(),compresslevel=6,mtime=0)
                      self.send_response(200);self.send_header("Content-Type",self.guess_type(str(p)));self.send_header("Content-Encoding","gzip");self.send_header("Vary","Accept-Encoding");self.send_header("Content-Length",str(len(data)));self.end_headers()
                      return io.BytesIO(data)
                  return super().send_head()
          os.chdir(".output/public")
          http.server.ThreadingHTTPServer(("127.0.0.1",4173),Handler).serve_forever()
          PY
          nohup python /tmp/stage5-server.py >/tmp/stage5-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Compare normal HTML and removal of modulepreload hints only
        run: |
          cat > /tmp/stage5fix/compare.cjs <<'JS'
          const {chromium}=require("playwright"),fs=require("fs"),zlib=require("zlib");
          const origin="http://127.0.0.1:4173",paths=["/","/airport-transfers/","/travel-blog/","/tours/golan-heights/","/accommodation/","/attractions/old-city-jerusalem/"];
          (async()=>{const browser=await chromium.launch();const all=[];
            try{
              for(const mode of ["normal","no-modulepreload","no-js"])for(const p of paths){
                const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,javaScriptEnabled:mode!=="no-js"});
                await ctx.route("**/*",async r=>{
                  const url=r.request().url();
                  if(!url.startsWith(origin+"/"))return r.abort();
                  if(mode==="no-modulepreload"&&r.request().isNavigationRequest()){
                    const res=await r.fetch();let html=await res.text();
                    const filtered=html.replace(/<link\b(?=[^>]*\brel=["']modulepreload["'])[^>]*>/gi,"");
                    return r.fulfill({status:res.status(),contentType:"text/html; charset=utf-8",body:filtered});
                  }
                  return r.continue();
                });
                const page=await ctx.newPage(),cdp=await ctx.newCDPSession(page),requests=new Map(),errors=[];
                await cdp.send("Network.enable");await cdp.send("Network.setCacheDisabled",{cacheDisabled:true});
                cdp.on("Network.requestWillBeSent",e=>requests.set(e.requestId,{url:e.request.url,type:e.type,initiator:e.initiator.type,source:e.initiator.url||e.initiator.stack?.callFrames?.[0]?.url,priority:e.request.initialPriority,time:e.timestamp}));
                cdp.on("Network.loadingFinished",e=>{const r=requests.get(e.requestId);if(r)r.transferred=e.encodedDataLength});
                page.on("pageerror",e=>errors.push(e.message));
                try{
                  await page.goto(origin+p,{waitUntil:"load",timeout:45000});
                  await page.waitForTimeout(600);
                  const dom=await page.evaluate(()=>({title:document.title,h1:document.querySelector("h1")?.textContent,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,preloads:document.querySelectorAll('link[rel="modulepreload"]').length,paint:performance.getEntriesByType("paint").map(x=>({name:x.name,time:x.startTime}))}));
                  const scripts=[...requests.values()].filter(r=>r.type==="Script"&&r.url.startsWith(origin));
                  const row={mode,path:p,dom,errors,scriptCount:scripts.length,scriptBytes:scripts.reduce((s,x)=>s+(x.transferred||0),0),scripts:scripts.map(x=>({...x,url:x.url.replace(origin,""),source:x.source?.replace(origin,"")}))};all.push(row);console.log("PRELOAD_EXPERIMENT",JSON.stringify({...row,scripts:row.scripts.slice(0,5)}));
                }catch(e){all.push({mode,path:p,error:String(e)});console.log("PRELOAD_ERROR",mode,p,String(e));}finally{await ctx.close();}
              }
            }finally{await browser.close();fs.writeFileSync("stage5-js-audit/browser-comparison.json",JSON.stringify(all,null,2));}
            if(all.length!==18||all.some(x=>x.error||x.errors?.length))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/stage5fix/compare.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-js-audit
          path: stage5-js-audit/
          if-no-files-found: error
