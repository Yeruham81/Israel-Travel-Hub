name: Stage 4 - verify corrected Tel Aviv hotel link
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-time-prelaunch-crawl.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      HOSTINGER_STATIC_BUILD: "true"
      VITE_CANONICAL_ORIGIN: https://saddlebrown-guanaco-454061.hostingersite.com
      VITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a54457eaa109e1195d8a12417027f12b11ace05d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Confirm exact newly generated destination with one clickout
        run: |
          node --input-type=module <<'JS'
          let current="https://booking.tpk.lv/uFvoGvgK";
          for(let i=0;i<6;i++){
            const u=new URL(current);
            if(u.protocol!=="https:"||u.username||u.password)throw Error("Unexpected redirect protocol");
            if(u.hostname==="booking.com"||u.hostname.endsWith(".booking.com")){
              if(u.pathname!=="/city/il/tel-aviv.html")throw Error("Wrong destination: "+u.pathname);
              console.log("BOOKING_REDIRECT_VERIFIED",u.origin+u.pathname);process.exit(0);
            }
            const response=await fetch(current,{redirect:"manual",headers:{"User-Agent":"Mozilla/5.0 (compatible; IsraelTravelHubQA/1.0)"},signal:AbortSignal.timeout(12000)});
            const location=response.headers.get("location");
            await response.body?.cancel();
            if(response.status<300||response.status>=400||!location)throw Error("Redirect unconfirmed: HTTP "+response.status);
            current=new URL(location,u).href;
          }
          throw Error("Redirect chain limit");
          JS
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Regression test exact supplier mapping
        run: bunx --no-install vitest run src/test/seven-travelpayouts-links.test.tsx
      - run: bash scripts/build-validated-static.sh
      - name: Check rendered button and preserved sponsored attributes
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import {JSDOM} from "jsdom";
          const dom=new JSDOM(fs.readFileSync(".output/public/accommodation/tel-aviv/index.html","utf8"));
          const d=dom.window.document;
          const links=[...d.querySelectorAll("a[href]")].filter(a=>a.textContent.includes("Browse more on Booking.com"));
          assert.equal(links.length,1);
          const link=links[0];assert.equal(link.getAttribute("href"),"https://booking.tpk.lv/uFvoGvgK");
          assert(link.rel.split(/\s+/).includes("sponsored"));
          assert.equal(link.target,"_blank");
          console.log("BOOKING_CTA_VERIFIED",JSON.stringify({href:link.getAttribute("href"),rel:link.rel,target:link.target}));
          dom.window.close();
          JS
