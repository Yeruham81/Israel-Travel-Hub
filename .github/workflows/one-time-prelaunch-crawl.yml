name: One-time prelaunch security and server checks
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-time-prelaunch-crawl.yml']
permissions:
  contents: read
concurrency:
  group: one-time-prelaunch-crawl
  cancel-in-progress: true
jobs:
  public-server:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ORIGIN: https://saddlebrown-guanaco-454061.hostingersite.com
    steps:
      - name: Verify the deployed food anchor; persist each result
        run: |
          python3 -u - <<'PY'
          import subprocess, tempfile, os, json, time, re, pathlib
          from urllib.parse import urlsplit
          origin=os.environ['ORIGIN']
          results={}; findings=[]
          def save():
              pathlib.Path('server-security-audit.json').write_text(json.dumps({'results':results,'findings':findings},indent=2))
          save()
          allow={'strict-transport-security','content-security-policy','content-security-policy-report-only','x-content-type-options','x-frame-options','referrer-policy','permissions-policy','cache-control','x-robots-tag','access-control-allow-origin','access-control-allow-credentials'}
          def probe(key,path,method='GET',extra=None,base=origin,body=False):
              for attempt in range(2):
                  time.sleep(2)
                  with tempfile.TemporaryDirectory() as tmp:
                      hdr=tmp+'/headers'; data=tmp+'/body'
                      cmd=['curl','--silent','--show-error','--connect-timeout','5','--max-time','10','--max-filesize','2000000','--user-agent','IsraelTravelHub-PrelaunchAudit/1.0','-D',hdr,'-o',data,'-w','%{http_code} %{ssl_verify_result}',base+path]
                      if method=='HEAD':cmd+=['--head']
                      if extra:cmd+=['-H',extra]
                      try:
                          p=subprocess.run(cmd,capture_output=True,text=True,timeout=13)
                          fields=p.stdout.strip().split()
                          status=int(fields[0]) if fields and fields[0].isdigit() else None
                          h={}
                          if os.path.exists(hdr):
                              for line in pathlib.Path(hdr).read_text(errors='replace').splitlines():
                                  if ':' in line:
                                      k,v=line.split(':',1);h[k.lower()]=v.strip()
                          if status==429:
                              findings.append({'type':'rate_limit','probe':key,'attempt':attempt+1});save()
                              delay=h.get('retry-after','')
                              if attempt==0 and (not delay.isdigit() or int(delay)<=60):
                                  time.sleep(max(35,int(delay)) if delay.isdigit() else 35);continue
                              raise RuntimeError('Persistent rate limit; stopped')
                          r={'status':status,'curlExit':p.returncode,'sslVerifyResult':fields[1] if len(fields)>1 else None,'contentType':h.get('content-type'),'headers':{k:v for k,v in h.items() if k in allow}}
                          if key=='http_redirect':r['httpsDestination']=h.get('location','').startswith(origin+'/') or h.get('location')==origin
                          raw=pathlib.Path(data).read_bytes() if body and os.path.exists(data) and status==200 else b''
                          if key=='food':
                              r['fixedAnchor']=bool(re.search(rb'href=["\x27]#knafeh["\x27]',raw)) and bool(re.search(rb'id=["\x27]knafeh["\x27]',raw)) and not bool(re.search(rb'href=["\x27]#kanafeh["\x27]',raw))
                          if key in ('quote','exchange'):
                              try:
                                  x=json.loads(raw)
                                  r['jsonKeys']=sorted(x.keys())
                                  if key=='quote':r['available']=x.get('available') is True
                                  else:r['exchangeStatus']=x.get('status') if x.get('status') in ('fresh','cached','unavailable') else 'unexpected'
                              except Exception:r['validJson']=False
                          results[key]=r;save()
                          print(key,json.dumps(r),flush=True)
                          return
                      except subprocess.TimeoutExpired:
                          results[key]={'timeout':True};save();print(key,'timeout',flush=True);return
          try:
              probe('home','/')
              probe('food','/travel-blog/what-to-eat-in-israel/',body=True)
          except RuntimeError as e:findings.append({'type':'stopped','reason':str(e)})
          finally:
              save()
              print('PUBLIC_FINAL',json.dumps({'results':results,'findings':findings}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-public-security-audit
          path: server-security-audit.json
          if-no-files-found: warn
  dependency-candidate:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      HOSTINGER_STATIC_BUILD: "true"
      VITE_CANONICAL_ORIGIN: https://saddlebrown-guanaco-454061.hostingersite.com
      VITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70057ff31529a9ade04f06b81c5e03f2a4889d18
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Prepare narrow dependency update candidate
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies.zod='4.6.6';
          p.devDependencies.vitest='4.1.12';
          p.overrides={...p.overrides,zod:'4.6.6',seroval:'1.6.11','seroval-plugins':'1.6.11','brace-expansion@1.1.20':'1.1.21','brace-expansion@5.0.11':'5.0.12','minimatch@10.2.6':'11.0.1'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          bun install
          bun install --frozen-lockfile
          git diff --stat -- package.json bun.lock
          mkdir -p /tmp/dependency-candidate
          cp package.json bun.lock /tmp/dependency-candidate/
          git diff -- package.json bun.lock > /tmp/dependency-candidate/candidate.patch
          set +e
          bun audit --json > /tmp/dependency-candidate/dependency-audit.json 2> /tmp/dependency-candidate/dependency-audit.stderr
          code=$?
          set -e
          echo "CANDIDATE_AUDIT_EXIT=$code"
          cat /tmp/dependency-candidate/dependency-audit.json
          bun pm ls --all | grep -E 'zod@|seroval@|vitest@|mocker@|brace-expansion@|minimatch@' || true
          printf '%s\n' "$code" > /tmp/dependency-candidate/audit-exit.txt
      - name: Build for generated route types
        run: bun run build
      - name: TypeScript compatibility
        run: bunx --no-install tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Sanity adapter tests
        run: node --test scripts/sanity/uber-adapter.test.mjs
      - name: Static build and verification
        run: |
          bash scripts/build-validated-static.sh
          node scripts/verify-hostinger-static-export.mjs
      - name: Require zero reported dependency vulnerabilities
        run: test "$(cat /tmp/dependency-candidate/audit-exit.txt)" = 0
      - name: Save candidate files even if compatibility fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update-candidate
          path: /tmp/dependency-candidate/
          if-no-files-found: warn

  baseline:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      VITE_CANONICAL_ORIGIN: https://saddlebrown-guanaco-454061.hostingersite.com
      VITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70057ff31529a9ade04f06b81c5e03f2a4889d18
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install unchanged locked dependencies
        run: bash scripts/install-ci-dependencies.sh
      - name: Build for generated route types
        run: bun run build
      - name: TypeScript compatibility
        run: bunx --no-install tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Sanity adapter tests
        run: node --test scripts/sanity/uber-adapter.test.mjs
      - name: Verify baseline static build and corrected anchor
        env:
          HOSTINGER_STATIC_BUILD: "true"
        run: |
          bash scripts/build-validated-static.sh
          node scripts/verify-hostinger-static-export.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('.output/public/travel-blog/what-to-eat-in-israel/index.html').read_text()
          assert re.search(r'href=["\x27]#knafeh["\x27]',html)
          assert re.search(r'id=["\x27]knafeh["\x27]',html)
          assert not re.search(r'href=["\x27]#kanafeh["\x27]',html)
          print('KNAFEH_ANCHOR_BUILD_OK')
          PY
