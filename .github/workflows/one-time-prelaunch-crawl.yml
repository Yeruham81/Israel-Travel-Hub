name: SEO follow-up - structured data and robots
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-time-prelaunch-crawl.yml']
permissions:
  contents: read
jobs:
  production:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      HOSTINGER_STATIC_BUILD: "true"
      VITE_CANONICAL_ORIGIN: https://www.israel-taxi.com
      VITE_INDEXABLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f969591f2c2cd3b905faec8da8559088fd2452e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/install-ci-dependencies.sh
      - run: bash scripts/build-validated-static.sh
      - run: node scripts/verify-hostinger-static-export.mjs
  robots-live:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ORIGIN: https://saddlebrown-guanaco-454061.hostingersite.com
    steps:
      - name: Compare live robots responses and sample schema
        run: |
          python3 -u - <<'PY'
          import subprocess,os,tempfile,pathlib,json,re,time
          from html.parser import HTMLParser
          origin=os.environ['ORIGIN']
          result={}
          def get(key,p,extra=[]):
              time.sleep(2)
              with tempfile.TemporaryDirectory() as t:
                  h=pathlib.Path(t)/'h'; b=pathlib.Path(t)/'b'
                  cmd=['curl','-sS','--connect-timeout','5','--max-time','12','--max-filesize','2000000','-A','IsraelTravelHub-PrelaunchAudit/1.0','-D',str(h),'-o',str(b),'-w','%{http_code}',*extra,origin+p]
                  r=subprocess.run(cmd,capture_output=True,text=True,timeout=16)
                  headers={}
                  if h.exists():
                      for x in h.read_text(errors='replace').splitlines():
                          if ':' in x:
                              k,v=x.split(':',1)
                              if k.lower() in ('cache-control','age','x-litespeed-cache','x-qc-cache','x-robots-tag','content-type','via','cf-cache-status'):headers[k.lower()]=v.strip()
                  body=b.read_text(errors='replace') if b.exists() else ''
                  result[key]={'status':r.stdout,'exit':r.returncode,'headers':headers}
                  if key.startswith('robots'):
                      result[key]['body']=body[:4000]
                      result[key]['sitemapCorrect']=('Sitemap: '+origin+'/sitemap.xml') in body
                  else:
                      types=[]
                      for block in re.findall(r'<script\b[^>]*type="application/ld\+json"[^>]*>(.*?)</script>',body,re.S|re.I):
                          try:
                              obj=json.loads(block)
                              for node in obj.get('@graph',[obj]):types.append(node.get('@type'))
                          except Exception:types.append('INVALID_JSON')
                      result[key]['schemaTypes']=types
                  print(key,json.dumps(result[key]),flush=True)
                  pathlib.Path('seo-followup.json').write_text(json.dumps(result,indent=2))
                  if r.stdout=='429':raise SystemExit('Rate limited; no further requests')
          get('robots_normal','/robots.txt')
          get('robots_revalidate','/robots.txt',['-H','Cache-Control: no-cache','-H','Pragma: no-cache'])
          get('robots_query','/robots.txt?seo-audit=20261124',['-H','Cache-Control: no-cache'])
          get('home','/')
          get('about','/about-me/')
          print('SEO_FOLLOWUP',json.dumps(result),flush=True)
          if not result['robots_normal']['sitemapCorrect']:raise SystemExit('Live robots sitemap reference differs')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-followup
          path: seo-followup.json
