      - name: Full regression suite for experimental code
        id: regression
        run: bun run test
        continue-on-error: true
      - name: Install audit browser
        run: |
          npm install --prefix /tmp/stage5fix --no-save playwright@1.56.1 lighthouse@12.8.2
          /tmp/stage5fix/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare initial requests on baseline and experiment in same runner
        run: |
          cat > /tmp/stage5-compare-server.py <<'PY'
          import gzip,http.server,os,io
          from pathlib import Path
          from urllib.parse import urlsplit
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if urlsplit(self.path).path=="/api/exchange-rates/":
                      body=b'{"rates":null,"status":"unavailable"}';self.send_response(200);self.send_header("Content-Type","application/json");self.send_header("Content-Length",str(len(body)));self.end_headers();self.wfile.write(body);return
                  return super().do_GET()
              def send_head(self):
                  p=Path(self.translate_path(self.path))
                  if p.is_dir() and self.path.endswith("/"):p=p/"index.html"
                  if p.is_file() and p.suffix in (".html",".js",".css",".json",".svg",".xml",".txt") and "gzip" in self.headers.get("Accept-Encoding",""):
                      data=gzip.compress(p.read_bytes(),compresslevel=6,mtime=0);self.send_response(200);self.send_header("Content-Type",self.guess_type(str(p)));self.send_header("Content-Encoding","gzip");self.send_header("Content-Length",str(len(data)));self.end_headers();return io.BytesIO(data)
                  return super().send_head()
          os.chdir(os.environ["STATIC_ROOT"])
          http.server.ThreadingHTTPServer(("127.0.0.1",int(os.environ["PORT"])),Handler).serve_forever()
          PY
          STATIC_ROOT=/tmp/stage5-baseline-public PORT=4173 nohup python /tmp/stage5-compare-server.py >/tmp/stage5-base.log 2>&1 &
          STATIC_ROOT=.output/public PORT=4174 nohup python /tmp/stage5-compare-server.py >/tmp/stage5-exp.log 2>&1 &
          for p in 4173 4174; do for i in $(seq 1 20); do curl -fsS http://127.0.0.1:$p/ >/dev/null && break; sleep 1; done; done
          cat > /tmp/stage5fix/compare.cjs <<'JS'
          const {chromium}=require("playwright"),fs=require("fs");
          const paths=["/","/airport-transfers/","/travel-blog/","/tours/golan-heights/","/accommodation/","/attractions/old-city-jerusalem/"];
          (async()=>{const browser=await chromium.launch(),rows=[];
            try{for(const p of paths)for(const [mode,port] of [["baseline",4173],["experiment",4174]]){
              const origin="http://127.0.0.1:"+port;
              const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
              await ctx.route("**/*",r=>r.request().url().startsWith(origin+"/")?r.continue():r.abort());
              const page=await ctx.newPage(),cdp=await ctx.newCDPSession(page),requests=new Map(),errors=[];
              await cdp.send("Network.enable");await cdp.send("Network.setCacheDisabled",{cacheDisabled:true});
              cdp.on("Network.requestWillBeSent",e=>requests.set(e.requestId,{url:e.request.url,type:e.type}));
              cdp.on("Network.loadingFinished",e=>{const q=requests.get(e.requestId);if(q)q.bytes=e.encodedDataLength;});
              page.on("pageerror",e=>errors.push(e.message));
              try{await page.goto(origin+p,{waitUntil:"load",timeout:45000});await page.waitForTimeout(1000);
                const dom=await page.evaluate(()=>({title:document.title,h1:document.querySelector("h1")?.textContent,canonical:document.querySelector('link[rel=canonical]')?.href,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
                const scripts=[...requests.values()].filter(x=>x.type==="Script"&&x.url.startsWith(origin));
                const row={mode,path:p,dom,errors,scripts:scripts.length,bytes:scripts.reduce((s,x)=>s+(x.bytes||0),0)};rows.push(row);console.log("SPLIT_BROWSER",JSON.stringify(row));
              }catch(e){rows.push({mode,path:p,error:String(e)});}finally{await ctx.close();}
            }}finally{await browser.close();fs.writeFileSync("stage5-js-audit/split-browser.json",JSON.stringify(rows,null,2));}
            if(rows.length!==12||rows.some(x=>x.error||x.errors?.length||x.dom?.overflow>3))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/stage5fix/compare.cjs
      - name: Compare mobile Lighthouse baseline and experiment on same runner
        id: lighthouse
        run: |
          # Start both local previews again; previous step processes may have exited.
          for p in 4173 4174; do
            if ! curl -fsS http://127.0.0.1:$p/ >/dev/null; then
              if [ "$p" = 4173 ]; then root=/tmp/stage5-baseline-public; else root=.output/public; fi
              STATIC_ROOT="$root" PORT="$p" nohup python /tmp/stage5-compare-server.py >/tmp/stage5-lh-$p.log 2>&1 &
            fi
          done
          for p in 4173 4174; do for i in $(seq 1 20); do curl -fsS http://127.0.0.1:$p/ >/dev/null && break; sleep 1; done; done
          mkdir -p stage5-js-audit/lighthouse
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import {spawnSync} from "node:child_process";
          const paths=["/","/airport-transfers/","/travel-blog/","/tours/golan-heights/","/accommodation/","/attractions/old-city-jerusalem/"];
          const rows=[];
          for(const [i,p] of paths.entries()){
            const order=i%2===0?[["baseline",4173],["experiment",4174]]:[["experiment",4174],["baseline",4173]];
            for(const [mode,port] of order){
              const url="http://127.0.0.1:"+port+p;
              const file="stage5-js-audit/lighthouse/"+mode+"-"+i+".json";
              const r=spawnSync("/tmp/stage5fix/node_modules/.bin/lighthouse",[url,"--only-categories=performance,accessibility","--output=json","--output-path="+file,"--chrome-flags=--headless --no-sandbox --disable-dev-shm-usage","--max-wait-for-load=35000","--quiet"],{encoding:"utf8",timeout:125000,maxBuffer:2*1024*1024});
              let row;
              try{
                const a=JSON.parse(fs.readFileSync(file,"utf8")),u=a.audits;
                if(a.runtimeError)throw Error(a.runtimeError.message);
                const net=u["network-requests"].details.items,doc=net.find(n=>n.resourceType==="Document"&&n.url===url);
                if(!doc||doc.statusCode!==200)throw Error("Document not verified");
                row={mode,path:p,performance:Math.round(a.categories.performance.score*100),accessibility:Math.round(a.categories.accessibility.score*100),lcp:u["largest-contentful-paint"].numericValue,fcp:u["first-contentful-paint"].numericValue,cls:u["cumulative-layout-shift"].numericValue,tbt:u["total-blocking-time"].numericValue,bytes:u["total-byte-weight"].numericValue,scripts:net.filter(n=>n.resourceType==="Script").length,scriptBytes:net.filter(n=>n.resourceType==="Script").reduce((s,n)=>s+(n.transferSize||0),0),benchmark:a.environment.benchmarkIndex};
              }catch(e){row={mode,path:p,error:String(e),exit:r.status};}
              rows.push(row);console.log("SPLIT_LIGHTHOUSE",JSON.stringify(row));
            }
          }
          fs.writeFileSync("stage5-js-audit/lighthouse-summary.json",JSON.stringify(rows,null,2));
          if(rows.length!==12||rows.some(x=>x.error))process.exitCode=1;
          JS
      - name: Verify client navigation updates route metadata and keeps interactive content
        id: navigation
        run: |
          for p in 4173 4174; do
            if ! curl -fsS http://127.0.0.1:$p/ >/dev/null; then
              if [ "$p" = 4173 ]; then root=/tmp/stage5-baseline-public; else root=.output/public; fi
              STATIC_ROOT="$root" PORT="$p" nohup python /tmp/stage5-compare-server.py >/tmp/stage5-nav-$p.log 2>&1 &
            fi
          done
          cat > /tmp/stage5fix/navigation.cjs <<'JS'
          const {chromium}=require("playwright"),fs=require("fs");
          const paths=["/airport-transfers/","/travel-blog/","/travel-blog/israel-itinerary-3-days/","/travel-blog/israel-itinerary-5-days/","/travel-blog/israel-itinerary-7-days/","/travel-blog/israel-itinerary-10-days/","/accommodation/","/"];
          (async()=>{const browser=await chromium.launch(),rows=[];
            try{
              for(const [mode,port] of [["baseline",4173],["experiment",4174]]){
                const origin="http://127.0.0.1:"+port;
                const ctx=await browser.newContext({viewport:{width:1365,height:900}});
                await ctx.route("**/*",r=>r.request().url().startsWith(origin+"/")?r.continue():r.abort());
                const page=await ctx.newPage(),errors=[];
                page.on("pageerror",e=>errors.push(e.message));
                await page.goto(origin+"/",{waitUntil:"networkidle"});
                for(const target of paths){
                  const expected=await ctx.request.get(origin+target);
                  if(expected.status()!==200)throw Error("Expected document unavailable "+target);
                  await expected.body();
                  const canonical="https://saddlebrown-guanaco-454061.hostingersite.com"+target;
                  // Use an actual internal anchor if visible; otherwise exercise an existing
                  // anchor in the navigation by DOM click without modifying router internals.
                  const links=page.locator('a[href="'+target+'"]');
                  if(!await links.count()){await page.goto(origin+"/travel-blog/",{waitUntil:"networkidle"});}
                  if(!await links.count()){await page.goto(origin+"/",{waitUntil:"networkidle"});}
                  if(!await links.count())throw Error("No existing link to "+target+" from "+page.url());
                  const visible=links.filter({visible:true});
                  if(await visible.count())await visible.first().click({timeout:10000});
                  else await links.first().evaluate(el=>el.click());
                  await page.waitForURL(origin+target,{timeout:30000});
                  await page.waitForFunction(c=>document.querySelector('link[rel=canonical]')?.href===c,canonical,{timeout:30000});
                  const row=await page.evaluate(()=>({title:document.title,h1:document.querySelector("h1")?.textContent,canonical:document.querySelector('link[rel=canonical]')?.href,ld:[...document.querySelectorAll('script[type="application/ld+json"]')].map(el=>JSON.parse(el.textContent)),forms:document.querySelectorAll("form").length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
                  if(!row.title||!row.h1||row.overflow>3||errors.length)throw Error(JSON.stringify({mode,target,row,errors}));
                  rows.push({mode,target,...row});console.log("ROUTE_NAV",JSON.stringify({mode,target,title:row.title,canonical:row.canonical,h1:row.h1,forms:row.forms,schemas:row.ld.length}));
                }
                await ctx.close();
              }
              for(const p of paths){const a=rows.find(r=>r.mode==="baseline"&&r.target===p),b=rows.find(r=>r.mode==="experiment"&&r.target===p);for(const k of ["title","h1","canonical","ld","forms"])if(JSON.stringify(a?.[k])!==JSON.stringify(b?.[k]))throw Error("Navigation mismatch "+p+" "+k);}
            }finally{await browser.close();fs.writeFileSync("stage5-js-audit/navigation.json",JSON.stringify(rows,null,2));}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/stage5fix/navigation.cjs
      - name: Require HTML parity, TypeScript and full regression success
