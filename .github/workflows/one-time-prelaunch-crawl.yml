name: Stage 5 repeated controlled mobile Lighthouse measurements
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-time-prelaunch-crawl.yml']
permissions:
  contents: read
jobs:
  live-lighthouse-after:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --prefix /tmp/stage5live --no-save lighthouse@12.8.2
      - name: Verify merged release is public before measuring
        run: |
          python3 -u - <<'PY'
          import urllib.request,urllib.error,time,json,re
          origin="https://saddlebrown-guanaco-454061.hostingersite.com"
          checks=[
            ("/tours/golan-heights/",[r"/images/stage5-responsive/nimrod-fortress-132d143b45-384\.webp",r"/images/stage5-responsive/banias-waterfall-557cb95c29-384\.webp"]),
            ("/",[r"min-h-8 items-center gap-1\.5 py-1\.5",r"Read all Tripadvisor reviews"]),
            ("/travel-blog/israel-itinerary-10-days/",[r'mt-4 min-w-0 max-w-full overflow-x-auto',r'Southern ten-day alternative at a glance']),
            ("/accommodation/tel-aviv/",[r"booking\.tpk\.lv/uFvoGvgK",r"for Carlton Tel Aviv on Expedia"]),
          ]
          def get(p):
              req=urllib.request.Request(origin+p,headers={"User-Agent":"IsraelTravelHub-PrelaunchAudit/1.0","Cache-Control":"no-cache","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=15) as r:
                  return r.status,r.read()
          for attempt in range(21):
              try:
                  status,data=get(checks[0][0])
                  if status==200 and all(re.search(pattern,data.decode("utf-8")) for pattern in checks[0][1]):
                      print("New Golan responsive markup detected")
                      break
                  print("Release not yet visible",attempt+1,flush=True)
              except urllib.error.HTTPError as e:
                  if e.code==429:raise RuntimeError("Hostinger rate limit; stopping without further requests")
                  print("Readiness HTTP",e.code,flush=True)
              if attempt==20:raise RuntimeError("Merged release not confirmed; no Lighthouse comparison performed")
              time.sleep(30)
          report=[]
          for p,patterns in checks:
              status,data=get(p)
              # React SSR inserts HTML comments between adjacent dynamic text nodes.
              # Normalize only those comments, not the actual expected text.
              html=re.sub(r"<!--.*?-->", "", data.decode("utf-8"), flags=re.S)
              row={"path":p,"http":status,"markers":[bool(re.search(pattern,html)) for pattern in patterns],"noindex":bool(re.search(r'<meta[^>]+name="robots"[^>]+content="[^"]*noindex',html))}
              report.append(row)
              print("LIVE_RELEASE_CHECK",json.dumps(row),flush=True)
              assert status==200 and all(row["markers"]) and row["noindex"],p
              time.sleep(2)
          asset="/images/stage5-responsive/nimrod-fortress-132d143b45-384.webp"
          status,data=get(asset)
          assert status==200 and len(data)==43240 and data[:4]==b"RIFF" and data[8:12]==b"WEBP"
          print("LIVE_RESPONSIVE_ASSET",json.dumps({"path":asset,"bytes":len(data),"http":status}))
          PY
      - name: Repeat mobile measurements with two throttling methods
        run: |
          mkdir -p stage5-live-lighthouse
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import {spawnSync} from "node:child_process";
          const origin="https://saddlebrown-guanaco-454061.hostingersite.com",results=[];
          const paths=["/","/airport-transfers/","/travel-blog/","/tours/golan-heights/","/accommodation/","/attractions/old-city-jerusalem/"];
          const baseline=[{"device":"mobile","path":"/","documentStatus":200,"performance":74,"accessibility":96,"lcpMs":5584.507,"cls":0,"tbtMs":3,"transferBytes":1491882},{"device":"mobile","path":"/airport-transfers/","documentStatus":200,"performance":79,"accessibility":100,"lcpMs":5375.4165,"cls":0,"tbtMs":87.00000000000023,"transferBytes":1179152},{"device":"mobile","path":"/travel-blog/","documentStatus":200,"performance":100,"accessibility":100,"lcpMs":1413.243,"cls":0,"tbtMs":18,"transferBytes":1223415},{"device":"mobile","path":"/tours/golan-heights/","documentStatus":200,"performance":98,"accessibility":100,"lcpMs":1844.414,"cls":0,"tbtMs":27.5,"transferBytes":1558577},{"device":"mobile","path":"/accommodation/","documentStatus":200,"performance":76,"accessibility":96,"lcpMs":6343.5715,"cls":0,"tbtMs":8,"transferBytes":1951993},{"device":"mobile","path":"/attractions/old-city-jerusalem/","documentStatus":200,"performance":98,"accessibility":100,"lcpMs":1855.55,"cls":0,"tbtMs":31,"transferBytes":1439659}];
          let stop=false;
          for(const [method,rounds] of [["simulate",3],["devtools",1]]){
            if(stop)break;
            for(let round=1;round<=rounds&&!stop;round++){
              for(const p of paths){
                const file="stage5-live-lighthouse/"+method+"-"+round+"-"+(p==="/"?"home":p.replace(/^\/+|\/+$/g,"").replaceAll("/","_"))+".json";
                const args=[origin+p,"--throttling-method="+method,"--only-categories=performance,accessibility","--output=json","--output-path="+file,"--chrome-flags=--headless --no-sandbox --disable-dev-shm-usage","--max-wait-for-load=35000","--quiet"];
                const r=spawnSync("/tmp/stage5live/node_modules/.bin/lighthouse",args,{encoding:"utf8",timeout:125000,maxBuffer:2*1024*1024});
                let row;
                try{
                  const a=JSON.parse(fs.readFileSync(file,"utf8")),u=a.audits,net=u["network-requests"].details.items,m=u.metrics.details.items[0];
                  if(net.some(n=>n.statusCode===429)){stop=true;throw Error("429 rate limit; stop");}
                  if(a.runtimeError)throw Error(a.runtimeError.message);
                  const doc=net.find(n=>n.resourceType==="Document"&&n.url===origin+p);
                  if(!doc||doc.statusCode!==200)throw Error("Document not verified");
                  row={method,round,path:p,performance:Math.round(a.categories.performance.score*100),accessibility:Math.round(a.categories.accessibility.score*100),lcpMs:u["largest-contentful-paint"].numericValue,fcpMs:u["first-contentful-paint"].numericValue,observedLcp:m.observedLargestContentfulPaint,observedFcp:m.observedFirstContentfulPaint,cls:u["cumulative-layout-shift"].numericValue,tbtMs:u["total-blocking-time"].numericValue,bytes:u["total-byte-weight"].numericValue,scriptBytes:net.filter(x=>x.resourceType==="Script").reduce((s,x)=>s+x.transferSize,0),requests:net.length,scriptRequests:net.filter(x=>x.resourceType==="Script").length,benchmark:a.environment.benchmarkIndex,rtt:u["network-rtt"].numericValue,serverLatency:u["network-server-latency"].numericValue,version:a.lighthouseVersion,throttling:a.configSettings.throttling,accessibilityFailures:a.categories.accessibility.auditRefs.filter(x=>u[x.id]?.score===0).map(x=>({id:x.id,nodes:u[x.id].details?.items?.map(n=>n.node?.snippet).filter(Boolean)}))};
                }catch(e){row={method,round,path:p,error:String(e).slice(0,300),exit:r.status};if(/429|rate.limit/i.test(row.error))stop=true;}
                results.push(row);console.log("REPEAT_MOBILE",JSON.stringify(row));fs.writeFileSync("stage5-live-lighthouse/repeated-summary.json",JSON.stringify(results,null,2));
                if(stop)break;
                await new Promise(r=>setTimeout(r,8000));
              }
            }
          }
          const median=v=>{const s=[...v].sort((a,b)=>a-b);return s.length?s[Math.floor(s.length/2)]:null};
          const comparison=paths.map(path=>{const rows=results.filter(x=>x.path===path&&x.method==="simulate"&&!x.error),direct=results.find(x=>x.path===path&&x.method==="devtools"&&!x.error);const med=Object.fromEntries(["performance","accessibility","lcpMs","fcpMs","observedLcp","observedFcp","cls","tbtMs","bytes","scriptBytes","requests","scriptRequests","benchmark","rtt"].map(k=>[k,median(rows.map(x=>x[k]))]));return {path,before:baseline.find(x=>x.path===path),count:rows.length,median:med,range:{score:rows.map(x=>x.performance),lcp:rows.map(x=>x.lcpMs)},devtools:direct}});
          fs.writeFileSync("stage5-live-lighthouse/repeated-comparison.json",JSON.stringify(comparison,null,2));
          for(const row of comparison)console.log("REPEAT_COMPARISON",JSON.stringify(row));
          if(results.length!==24||results.some(x=>x.error))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-live-lighthouse
          path: stage5-live-lighthouse/
          if-no-files-found: warn
