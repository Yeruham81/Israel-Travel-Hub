name: One-time prelaunch technical crawl
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-time-prelaunch-crawl.yml']
permissions:
  contents: read
jobs:
  crawl:
    if: github.head_ref == 'audit/one-time-prelaunch-crawl-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install temporary browser
        run: |
          npm install --prefix /tmp/ith-crawl --no-save playwright@1.56.1
          /tmp/ith-crawl/node_modules/.bin/playwright install --with-deps chromium
      - name: Read-only public site crawl
        env:
          NODE_PATH: /tmp/ith-crawl/node_modules
          ORIGIN: https://saddlebrown-guanaco-454061.hostingersite.com
        run: |
          cat > /tmp/ith-crawl/audit.cjs <<'NODE'
          const { chromium, request } = require('playwright');
          const fs = require('node:fs');
          const origin = process.env.ORIGIN;
          const issues = [], pages = new Map(), assets = new Map();
          const issue = (page, type, detail) => issues.push({page,type,detail:String(detail).slice(0,500)});
          const pathname = u => new URL(u).pathname;
          const normalize = p => p === '/' ? '/' : p.replace(/\/+$/, '') + '/';
          const extract = xml => [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => new URL(m[1].replaceAll('&amp;','&')));
          const save = (extra = {}) => {
            const data = {origin, ...extra, checkedPages:pages.size, checkedAssets:assets.size, issues, pages:[...pages], assets:[...assets]};
            fs.writeFileSync('prelaunch-crawl.json', JSON.stringify(data,null,2));
            const counts = {};
            for (const x of issues) counts[x.type]=(counts[x.type]||0)+1;
            const md = ['# One-time prelaunch crawl', '', 'Pages checked: '+pages.size, 'Assets checked: '+assets.size, 'Findings: '+issues.length, '', ...Object.entries(counts).map(([k,v])=>'- '+k+': '+v), '', ...issues.slice(0,150).map(x=>'- '+x.type+' | '+x.page+' | '+x.detail.replace(/[\r\n]/g,' '))].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md+'\n');
            console.log(md);
          };
          (async()=>{
            const http=await request.newContext({timeout:20000});
            const expected=extract(fs.readFileSync('public/sitemap.xml','utf8')).map(u=>normalize(u.pathname));
            let live=[];
            try {
              const res=await http.get(origin+'/sitemap.xml');
              if(!res.ok()) throw Error('HTTP '+res.status());
              live=extract(await res.text());
              if(!live.length) throw Error('No sitemap locations');
            } catch(e){issue('/sitemap.xml','sitemap_fetch',e.message);}
            const urls=new Set([...expected,...live.map(u=>normalize(u.pathname))]);
            if(live.length){
              const livePaths=new Set(live.map(u=>normalize(u.pathname)));
              for(const p of expected) if(!livePaths.has(p)) issue(p,'missing_from_live_sitemap',p);
              for(const u of live) {
                if(u.origin!==origin) issue(u.pathname,'sitemap_origin',u.href);
                if(!expected.includes(normalize(u.pathname))) issue(u.pathname,'extra_live_sitemap',u.href);
              }
            }
            const browser=await chromium.launch({headless:true});
            const queue=[...urls];
            const links=[];
            async function worker(){
              const ctx=await browser.newContext({viewport:{width:1366,height:900},serviceWorkers:'block'});
              // Do not accept cookies, send enquiries or contact third-party hosts.
              await ctx.route('**/*',r=>{
                const u=new URL(r.request().url());
                return (u.origin===origin || !['http:','https:'].includes(u.protocol)) && ['GET','HEAD'].includes(r.request().method()) ? r.continue() : r.abort();
              });
              while(queue.length){
                const p=queue.shift();
                const page=await ctx.newPage();
                const track = (type, detail)=>issue(p,type,detail);
                page.on('pageerror',e=>track('javascript_exception',e.message));
                page.on('console',m=>{if(m.type()==='error' && /hydration|hydrating|Minified React error|uncaught|chunkloaderror/i.test(m.text())) track('browser_console',m.text());});
                page.on('requestfailed',r=>{if(r.url().startsWith(origin+'/') && !/ERR_ABORTED/.test(r.failure()?.errorText||'')) track('request_failed',r.url()+' '+r.failure()?.errorText);});
                page.on('response',r=>{if(r.url().startsWith(origin+'/') && r.status()>=400) track('http_resource_error',r.status()+' '+r.url());});
                try {
                  const response=await page.goto(origin+p,{waitUntil:'load',timeout:35000});
                  if(!response || response.status()!==200) track('page_http_status',response?.status());
                  if(normalize(pathname(page.url()))!==p || !page.url().startsWith(origin+'/')) track('unexpected_redirect',page.url());
                  await page.waitForTimeout(350);
                  const d=await page.evaluate(()=>{
                    const a=[...document.querySelectorAll('a[href]')].map(e=>e.getAttribute('href'));
                    const ids=[...document.querySelectorAll('[id],a[name]')].map(e=>e.id||e.getAttribute('name'));
                    const resources=[];
                    for(const e of document.querySelectorAll('img,source,script[src],link[rel="stylesheet"],link[rel="preload"],link[rel="modulepreload"],link[rel="icon"],iframe[data-consent-src],iframe[src]')){
                      for(const attr of ['src','href','data-consent-src']) if(e.getAttribute(attr)) resources.push({url:e.getAttribute(attr),kind:e.tagName.toLowerCase()});
                      if(e.getAttribute('srcset')) for(const s of e.getAttribute('srcset').split(',')) resources.push({url:s.trim().split(/\s+/)[0],kind:'srcset'});
                    }
                    return {a,ids,resources,title:document.title,h1:[...document.querySelectorAll('main h1,h1')].map(x=>x.textContent.trim()),bodyLength:document.body.innerText.length};
                  });
                  if(!d.h1.length || d.bodyLength<80 || d.h1.some(x=>/^404$|^page not found$|^this page didn't load$/i.test(x))) track('possible_soft_404',d.h1.join(' | '));
                  pages.set(p,{status:response?.status(),title:d.title,ids:d.ids});
                  for(const raw of d.a) {
                    try {
                      const u=new URL(raw,origin+p);
                      if(u.origin===origin) links.push({source:p,url:u.href});
                    } catch {track('invalid_link',raw);}
                  }
                  for(const r of d.resources){
                    try {
                      const u=new URL(r.url,origin+p);
                      if(u.origin===origin && !assets.has(u.href)) assets.set(u.href,{source:p,kind:r.kind});
                    } catch {track('invalid_resource',r.url);}
                  }
                  // One reload per template family is sufficient to test direct reload.
                  if(p==='/' || /^\/(accommodation|attractions|travel-blog|airport-transfers|tours|shore-excursions)\/$/.test(p)){
                    const rr=await page.reload({waitUntil:'domcontentloaded',timeout:30000});
                    if(rr?.status()!==200) track('reload_error',rr?.status());
                  }
                }catch(e){track('navigation_failure',e.message);pages.set(p,{error:e.message,ids:[]});}
                finally {await page.close();}
              }
              await ctx.close();
            }
            await Promise.all(Array.from({length:4},worker));
            const seenLinks=new Set();
            for(const l of links){
              if(seenLinks.has(l.source+' '+l.url)) continue;
              seenLinks.add(l.source+' '+l.url);
              const u=new URL(l.url);
              const p=normalize(u.pathname);
              if(pages.has(p)){
                if(u.hash && u.hash!=='#' && u.hash!=='#cookie-settings'){
                  let id;try{id=decodeURIComponent(u.hash.slice(1));}catch{id=u.hash.slice(1);}
                  if(!pages.get(p).error&&!pages.get(p).ids.includes(id)) issue(l.source,'missing_anchor',u.pathname+u.hash);
                }
              }else if(!assets.has(u.origin+u.pathname+u.search)) assets.set(u.origin+u.pathname+u.search,{source:l.source,kind:'internal_link'});
            }
            const assetQueue=[...assets];
            async function assetWorker(){
              while(assetQueue.length){
                const [url,meta]=assetQueue.shift();
                try{
                  const r=await http.get(url,{maxRedirects:5,timeout:18000});
                  const ct=r.headers()['content-type']||'';
                  const kind=meta.kind;
                  const status=r.status();
                  if(!r.ok()) issue(meta.source,kind==='internal_link'?'broken_internal_link':'broken_asset',status+' '+url);
                  else if(['img','srcset','source'].includes(kind)&&!ct.startsWith('image/')&&!ct.includes('octet-stream')) issue(meta.source,'unexpected_asset_type',ct+' '+url);
                  else if(kind==='script'&&ct.includes('text/html')) issue(meta.source,'unexpected_asset_type',ct+' '+url);
                  else if(kind==='internal_link'&&ct.includes('text/html')){
                    const body=await r.text();
                    if(/<h1[^>]*>\s*(404|Page not found)\s*<\/h1>/i.test(body)) issue(meta.source,'broken_internal_link','soft 404 '+url);
                    else issue(meta.source,'internal_link_outside_sitemap',url+' -> '+r.url());
                  }
                  assets.set(url,{...meta,status,contentType:ct});
                  await r.dispose();
                }catch(e){issue(meta.source,'asset_fetch_failure',url+' '+e.message);}
              }
            }
            await Promise.all(Array.from({length:8},assetWorker));
            const notFound=await http.get(origin+'/__ith_prelaunch_missing_20261124__/');
            if(notFound.status()!==404 && notFound.status()!==410) issue('/__ith_prelaunch_missing_20261124__/','missing_page_status',notFound.status());
            await browser.close();await http.dispose();
            save({sourceSitemapPages:expected.length,liveSitemapPages:live.length,internalLinks:seenLinks.size,missingPageStatus:notFound.status()});
          })().catch(e=>{issue('/','audit_error',e.stack||e);save();process.exitCode=1;});
          NODE
          node /tmp/ith-crawl/audit.cjs
      - name: Upload one-time findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-crawl-findings
          path: prelaunch-crawl.json
          if-no-files-found: warn
