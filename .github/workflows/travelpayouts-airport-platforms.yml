name: Generate Travelpayouts airport platform deeplinks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/travelpayouts/generate-airport-platforms.mjs'
      - 'scripts/travelpayouts/apply-airport-platforms.mjs'
      - '.github/workflows/travelpayouts-airport-platforms.yml'
permissions:
  contents: write
jobs:
  generate:
    if: contains(github.event.head_commit.message, '[generate-airport-affiliates]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate airport platform targets
        run: node scripts/travelpayouts/generate-airport-platforms.mjs --validate
      - name: Generate and validate exact affiliate URLs
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: node scripts/travelpayouts/generate-airport-platforms.mjs
      - name: Stage only approved tracking links
        run: node scripts/travelpayouts/apply-airport-platforms.mjs
      - name: Commit verified links
        run: |
          if git diff --quiet -- src/data/registry.ts; then
            echo "No new approved partner URLs"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/registry.ts
            git commit -m "Configure verified Travelpayouts airport booking links"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airport-platform-tracking-results
          path: artifacts/travelpayouts-airport-platforms.json
          if-no-files-found: warn
          retention-days: 14
