name: Optimize homepage image delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-homepage-image-delivery.yml"
      - "scripts/optimize_homepage_images.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-homepage-image-delivery
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Compress targeted images and update only matching homepage references
        run: python scripts/optimize_homepage_images.py
      - name: Inspect size reduction and image dimensions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          d = json.loads(Path('docs/HOMEPAGE_IMAGE_DELIVERY_REPORT.json').read_text())
          assert len(d['files']) == 5
          assert d['savedBytesTotal'] > 100000, d
          for f in d['files']:
              with Image.open(f['optimized']) as photo:
                  assert photo.format == 'WEBP'
                  assert photo.width <= f['sourceWidth']
              assert f['optimizedBytes'] < f['originalBytes'], f
          print("Saved", d['savedBytesTotal'], "bytes across five unchanged photographic compositions")
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked app dependencies
        run: bash scripts/install-ci-dependencies.sh
      - name: Verify homepage image delivery regressions
        run: bun x vitest run src/test/home-mobile-performance.test.ts
      - name: Commit optimized images and references after passing the focused tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/home/transfer-*-mobile.webp \
            src/assets/home/timna-park-feature-optimized.webp \
            src/routes/index.tsx src/test/home-mobile-performance.test.ts \
            docs/HOMEPAGE_IMAGE_DELIVERY_REPORT.json
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "Serve compact mobile transfer cards and compressed Timna homepage photo"
          git push origin HEAD:main
