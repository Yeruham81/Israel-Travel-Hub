name: Stage 5.5.5a - persist verified script patch and validate committed code
on:
  push:
    branches: [audit/lint-quality-stage5-scripts]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-5-5-5a-permanent
  cancel-in-progress: false
jobs:
  persist:
    if: github.ref == 'refs/heads/audit/lint-quality-stage5-scripts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5-5a-scripts-trial
          run-id: 46055305063
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Apply exact verified script patch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          9fd54f98b022d3edf6f8774a07ddb6438fab94f73e62baf80667c74e3119d5d6  stage-5-5-5a-scripts.patch
          HASHES
          )
          test "$(git rev-parse origin/main)" = cbc10d824589d0708b71c331505e3fd1a9f02936
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/audit/lint-quality-stage5-scripts)"
          git diff --exit-code
          if git apply --reverse --check "$out/stage-5-5-5a-scripts.patch"; then
            echo "Verified patch already present"
          else
            test "$(git rev-parse HEAD^)" = 70d25930d443b0a9259bcaeb210b08a337e10dea
            test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/lint-quality-stage5-scripts.yml
            git apply --check "$out/stage-5-5-5a-scripts.patch"
            git apply --index "$out/stage-5-5-5a-scripts.patch"
            git diff --cached --check
            python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"verified-trial"
          expected=set(json.loads((out/"changed.json").read_text()))
          scope=set(json.loads((out/"scope.json").read_text()))
          actual=set(subprocess.check_output(["git","diff","--cached","--name-only","-z"]).decode().split("\0"))-{""}
          assert len(expected)==48 and len(scope)==60 and expected<=scope
          assert actual==expected,(actual-expected,expected-actual)
          assert all((x.startswith("scripts/") and x.endswith((".js",".mjs",".cjs",".ts",".mts",".cts",".tsx",".jsx",".json"))) or x in {"eslint.config.js","vite.config.ts","vitest.config.ts","package.json","components.json","tsconfig.json",".prettierrc"} for x in actual)
          print("Exact verified scope:",len(actual),"script and configuration files")
          PY
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stage 5.5.5a: permanently apply verified script/config formatting patch'
            git push origin HEAD:refs/heads/audit/lint-quality-stage5-scripts
          fi
          git diff --exit-code
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Permanent commit: $(git rev-parse HEAD)"
  validate:
    needs: persist
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      CI_FUNCTIONAL_ONLY: "false"
      VITE_INDEXABLE: "true"
      VITE_CANONICAL_ORIGIN: https://www.israel-taxi.com
      HOSTINGER_STATIC_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.persist.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@v4
        with:
          name: stage-5-5-5a-scripts-trial
          run-id: 46055305063
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-trial
      - name: Verify permanent commit and exact patch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-trial"
          (cd "$out" && sha256sum -c <<'HASHES'
          9fd54f98b022d3edf6f8774a07ddb6438fab94f73e62baf80667c74e3119d5d6  stage-5-5-5a-scripts.patch
          HASHES
          )
          test "$(git rev-parse HEAD)" = "${{ needs.persist.outputs.commit }}"
          test "$(git rev-parse origin/main)" = cbc10d824589d0708b71c331505e3fd1a9f02936
          git merge-base --is-ancestor origin/main HEAD
          git apply --reverse --check "$out/stage-5-5-5a-scripts.patch"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/permanent-report"
          git rev-parse HEAD | tee "$RUNNER_TEMP/permanent-report/validated-commit.txt"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Build current main reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/main-reference" cbc10d824589d0708b71c331505e3fd1a9f02936
          cd "$RUNNER_TEMP/main-reference"
          bash scripts/install-ci-dependencies.sh
          bash scripts/build-validated-static.sh
      - name: Lint and check 60 script and configuration files
        run: |
          bun run lint
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import prettier from 'prettier';
          const scope=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'verified-trial','scope.json'),'utf8'));
          if(scope.length!==60)throw Error('Unexpected scope');
          for(const file of scope){
            const options=await prettier.resolveConfig(file);
            if(!await prettier.check(fs.readFileSync(file,'utf8'),{...options,filepath:file}))throw Error('Formatting failed '+file);
          }
          console.log('PASS: all 60 committed script and configuration files satisfy Prettier');
          JS
      - name: Build production and verify static export and strict TypeScript
        run: |
          node --test scripts/israel-events-source.test.mjs
          python3 scripts/test-deployment-storage.py
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-trial'
          for file in json.loads((out/'scope.json').read_text()):
              if file.endswith(('.js','.mjs','.cjs')):
                  subprocess.run(['node','--check',file],check=True)
          print('PASS: all JavaScript scripts parse with Node')
          PY
          bash scripts/build-validated-static.sh
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters
          node scripts/verify-hostinger-static-export.mjs --editorial
      - name: Compare committed production output with main
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/verified-trial/compare.py" "$RUNNER_TEMP/main-reference/.output/public" .output/public | tee "$RUNNER_TEMP/permanent-report/production-parity.txt"
      - name: Full regression on permanent commit
        shell: bash
        run: |
          set -euo pipefail
          VITE_INDEXABLE=false HOSTINGER_STATIC_BUILD=false bun run test 2>&1 | tee "$RUNNER_TEMP/permanent-report/regression.txt"
      - name: Guard authored source after validation
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only","-z"]).decode().split("\0"))-{""}
          allowed={"src/data/generated/guide-directory.ts","src/routeTree.gen.ts","public/sitemap.xml","public/robots.txt"}
          assert changed<=allowed,changed-allowed
          PY
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-5-5a-permanent-validation
          path: ${{ runner.temp }}/permanent-report/
          if-no-files-found: warn
