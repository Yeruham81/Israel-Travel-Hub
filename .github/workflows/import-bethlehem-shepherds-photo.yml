name: Import Bethlehem Shepherds Field licensed photo
on:
  push:
    paths:
      - .github/workflows/import-bethlehem-shepherds-photo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and optimize verified Wikimedia Commons source
        run: |
          set -euo pipefail
          mkdir -p src/assets/guides/bethlehem
          curl -fLsS --retry 4 --connect-timeout 25 --max-time 160 \
            -H "User-Agent: IsraelTravelHub-Editorial/1.0 (Wikimedia Commons attribution)" \
            -o /tmp/shepherds-field-source.jpg \
            "https://upload.wikimedia.org/wikipedia/commons/d/d2/Shepherds_Field_Chapel%2C_Roman_Catholic_%28Beit_Sahour%29-interior_%282%29.jpg"
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          src='/tmp/shepherds-field-source.jpg'
          out='src/assets/guides/bethlehem/shepherds-field-chapel.webp'
          with Image.open(src) as original:
              im=ImageOps.exif_transpose(original).convert('RGB')
              assert im.width > 1000 and im.height > 1000
              im.thumbnail((960, 720),Image.Resampling.LANCZOS)
              im.save(out,format='WEBP',quality=82,method=6)
          from pathlib import Path
          size=Path(out).stat().st_size
          assert 10000 < size < 250000
          print(f"Shepherds Field photo optimized: {size:,} bytes")
          PY
      - name: Commit locally hosted licensed image
        run: |
          set -euo pipefail
          git add src/assets/guides/bethlehem/shepherds-field-chapel.webp
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
             commit -m "Add licensed Shepherds Field photo (Armineaghayan, CC BY-SA 4.0)"
          git push origin HEAD:main
