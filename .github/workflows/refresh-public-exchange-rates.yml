name: Refresh public Bank of Israel FX snapshot

on:
  schedule:
    # Multiple off-peak checks so a delayed/dropped scheduled run is less
    # likely to leave the website without the latest published reference rates.
    - cron: '17 10,13,16,19 * * *'
  # Validate updater changes immediately without requiring a manual dispatch.
  # Data-only commits are excluded to avoid a refresh loop.
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-public-exchange-rates.mjs'
      - '.github/workflows/refresh-public-exchange-rates.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-fx-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate and refresh published reference rates
        run: node scripts/refresh-public-exchange-rates.mjs
      - name: Commit new official data only if publication changed
        run: |
          if git diff --quiet -- public/data/boi-exchange-rates.json; then
            echo "No new published rates. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/boi-exchange-rates.json
          git commit -m "Refresh public Bank of Israel currency rates"
          git pull --rebase origin main
          git push origin HEAD:main
