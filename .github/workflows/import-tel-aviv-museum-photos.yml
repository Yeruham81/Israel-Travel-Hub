name: One-off import of licensed Tel Aviv museum photographs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-tel-aviv-museum-photos.yml"

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image encoder
        run: python -m pip install --quiet Pillow
      - name: Retrieve the four supplied Commons photographs and optimize as local WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          from PIL import Image, ImageOps, UnidentifiedImageError
          from hashlib import md5
          import time

          # The filenames here identify the same Wikimedia Commons photographs
          # provided as attachments. Their source and licensing are cited in
          # the museum guide's Sources section.
          sources = {
              "bauhaus": "Bauhaus_Center_Tel_Aviv.JPG",
              "bialik": "Bialik_Bldg.jpg",
              "liebling": "Bauhaus_Tel-Aviv_museum.jpg",
              "rubin": "Rubin_Museum_Tel_Aviv,_Room_39.jpg",
          }
          target = Path("public/images/tel-aviv-museums")
          target.mkdir(parents=True, exist_ok=True)

          for museum, filename in sources.items():
              hashstr = md5(filename.encode("utf-8")).hexdigest()
              url = "https://upload.wikimedia.org/wikipedia/commons/{}/{}/{}".format(
                  hashstr[:1], hashstr[:2], quote(filename, safe="")
              )
              last_error = None
              for attempt in range(4):
                  try:
                      request = Request(url, headers={
                          "User-Agent": "IsraelTravelHub/1.0 (site image optimization; Wikimedia Commons)"
                      })
                      with urlopen(request, timeout=55) as response:
                          contents = response.read()
                      photo = ImageOps.exif_transpose(Image.open(BytesIO(contents))).convert("RGB")
                      break
                  except Exception as ex:
                      last_error = ex
                      print("Retry", museum, attempt + 1, str(ex), flush=True)
                      time.sleep(4 * (attempt + 1))
              else:
                  raise RuntimeError(f"Could not retrieve {museum}: {last_error}")
              if museum == "rubin":
                  photo = photo.crop((0, 0, photo.width, int(photo.height * 0.89)))
              photo.thumbnail((960, 760), Image.Resampling.LANCZOS)
              dest = target / f"{museum}.webp"
              for quality in (80, 76, 72, 68, 64):
                  photo.save(dest, "WEBP", quality=quality, method=6, exact=True)
                  if dest.stat().st_size <= 130000:
                      break
              print(museum, "source", url, "output", photo.size, dest.stat().st_size, "bytes", flush=True)
              assert dest.stat().st_size <= 190000
          PY
      - name: Commit photographs for review and publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/tel-aviv-museums/{bauhaus,bialik,liebling,rubin}.webp
          if ! git diff --staged --quiet; then
            git commit -m "Add four compressed Tel Aviv museum photographs"
            git push origin HEAD:main
          fi
