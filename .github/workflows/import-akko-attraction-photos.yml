name: Import historic Old Akko attraction photos once
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-akko-attraction-photos.yml]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and optimize historic-site photos with attribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/attractions
          curl -fL --retry 4 --retry-delay 2 --max-time 75 -A 'IsraelTravelHub-Guide/1.0 (Wikimedia photo import; attribution retained)' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/108248%20el%20basha%20hammam%20in%20acre%20PikiWiki%20Israel.jpg?width=800' \
            -o /tmp/akko-0.img
          curl -fL --retry 4 --retry-delay 2 --max-time 75 -A 'IsraelTravelHub-Guide/1.0 (Wikimedia photo import; attribution retained)' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20market%20in%20Acre%20(Akko)%20(373226896).jpg?width=800' \
            -o /tmp/akko-1.img
          curl -fL --retry 4 --retry-delay 2 --max-time 75 -A 'IsraelTravelHub-Guide/1.0 (Wikimedia photo import; attribution retained)' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Treasures%20in%20the%20Walls%2C%20Ethnographic%20Museum%2C%20Acre%2C%20Israel%20-%2001.JPG?width=800' \
            -o /tmp/akko-2.img
          curl -fL --retry 4 --retry-delay 2 --max-time 75 -A 'IsraelTravelHub-Guide/1.0 (Wikimedia photo import; attribution retained)' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Acco%20Ramhal%20Synagogue%20IMG%200281.JPG?width=800' \
            -o /tmp/akko-3.img
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          pairs = [["/tmp/akko-0.img","public/images/attractions/akko-turkish-bath.webp"],["/tmp/akko-1.img","public/images/attractions/akko-market.webp"],["/tmp/akko-2.img","public/images/attractions/akko-treasures-museum.webp"],["/tmp/akko-3.img","public/images/attractions/akko-ramchal-synagogue.webp"]]
          for source, dest in pairs:
            with Image.open(source) as im:
              im = im.convert('RGB')
              im.thumbnail((800,600))
              im.save(dest, 'WEBP', quality=77, method=6)
              print(dest, im.size)
          PY
      - name: Commit locally hosted photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/attractions/akko-turkish-bath.webp public/images/attractions/akko-market.webp public/images/attractions/akko-treasures-museum.webp public/images/attractions/akko-ramchal-synagogue.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add compressed Old Akko heritage attraction photographs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
