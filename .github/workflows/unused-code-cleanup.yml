name: Unused code cleanup - remaining route declarations
on:
  push:
    branches: [audit/unused-code-cleanup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-import-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      CI_FUNCTIONAL_ONLY: "false"
      VITE_INDEXABLE: "true"
      VITE_CANONICAL_ORIGIN: "https://www.israel-taxi.com"
      HOSTINGER_STATIC_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/install-ci-dependencies.sh
      - name: Build baseline and validate types
        run: |
          bash scripts/build-validated-static.sh
          npx tsc --noEmit --pretty false
          mkdir -p "$RUNNER_TEMP/unused-audit"
          cp -a .output/public "$RUNNER_TEMP/unused-audit-before"
      - name: Collect baseline and propose remaining route cleanup
        shell: bash
        run: |
          out="$RUNNER_TEMP/unused-audit"
          status=0
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters > "$out/before.txt" 2>&1 || status=$?
          cat "$out/before.txt"
          if [[ "$status" -gt 2 ]]; then exit "$status"; fi
          node --input-type=module <<'JS'
          import ts from 'typescript';
          import fs from 'node:fs';
          import path from 'node:path';
          const config = ts.findConfigFile('.', ts.sys.fileExists);
          const raw = ts.readConfigFile(config, ts.sys.readFile);
          if (raw.error) throw new Error('Cannot read tsconfig');
          const parsed = ts.parseJsonConfigFileContent(raw.config, ts.sys, path.dirname(config), { noUnusedLocals: true, noUnusedParameters: true, noEmit: true });
          if (parsed.errors.length) throw new Error('Cannot parse tsconfig');
          const targets = new Set([6133, 6192, 6196, 6198, 6199]);
          const manifest = [];
          // Only remove complete unused imports when the TS emitter already
          // omits them, or another emitted import of the same module remains.
          // This avoids deleting module initialization and deliberate effects.
          if (parsed.options.verbatimModuleSyntax !== false) throw new Error('Review module emission settings');
          const emitOptions = {...parsed.options, noEmit:false, declaration:false, declarationMap:false, sourceMap:false, inlineSourceMap:false, inlineSources:false, incremental:false, composite:false};
          function emittedModules(text, filename) {
            const result = ts.transpileModule(text,{compilerOptions:emitOptions,fileName:filename});
            const sf = ts.createSourceFile('emit.js',result.outputText,ts.ScriptTarget.Latest,true,ts.ScriptKind.JS);
            return new Set(sf.statements.filter(ts.isImportDeclaration).map(n=>n.moduleSpecifier.text));
          }
          function scope(file) {
            return /^src\/(routes|route-heads)\//.test(path.relative(process.cwd(),file.fileName).replaceAll(path.sep,'/')) && !file.isDeclarationFile;
          }
          function cleanLine(file,node) {
            const a=node.getStart(file), b=node.end;
            const lineStart=file.text.lastIndexOf('\n',a-1)+1;
            const lineEnd=file.text.indexOf('\n',b);
            if (!file.text.slice(lineStart,a).trim() && lineEnd>=0 && !file.text.slice(b,lineEnd).trim()) return {a:lineStart,b:lineEnd+1,replacement:''};
            return {a,b,replacement:''};
          }
          for (let round=1;round<=5;round++) {
            const program=ts.createProgram(parsed.fileNames,parsed.options);
            const groups=new Map();
            for (const d of ts.getPreEmitDiagnostics(program)) {
              if (!d.file || d.start==null || !targets.has(d.code) || !scope(d.file)) continue;
              if (!groups.has(d.file)) groups.set(d.file,[]);
              groups.get(d.file).push(d);
            }
            let count=0;
            for (const [file,ds] of groups) {
              const edits=[];
              // Only plain, local image URL imports can become unused as a
              // consequence of removing the reviewed, unused IMG table.
              const assetNames=new Map(file.statements.filter(ts.isImportDeclaration).filter(n=>n.importClause?.name && /^@\/assets\/[\w./-]+\.(?:webp|png|jpe?g|avif|gif)$/i.test(n.moduleSpecifier.text)).map(n=>[n.importClause.name.text,n.moduleSpecifier.text]));
              const imgDependencies=new Set();
              let removedImageTable=false;
              function pureImageValue(node) {
                if (ts.isStringLiteral(node)) return true;
                if (ts.isIdentifier(node)) {
                  const mod=assetNames.get(node.text);
                  if (!mod) return false;
                  imgDependencies.add(mod);
                  return true;
                }
                if (ts.isObjectLiteralExpression(node)) return node.properties.every(p=>ts.isPropertyAssignment(p) && (ts.isIdentifier(p.name)||ts.isStringLiteral(p.name)) && pureImageValue(p.initializer));
                return false;
              }
              const oldModules=emittedModules(file.text,file.fileName);
              for (const node of file.statements) {
                const a=node.getStart(file),b=node.end;
                const within=ds.filter(d=>d.start>=a&&d.start<b);
                if (!within.length) continue;
                if (ts.isImportDeclaration(node) && node.importClause && !node.attributes && !node.assertClause) {
                  const original=file.text.slice(a,b);
                  if (/\/\*|\/\//.test(original)) continue;
                  const clause=node.importClause, bindings=clause.namedBindings;
                  const names=[];
                  if (clause.name) names.push(clause.name);
                  if (bindings && ts.isNamedImports(bindings)) names.push(...bindings.elements);
                  if (bindings && ts.isNamespaceImport(bindings)) names.push(bindings.name);
                  const whole=within.some(d=>d.code===6192)||names.length>0&&names.every(n=>within.some(d=>[6133,6196].includes(d.code)&&d.start>=a&&d.start<n.end&&(d.start>=n.getStart(file)||names.length===1)));
                  if (!whole) continue;
                  const edit=cleanLine(file,node);
                  const proposed=file.text.slice(0,edit.a)+file.text.slice(edit.b);
                  if (oldModules.has(node.moduleSpecifier.text) && !emittedModules(proposed,file.fileName).has(node.moduleSpecifier.text)) {
                    console.log('RETAIN MODULE EFFECT',path.relative(process.cwd(),file.fileName),node.moduleSpecifier.text);
                    continue;
                  }
                  edits.push(edit);
                  manifest.push({round,file:path.relative(process.cwd(),file.fileName),kind:'unused import',module:node.moduleSpecifier.getText(file),removed:names.map(n=>n.getText(file))});
                } else if (path.relative(process.cwd(),file.fileName)==='src/routes/index.tsx' && ts.isVariableStatement(node) && !node.modifiers?.length && (node.declarationList.flags&ts.NodeFlags.Const) && node.declarationList.declarations.length===1) {
                  const d=node.declarationList.declarations[0];
                  // Explicitly reviewed dead image lookup table: no function
                  // calls, getters, computed keys, spreads or exported values.
                  if (!ts.isIdentifier(d.name)||d.name.text!=='IMG'||!d.initializer||!within.some(x=>x.code===6133&&x.start===d.name.getStart(file))) continue;
                  const init=ts.isSatisfiesExpression(d.initializer)?d.initializer.expression:d.initializer;
                  if (!ts.isObjectLiteralExpression(init)||!pureImageValue(init)) throw new Error('IMG initializer changed; review manually');
                  removedImageTable=true;
                  edits.push(cleanLine(file,node));
                  manifest.push({round,file:'src/routes/index.tsx',kind:'unused pure image table',removed:['IMG']});
                }
              }
              if (!edits.length) continue;
              let source=file.text;
              for (const e of edits.sort((a,b)=>b.a-a.a)) source=source.slice(0,e.a)+e.replacement+source.slice(e.b);
              // Check the combined edits too, in case multiple imports share a module.
              const nextModules=emittedModules(source,file.fileName);
              for (const mod of oldModules) {
                if (nextModules.has(mod)) continue;
                if (removedImageTable && imgDependencies.has(mod)) {
                  console.log('UNUSED IMAGE URL AFTER IMG REMOVAL',path.relative(process.cwd(),file.fileName),mod);
                  continue;
                }
                throw new Error('Runtime module removed: '+file.fileName+' '+mod);
              }
              fs.writeFileSync(file.fileName,source);
              count+=edits.length;
            }
            console.log('ROUND',round,'EDITS',count);
            if (!count) break;
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'unused-audit','manifest.json'),JSON.stringify(manifest,null,2));
          console.log('PROPOSED REMAINING ROUTE EDITS',JSON.stringify(manifest,null,2));
          JS
          git diff --check
          git diff -- src/routes src/route-heads > "$out/stage-1-remaining.patch"
          sha256sum "$out/stage-1-remaining.patch"
          git diff --stat
      - name: Validate candidate diagnostics
        run: |
          out="$RUNNER_TEMP/unused-audit"
          status=0
          npx tsc --noEmit --pretty false --noUnusedLocals --noUnusedParameters > "$out/after.txt" 2>&1 || status=$?
          cat "$out/after.txt"
          if [[ "$status" -gt 2 ]]; then exit "$status"; fi
          python3 - <<'PY'
          import pathlib, os, re, collections
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'unused-audit'
          unused={6133,6192,6196,6198,6199}
          def read(name):
              counter=collections.Counter()
              for line in (root/name).read_text().splitlines():
                  m=re.match(r'^(.*?)\(\d+,\d+\): error TS(\d+): (.*)$',line)
                  if m:
                      counter[(m[1],int(m[2]),m[3])]+=1
                  elif re.search(r'error TS\d+:',line):
                      raise SystemExit('Unclassified compiler diagnostic: '+line)
              return counter
          before,after=read('before.txt'),read('after.txt')
          def group(p):
              if p.startswith(('src/routes/','src/route-heads/')): return 'routes'
              if p.startswith(('src/components/','src/data/')): return 'components/data'
              if p.startswith('src/test/') or '.test.' in p or '.spec.' in p: return 'tests'
              return 'other'
          for label, items in [('BEFORE',before),('AFTER',after)]:
              print(label,'unused',sum(n for (p,c,m),n in items.items() if c in unused),'other',sum(n for (p,c,m),n in items.items() if c not in unused))
              print(label,'groups',dict(collections.Counter({g:sum(n for (p,c,m),n in items.items() if c in unused and group(p)==g) for g in ('routes','components/data','tests','other')})))
          remaining=sum(n for (p,c,m),n in after.items() if c in unused and group(p)=='routes')
          print('REMAINING ROUTE DIAGNOSTICS',remaining)
          new=after-before
          if new:
              print('NEW DIAGNOSTICS',new)
              raise SystemExit('Candidate introduced new diagnostics')
          PY
          npx tsc --noEmit --pretty false
      - name: Build candidate and run regression suite
        run: |
          bash scripts/build-validated-static.sh
          node scripts/verify-hostinger-static-export.mjs --editorial
          VITE_INDEXABLE=false HOSTINGER_STATIC_BUILD=false bun run test
      - name: Compare all emitted HTML and SEO files
        run: |
          cat > "$RUNNER_TEMP/unused-audit/compare.py" <<'PY'
          import collections, hashlib, json, pathlib, re, sys, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, urljoin, unquote
          base, candidate = [pathlib.Path(s) for s in sys.argv[1:3]]
          origin = "https://www.israel-taxi.com"
          markers = re.compile(rb"lovable|tanstack_start_ts|7cd7aae9-57c0-4ced-b1fa-2f0691483fee|sandbox-npm-cache", re.I)
          def digest(data): return hashlib.sha256(data).hexdigest()
          def manifest(root):
              return {str(p.relative_to(root)):p for p in root.rglob("*") if p.is_file()}
          old, new = manifest(base), manifest(candidate)
          def urls(root):
              return [node.text for node in ET.parse(root/"sitemap.xml").getroot().findall("{*}url/{*}loc")]
          old_urls, new_urls = urls(base), urls(candidate)
          issues = []
          def check(ok, message):
              if not ok: issues.append(message)
          check(old_urls == new_urls, "Ordered sitemap URL list changed")
          check((base/"robots.txt").read_bytes() == (candidate/"robots.txt").read_bytes(), "robots.txt changed")
          old_html, new_html = {p for p in old if p.endswith(".html")}, {p for p in new if p.endswith(".html")}
          check(old_html == new_html, "HTML paths differ: removed="+str(sorted(old_html-new_html))+" added="+str(sorted(new_html-old_html)))
          def norm(value, root):
              if value is None: return ""
              # Preserve actual image/font identity even if the bundler changes its hashed filename.
              def asset(m):
                  path = m.group(0)
                  local = root / path.lstrip("/")
                  if local.is_file(): return "/asset-content/"+digest(local.read_bytes())
                  return path
              value = re.sub(r"/assets/[A-Za-z0-9_.-]+\.(?:webp|avif|png|jpe?g|svg|gif|woff2?|ico)\b",asset,value,flags=re.I)
              return re.sub(r"(?<=:)[rR][a-zA-Z0-9_]+(?=:)", "react-id", value)
          class Page(HTMLParser):
              def __init__(self, root):
                  super().__init__(convert_charrefs=True)
                  self.root=root; self.body=False; self.skip=0; self.title=False; self.schema=False
                  self.meta=[]; self.data=[]; self.structure=[]; self.jsonld=[]; self.title_parts=[]; self.links=[]; self.assets=[]; self.schemas=[]; self.forms=0; self.images=0
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="body": self.body=True
                  if tag=="title": self.title=True
                  if tag=="meta": self.meta.append(tuple(sorted((k,norm(v,self.root)) for k,v in attrs)))
                  if tag=="link" and d.get("rel")=="canonical": self.meta.append(("canonical",d.get("href")))
                  if tag=="script":
                      self.skip+=1
                      if d.get("type")=="application/ld+json": self.schema=True; self.jsonld=[]
                  if tag=="style": self.skip+=1
                  if tag=="script" and d.get("src"): self.assets.append(d["src"])
                  if tag=="link" and d.get("rel") in ("stylesheet","modulepreload","preload") and d.get("href"): self.assets.append(d["href"])
                  if not self.body or self.skip or tag=="link": return
                  if tag=="form": self.forms+=1
                  if tag=="img": self.images+=1
                  if tag=="a" and d.get("href"): self.links.append(d["href"])
                  for k in ("src","poster","data-consent-src"):
                      if d.get(k): self.assets.append(d[k])
                  if d.get("srcset"):
                      self.assets.extend(s.strip().split()[0] for s in d["srcset"].split(",") if s.strip() and not s.strip().startswith("data:"))
                  self.structure.append((tag,tuple(sorted((k,norm(v,self.root)) for k,v in attrs if k not in ("data-tsd-source",)))))
              def handle_startendtag(self,tag,attrs): self.handle_starttag(tag,attrs)
              def handle_endtag(self,tag):
                  if tag=="title": self.title=False
                  if tag=="script" and self.schema:
                      self.schemas.append(json.loads("".join(self.jsonld))); self.schema=False
                  if tag in ("script","style"): self.skip=max(0,self.skip-1); return
                  if self.body and not self.skip and tag!="link": self.structure.append(("/"+tag,()))
                  if tag=="body": self.body=False
              def handle_data(self,data):
                  if self.title: self.title_parts.append(data)
                  if self.schema: self.jsonld.append(data)
                  if self.body and not self.skip:
                      s=" ".join(data.split())
                      if s:self.data.append(s)
          def page(root,url):
              rel=urlsplit(url).path.strip("/")
              p=Page(root)
              p.feed((root/rel/"index.html").read_text(encoding="utf-8"))
              return p
          def schema_norm(v,root):
              if isinstance(v,str): return norm(v,root)
              if isinstance(v,list): return [schema_norm(x,root) for x in v]
              if isinstance(v,dict): return {k:schema_norm(x,root) for k,x in v.items()}
              return v
          def missing_assets(p,root,url):
              missing=set()
              for a in p.assets:
                  if a.startswith(("data:","blob:","#")): continue
                  u=urlsplit(urljoin(url,a))
                  if u.netloc!="www.israel-taxi.com" or u.path.startswith("/api/"): continue
                  path=root/unquote(u.path.lstrip("/"))
                  if not path.is_file() and not (path/"index.html").is_file(): missing.add(a)
              return missing
          stats=collections.Counter(); by_kind=collections.Counter()
          for url in new_urls:
              a,b=page(base,url),page(candidate,url)
              for kind,x,y in [
                  ("title",a.title_parts,b.title_parts),("metadata",sorted(map(str,a.meta)),sorted(map(str,b.meta))),
                  ("structured data",schema_norm(a.schemas,base),schema_norm(b.schemas,candidate)),
                  ("visible text",a.data,b.data),("body tags and attributes",a.structure,b.structure),
                  ("links",a.links,b.links),("forms",a.forms,b.forms),("images",a.images,b.images)]:
                  if x!=y:
                      by_kind[kind]+=1
                      if by_kind[kind]<=4:
                          if isinstance(x,list) and isinstance(y,list):
                              first=next(((str(xx)[:250],str(yy)[:250]) for xx,yy in zip(x,y) if xx!=yy),("length "+str(len(x)),"length "+str(len(y))))
                              print("DIFFERENCE",url,kind,first)
                          else: print("DIFFERENCE",url,kind,str(x)[:150],str(y)[:150])
              added_missing=missing_assets(b,candidate,url)-missing_assets(a,base,url)
              check(not added_missing, "New missing assets on "+url+": "+str(sorted(added_missing)))
              stats.update(pages=1, forms=b.forms, links=len(b.links), images=b.images, schemas=len(b.schemas))
          print("PAGE TOTALS",dict(stats))
          print("PAGE DIFFERENCES",dict(by_kind))
          for kind,n in by_kind.items(): issues.append(str(n)+" pages differ in "+kind)
          # Public helpers/data, images and maps must not be altered by the build migration.
          for p in sorted(set(old)|set(new)):
              if p.startswith(("maps/","widgets/","images/","data/")):
                  check(p in old and p in new and digest(old[p].read_bytes())==digest(new[p].read_bytes()),"Public helper/asset changed: "+p)
          for name,p in new.items():
              data=p.read_bytes()
              check(not markers.search(data) and not markers.search(name.encode()),"Legacy marker in generated file "+name)
              check(not (name.endswith(".php") or name.startswith("api/") or name in (".env",".htaccess") or name.endswith(".map")),"Unexpected private/API/source-map export: "+name)
          print("GENERATED FILES",len(old),len(new),"HTML",len(old_html),len(new_html))
          for ext in (".js",".css",".html"):
              aa=[p.stat().st_size for k,p in old.items() if k.endswith(ext)]
              bb=[p.stat().st_size for k,p in new.items() if k.endswith(ext)]
              print("OUTPUT SIZE",ext,"before",len(aa),sum(aa),"after",len(bb),sum(bb))
          print("LEGACY MARKER SCAN AND PARITY ISSUES",len(issues))
          for issue in issues[:100]: print("ISSUE",issue)
          if issues: sys.exit(1)
          print("PASS: page content, metadata, schema, links, forms, public helpers, assets and legacy marker scan")
          PY
          python3 "$RUNNER_TEMP/unused-audit/compare.py" "$RUNNER_TEMP/unused-audit-before" .output/public
          git diff --check
          git diff --stat
      - name: Save diagnostics and proposed patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unused-code-stage-1-remaining-proposal
          path: ${{ runner.temp }}/unused-audit/
          if-no-files-found: warn
