name: Import licensed Haifa museum photographs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-haifa-museum-photos.yml"
permissions:
  contents: write
concurrency:
  group: haifa-museums-photo-import
  cancel-in-progress: false
jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-haifa-museum-photos]')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate importer and verify the three Commons licenses
        run: |
          node --check scripts/import-haifa-museum-photos.mjs
          node scripts/import-haifa-museum-photos.mjs
      - name: Compress all three downloaded photographs as local WebP
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageOps
          base = Path(os.environ["RUNNER_TEMP"])/"haifa-museum-image-source"
          target = Path("public/images/haifa-museums")
          target.mkdir(parents=True, exist_ok=True)
          for name in ("hecht","struck","mane-katz"):
              with Image.open(base/(name+".jpg")) as source:
                  source = ImageOps.exif_transpose(source).convert("RGB")
                  if min(source.size) < 640: raise ValueError("Source image too small: "+name)
                  output = ImageOps.fit(source,(700,525),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
                  output.save(target/(name+".webp"),"WEBP",quality=79,method=6)
              data=(target/(name+".webp")).read_bytes()
              if not (data[:4]==b"RIFF" and data[8:12]==b"WEBP" and 10000<len(data)<180000):
                  raise ValueError("Invalid WebP: "+name+", size="+str(len(data)))
              print(name, "700x525 WebP", len(data), "bytes")
          PY
      - name: Commit verified photo binaries and matching page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/haifa-museums/{hecht,struck,mane-katz}.webp src/data/haifaMuseumPhotos.ts src/data/haifaMuseums.test.ts src/components/HaifaMuseumsGuide.tsx
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "Complete ten Haifa museum cards with licensed optimized photographs"
          git pull --rebase origin main
          git push origin HEAD:main
